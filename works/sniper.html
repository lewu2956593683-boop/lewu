    if (e.panic > 0) e.panic -= dt;

    var moving = false, vx = 0;
    switch (e.state) {
      case 'walk':
        vx = e.dir * e.speed * (e.limp > 0 ? 0.5 : 1);
        moving = true;
        if (Math.random() < dt * (e.job.id === 'guard' ? 0.18 : 0.07)) {
          var roll = Math.random();
          if (roll < 0.30) { e.state = 'idle'; e.timer = 1.5 + Math.random() * 3.5; }
          else if (roll < 0.52 || e.job.id === 'smoker') { e.state = 'smoke'; e.timer = 3 + Math.random() * 4; }
          else if (roll < 0.70) { e.state = 'talk'; e.timer = 2 + Math.random() * 3; }
          else if (e.job.id === 'sweeper') { e.state = 'sweep'; e.timer = 3 + Math.random() * 4; }
          else if (e.job.id === 'water') { e.state = 'draw'; e.timer = 3 + Math.random() * 3; }
          else { e.state = 'idle'; e.timer = 1.5 + Math.random() * 3.5; }
        }
        // 提水的会往河边走
        if (e.job.id === 'water' && Math.random() < dt * 0.25) e.zv = rnd(0.03, 0.09) * (e.z < 0.8 ? 1 : -1);
        break;
      case 'idle':
        e.timer -= dt;
        if (Math.random() < dt * 0.7) FX.breathe(e.x + e.dir * 2, e.baseY - Math.round(20 * e.S));
        if (e.timer <= 0) { e.state = 'walk'; if (chance(0.18)) e.dir = -e.dir; }
        break;
      case 'smoke':
        e.timer -= dt;
        if (Math.random() < dt * 2.5) FX.breathe(e.x + e.dir * 2, e.baseY - Math.round(22 * e.S));
        if (e.timer <= 0) e.state = 'walk';
        break;
      case 'talk':
        e.timer -= dt; if (e.timer <= 0) e.state = 'walk';
        break;
      case 'sweep':
        e.timer -= dt;
        if (Math.random() < dt * 1.6) {
          FX.snowBurst(e.x + e.dir * Math.round(5 * e.S), e.baseY, 3, 22);
        }
        if (e.timer <= 0) e.state = 'walk';
        break;
      case 'draw':
        e.timer -= dt;
        if (e.timer <= 0) { e.state = 'walk'; if (chance(0.5)) e.dir = -e.dir; }
        break;
      case 'startle':
        e.timer -= dt;
        if (e.timer <= 0) {
          e.panic = Math.max(e.panic, 3);
          if (chance(0.6)) {
            e.state = 'run';
            e.dir = e.fleeDir || e.dir;    // 从「看向声源」转为「背对声源逃跑」
          } else { e.state = 'cower'; e.timer = 2 + Math.random() * 3; }
        }
        break;
      case 'run':
        e.zigT += dt;
        e.zig = Math.sin(e.zigT * 3.2) * 0.45;
        vx = e.fleeDir * e.speed * (2.3 + e.zig) * (e.limp > 0 ? 0.6 : 1);
        moving = true;
        // 逃跑时也会往堤岸深处/浅处乱窜
        e.z += Math.sin(e.zigT * 1.7 + e.seed) * dt * 0.10;
        if (e.panic <= 0) { e.state = 'walk'; e.dir = e.fleeDir; }
        break;
      case 'hide':
        vx = e.fleeDir * e.speed * 2.0 * (e.limp > 0 ? 0.6 : 1);
        moving = true;
        if (e.targetX !== null) {
          if ((e.fleeDir > 0 && e.x >= e.targetX - 2) || (e.fleeDir < 0 && e.x <= e.targetX + 2)) {
            e.state = 'cower'; e.timer = 3 + Math.random() * 4;
          }
        }
        if (e.panic <= 0 && e.state === 'hide') e.state = 'walk';
        break;
      case 'cower':
        e.timer -= dt;
        if (e.timer <= 0 && e.panic <= 0) e.state = 'walk';
        else if (e.timer <= 0) e.timer = 1 + Math.random() * 2;
        break;
      case 'stagger':
        e.timer -= dt;
        if (e.timer <= 0) {
          if (e.hp <= 0) startDeath(e, null);
          else if (e.hp < 45) { e.state = 'crawl'; e.timer = 99; }
          else {
            e.panic = Math.max(e.panic, 4);
            // 受伤后往远离枪口的方向撤：朝向与移动方向必须一致
            if (!e.fleeDir) e.fleeDir = chance(0.5) ? -1 : 1;
            e.dir = e.fleeDir;
            e.state = chance(0.6) ? 'run' : 'hide';
            e.targetX = nearestCover(e.x);
            if (e.state === 'hide' && e.targetX !== null) {
              e.fleeDir = (e.targetX < e.x) ? -1 : 1;
              e.dir = e.fleeDir;
            }
          }
        }
        break;
      case 'limp':
        vx = e.dir * e.speed * 0.45; moving = true;
        if (e.panic <= 0 && Math.random() < dt * 0.2) e.state = 'walk';
        break;
      case 'crawl':
        vx = e.dir * 3.2 * e.S; moving = true;
        // 爬行留下血痕
        if (Math.random() < dt * 6) FX.smear(e.x, e.baseY, e.dir, e.S);
        break;
      case 'fall':
        stepDeath(e, dt);
        return;
    }

    if (moving) {
      e.x += vx * dt;
      e.stepAcc += Math.abs(vx * dt);
      if (e.stepAcc > 6) {
        e.stepAcc = 0;
        if (e.state !== 'crawl') FX.footprint(e.x, e.baseY, e.dir, e.S * 0.9);
      }
    }
    e.phase += (moving ? dt * (e.state === 'run' || e.state === 'hide' ? 13 : e.state === 'crawl' ? 5 : 7.5) : 0);

    // 呼吸白气
    e.breath -= dt;
    if (e.breath <= 0) {
      e.breath = 2.5 + Math.random() * 3.5;
      if (e.state !== 'fall') FX.breathe(e.x + e.dir * 3, e.baseY - Math.round(24 * e.S));
    }

    // 狗
    if (e.dog) updDog(e, dt);

    // 失血
    if (e.hp < 100 && e.hp > 0) {
      e.bleed -= dt;
      var sev = 1 - e.hp / 100;
      if (e.bleed <= 0) {
        e.bleed = 1.1 - sev * 0.7;
        FX.drip(e.x + (Math.random() - 0.5) * 4, e.baseY - Math.round(14 * e.S), e.baseY, 1 + (sev > 0.6 ? 1 : 0));
        e.hp -= 3 + sev * 5;
        if (e.hp <= 0) { e.hp = 0; startDeath(e, e.state === 'crawl' ? 'crawlDeath' : null); }
      }
    }
    if (e.limp > 0) e.limp -= dt * 0.2;
  }

  /* 深度漫游：让敌人在堤岸上前后自由移动 */
  function roamDepth(e, dt) {
    var st = e.state;
    if (st === 'fall' || st === 'corpse' || st === 'crawl' || st === 'cower') return;
    if (Math.random() < dt * 0.35) {
      var want = rnd(-0.05, 0.05);
      if (e.z > 0.85) want = -Math.abs(want);
      if (e.z < 0.15) want = Math.abs(want);
      e.zv = want;
    }
    e.z += e.zv * dt;
    if (e.z < 0.05) { e.z = 0.05; e.zv = Math.abs(e.zv) * 0.8; }
    if (e.z > 0.95) { e.z = 0.95; e.zv = -Math.abs(e.zv) * 0.8; }
    applyDepth(e);
  }

  function updDog(e, dt) {
    var dg = e.dog;
    dg.t += dt;
    if (e.dead) {
      dg.state = 'mourn';
      dg.ph += dt * 1.2;
    } else {
      dg.ph += dt * 8;
      if (Math.random() < dt * 0.12) dg.state = 'sniff';
      if (dg.state === 'sniff' && Math.random() < dt * 0.4) dg.state = 'follow';
    }
  }

  /* ============================================================
     死亡：10 种方式
     ============================================================ */
  var DEATH_DEF = {
    back: { dur: 0.85 },
    forward: { dur: 0.72 },
    spin: { dur: 1.05 },
    crumble: { dur: 1.15 },
    kneel: { dur: 1.45 },
    fling: { dur: 0.95 },
    trip: { dur: 1.00 },
    slide: { dur: 1.25 },
    crawlDeath: { dur: 1.10 },
    overQuay: { dur: 1.55 }
  };

  function pickDeath(e, part) {
    // 站在堤沿（最靠前）的人有机会翻下河堤
    if (e.z > 0.88 && chance(0.32)) return 'overQuay';
    if (part === 'head') {
      var r = Math.random();
      if (r < 0.42) return 'crumble';
      if (r < 0.72) return 'back';
      if (r < 0.88) return 'fling';
      return 'spin';
    }
    if (e.state === 'crawl') return 'crawlDeath';
    if (e.state === 'cower' || e.state === 'draw') return chance(0.6) ? 'slide' : 'crumble';
    if (e.state === 'run' || e.state === 'hide') {
      var q = Math.random();
      if (q < 0.42) return 'trip';
      if (q < 0.72) return 'forward';
      if (q < 0.90) return 'fling';
      return 'spin';
    }
    if (part === 'leg') return chance(0.5) ? 'kneel' : 'crawlDeath';
    var s = Math.random();
    if (s < 0.30) return 'back';
    if (s < 0.48) return 'spin';
    if (s < 0.64) return 'kneel';
    if (s < 0.80) return 'forward';
    if (s < 0.92) return 'fling';
    return 'crumble';
  }

  function startDeath(e, forced) {
    if (e.state === 'fall' || e.state === 'corpse') return;
    var type = forced || pickDeath(e, e.lastPart || 'torso');
    e.deathType = type;
    e.deathT = 0;
    e.deathDur = (DEATH_DEF[type] || { dur: 1 }).dur;
    e.lay = 0;
    e.state = 'fall';
    e.dead = true;
    e.fatal = true;
    e.deathDir = (type === 'forward' || type === 'trip') ? e.dir : -e.dir;
    if (type === 'overQuay') e.deathDir = chance(0.5) ? 1 : -1;
    e.deathSeed = Math.random() * 100;
    // 起手血
    if (type !== 'crumble') FX.addPool(e.x, e.baseY, e.S * 1.1, 1.1);
    if (e.dog) e.dog.state = 'mourn';
  }
  E.startDeath = startDeath;

  function stepDeath(e, dt) {
    e.deathT += dt;
    e.lay = clamp(e.deathT / e.deathDur, 0, 1);
    var t = e.lay;

    // 各类型特有的位移
    if (e.deathType === 'fling') {
      e.x += e.deathDir * 34 * dt * (1 - t);
      e.dy = -Math.sin(t * Math.PI) * 16 * e.S;
    } else if (e.deathType === 'trip') {
      e.x += e.dir * 26 * dt * (1 - t * 0.6);
      e.dy = -Math.sin(t * Math.PI) * 5 * e.S;
    } else if (e.deathType === 'overQuay') {
      // 翻过石堤，坠向河面
      if (t < 0.55) {
        e.x += e.deathDir * 10 * dt;
        e.dy = t / 0.55 * 8;
      } else {
        var k = (t - 0.55) / 0.45;
        e.dy = 8 + k * k * (G.RIVER_TOP + 5 - e.baseY);
        if (chance(dt * 8)) FX.snowBurst(e.x, e.baseY + e.dy, 2, 12);
      }
    } else {
      e.dy = 0;
    }
    if (e.dy === undefined) e.dy = 0;

    // 落地冲击（身体拍在雪地上）
    var landT = e.deathType === 'crumble' ? 0.85 : (e.deathType === 'kneel' ? 0.55 : 0.62);
    if (!e.landed && t >= landT) {
      e.landed = true;
      var ly = e.baseY + (e.dy || 0);
      if (e.deathType === 'overQuay') {
        FX.waterSplash(e.x, Math.min(ly, G.RIVER_TOP + 4), 16);
        FX.iceShards(e.x, G.RIVER_TOP + 2, 8);
        FX.addPool(e.x, G.RIVER_TOP + 3, e.S, 1.4);
        PS.Audio && PS.Audio.splash && PS.Audio.splash();
      } else {
        FX.snowBurst(e.x, ly, 16, 52);
        FX.addPool(e.x + Math.round(e.deathDir * 6 * e.S), ly, e.S * 1.3, 1.9);
        if (e.deathType === 'fling' || e.deathType === 'trip') FX.snowBurst(e.x, ly, 14, 40);
      }
    }

    if (e.lay >= 1) {
      e.state = 'corpse';
      e.deadT = 0;
      e.finalY = e.baseY + (e.dy || 0);
      if (e.deathType === 'kneel' || e.deathType === 'slide') {
        FX.addPool(e.x + Math.round(e.deathDir * 4 * e.S), e.finalY, e.S * 0.9, 0.9);
      }
    }
  }

  /* ============================================================
     受伤接口
     ============================================================ */
  E.hurt = function (e, part, dmg, dirx, diry) {
    if (e.dead || e.state === 'fall' || e.state === 'corpse') return false;
    e.hp -= dmg;
    e.lastPart = part;
    e.wound[part === 'arm' ? 'arm' : part] = (e.wound[part] || 0) + 1;
    var hx = e.x, hy = e.baseY - Math.round((part === 'head' ? 24 : part === 'torso' ? 15 : part === 'arm' ? 16 : 8) * e.S);

    if (part === 'head') {
      FX.sprayBlood(hx, hy, dirx, diry, 130, 'head', e.baseY);
      FX.addPool(e.x, e.baseY, e.S * 1.1, 0.8);
      e.hp = 0;
    } else if (part === 'torso') {
      FX.sprayBlood(hx, hy, dirx, diry, 85, 'torso', e.baseY);
      FX.addPool(e.x, e.baseY, e.S * 0.85, 0.5);
    } else if (part === 'arm') {
      FX.sprayBlood(hx, hy, dirx, diry, 40, 'limb', e.baseY);
      e.limp = 2;
    } else {
      FX.sprayBlood(hx, hy, dirx, diry, 55, 'limb', e.baseY);
      e.limp = 4;
    }

    if (e.hp <= 0) {
      e.hp = 0; e.bleed = 0;
      startDeath(e, null);
      return true;
    }
    e.state = 'stagger'; e.timer = 0.22;
    e.panic = Math.max(e.panic, 6);
    return false;
  };

  /* ============================================================
     噪声 / 恐慌
     ============================================================ */
  E.noise = function (nx, ny, power, onHit) {
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.dead || e.state === 'fall' || e.state === 'corpse') continue;
      var d = Math.hypot(e.x - nx, (e.baseY - ny) * 2.2);
      var reach = power * (onHit ? 1.5 : 1.0);
      if (d > reach) continue;
      var intensity = 1 - d / reach;
      e.seen = true;
      if (e.panic > 0 && chance(0.4)) continue;
      e.panic = Math.max(e.panic, 2.5 + intensity * 6);
      var roll = Math.random();
      if (roll < 0.42) {
        e.state = 'run';
        e.fleeDir = (e.x < nx) ? -1 : 1;
        e.dir = e.fleeDir;                 // 朝向必须跟着跑的方向，否则就是倒着跑
        if (chance(0.35)) {
          var sp = nearestCover(e.x);
          if (sp !== null) {
            e.state = 'hide'; e.targetX = sp;
            e.fleeDir = (sp < e.x) ? -1 : 1;
            e.dir = e.fleeDir;
          }
        }
      } else if (roll < 0.72) {
        e.state = 'cower'; e.timer = 1.5 + Math.random() * 3;
      } else {
        // 惊觉：先扭头看向声音来源（还没决定往哪跑）
        e.state = 'startle'; e.timer = 0.35 + Math.random() * 0.3;
        e.fleeDir = (e.x < nx) ? -1 : 1;
        e.dir = (e.x < nx) ? 1 : -1;
      }
      e.zigT = 0;
      if (e.dog) e.dog.state = 'flee';
    }
  };

  function nearestCover(x) {
    var best = null, bd = 1e9;
    var cs = PS.World.covers;
    for (var i = 0; i < cs.length; i++) {
      var cx = cs[i].x + cs[i].w / 2;
      var d = Math.abs(cx - x);
      if (d < bd && d < 130) { bd = d; best = cx; }
    }
    return best;
  }

  /* ============================================================
     命中判定（近的优先）
     ============================================================ */
  E.hitTest = function (px, py) {
    var order = list.slice().sort(function (a, b) { return b.z - a.z; });
    for (var i = 0; i < order.length; i++) {
      var e = order[i];
      if (e.dead) continue;
      var h = boxes(e);
      if (inBox(h.head, px, py)) return { e: e, part: 'head' };
      if (inBox(h.torso, px, py)) return { e: e, part: 'torso' };
      if (inBox(h.armA, px, py) || inBox(h.armB, px, py)) return { e: e, part: 'arm' };
      if (inBox(h.legs, px, py)) return { e: e, part: 'leg' };
    }
    return null;
  };
  function inBox(b, x, y) { return b && x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h; }

  E.boxes = boxes;
  function boxes(e) {
    var zero = { x: -999, y: -999, w: 0, h: 0 };
    if (e.state === 'fall' || e.state === 'corpse' || e.dead) {
      return { head: zero, torso: zero, legs: zero, armA: zero, armB: zero };
    }
    var p = pose(e), d = p.d, cx = p.cx, S = p.S;
    var hw = d.headW, hh = d.headH;
    var armW = Math.max(2, Math.round(3 * S));
    return {
      head: { x: cx - Math.floor(hw / 2) - 1, y: p.headY - 1, w: hw + 2, h: hh + 2 },
      torso: { x: cx - Math.floor(d.torsoW / 2), y: p.shoulderY, w: d.torsoW, h: p.hipY - p.shoulderY },
      armA: { x: cx - Math.floor(d.torsoW / 2) - armW, y: p.shoulderY + 2, w: armW, h: Math.max(3, d.armL) },
      armB: { x: cx + Math.floor(d.torsoW / 2), y: p.shoulderY + 2, w: armW, h: Math.max(3, d.armL) },
      legs: { x: cx - Math.floor(d.skirtW / 2), y: p.hipY, w: d.skirtW, h: p.legL }
    };
  }

  /* ============================================================
     绘制
     ============================================================ */
  E.draw = function (ctx, t) { drawRange(ctx, t, -1, 2); };
  E.drawRange = drawRange;
  function drawRange(ctx, t, z0, z1) {
    var order = list.slice().sort(function (a, b) { return a.z - b.z; });
    for (var i = 0; i < order.length; i++) {
      var e = order[i];
      if (e.z < z0 || e.z >= z1) continue;
      drawOne(ctx, e, t);
    }
  }

  function drawOne(ctx, e, t) {
    var d = dims(e);
    var x = Math.round(e.x);

    if (e.dog && e.dog.state !== 'mourn') drawDog(ctx, e, x, e.baseY);

    // 接地阴影（深度越浅越大越淡）
    if (e.state !== 'corpse') {
      var shR = Math.max(2, Math.round(5 * e.S));
      PS.ell(ctx, x, Math.round(e.baseY) + 1, shR, Math.max(1, Math.round(1.2 * e.S)), C.VOID, 0.34);
    }

    if (e.state === 'corpse') { drawCorpse(ctx, e, x, t); }
    else if (e.state === 'fall') { drawFalling(ctx, e, x, t); }
    else { drawUpright(ctx, e, x, t, d); }

    if (e.dog && e.dog.state === 'mourn') drawDog(ctx, e, x, e.baseY);

    // 远处的人被河雾/空气透视削弱
    if (e.z < 0.45) {
      var lv = (0.45 - e.z) * 0.42;
      var p = pose(e);
      var hgt = Math.round((p.footY - p.headY) + 8);
      PS.dt(ctx, x - Math.round(9 * e.S), p.headY - 4, Math.round(18 * e.S), hgt, C.NG5, lv);
    }
  }

  /* ---------- 直立：把姿态算成骨架点，再交给通用身体绘制 ---------- */
  function drawUpright(ctx, e, x, t, d) {
    var p = pose(e);
    var S = e.S;
    var moving = (e.state === 'walk' || e.state === 'run' || e.state === 'hide' || e.state === 'limp');
    var footY = p.footY;
    var breath = Math.round(Math.sin(t * 1.8 + e.seed) * (S > 0.9 ? 1 : 0));

    // 行走相位：腿
    var hipY = p.hipY, kneeY = (hipY + footY) / 2;
    var ph = e.phase;
    var stride = d.stride * (e.state === 'run' || e.state === 'hide' ? 1.5 : 1);
    var a = Math.sin(ph), b = Math.sin(ph + Math.PI);
    var liftA = Math.max(0, Math.cos(ph)) * d.lift;
    var liftB = Math.max(0, Math.cos(ph + Math.PI)) * d.lift;
    if (!moving) { a = 0.55; b = -0.55; liftA = liftB = 0; stride = d.stride * 0.5; }
    if (e.state === 'crawl') { a = 0.9; b = -0.9; stride = d.stride * 1.2; }

    // 前倾/后仰一律沿「行进方向」，否则向左走的人会呈现向后仰的倒走感
    var lean = 0;
    if (e.state === 'stagger') lean = -e.dir * 2.5;
    else {
      if (moving) lean += e.dir * 1.3;                 // 走路时上身朝前倾
      if (e.build.id === 'hunched') lean += e.dir * 2.2;
      if (e.carry === 'crutch') lean += e.dir * 1.2;
    }
    var lx = Math.round(lean);

    // 迈步方向必须跟随朝向：向左走时腿往左迈，否则就是「倒着走」
    var sd = stride * e.dir;
    var legLead = e.dir > 0 ? 1 : -1;                  // 前脚在行进方向一侧

    var pts = {
      footA: { x: x - legLead + Math.round(b * sd), y: footY - Math.round(liftB) },
      footB: { x: x + legLead + Math.round(a * sd), y: footY - Math.round(liftA) },
      kneeA: { x: x - legLead + Math.round(b * sd * 0.5), y: kneeY },
      kneeB: { x: x + legLead + Math.round(a * sd * 0.5), y: kneeY - Math.round(liftA * 0.5) },
      hip: { x: x + Math.round(lx * 0.25), y: hipY },
      // 头部只比肩再前移一点点：1.1 倍会让脖子脱开肩膀，朝左时尤其明显
      sh: { x: x + Math.round(lx * 0.7), y: p.shoulderY + breath },
      head: { x: x + Math.round(lx * 0.8), y: p.headY + Math.round(d.headH * 0.5) + breath }
    };

    // 手臂目标
    var arms = armTargets(e, pts, d, t, x);
    drawFigure(ctx, e, pts, arms, { d: d, t: t });

    // 携带物
    drawCarry(ctx, e, pts, arms, d, t);
  }

  function armTargets(e, pts, d, t, x) {
    var S = e.S, sh = pts.sh, hip = pts.hip, head = pts.head;
    var sw = (e.state === 'walk' || e.state === 'run' || e.state === 'hide' || e.state === 'limp');
    var A, B;
    var armReach = Math.round(3 * S);
    if (e.state === 'cower') {
      A = { x: head.x - Math.round(3 * S), y: head.y - Math.round(1 * S) };
      B = { x: head.x + Math.round(3 * S), y: head.y - Math.round(1 * S) };
    } else if (e.state === 'crawl') {
      A = { x: sh.x - Math.round(5 * S), y: pts.footA.y - 1 };
      B = { x: sh.x + Math.round(5 * S), y: pts.footB.y - 1 };
    } else if (e.state === 'smoke') {
      A = { x: sh.x - Math.round(3 * S), y: hip.y + 1 };
      B = { x: head.x + Math.round(2 * S), y: head.y + Math.round(1 * S) };
    } else if (e.state === 'talk') {
      var g = Math.sin(t * 6 + e.seed) > 0 ? 1 : -1;
      A = { x: sh.x - Math.round(3 * S), y: hip.y + 1 };
      B = { x: sh.x + Math.round(4 * S), y: sh.y + Math.round(4 * S) + g };
    } else if (e.state === 'sweep') {
      var sw2 = Math.sin(t * 4.2 + e.seed);
      A = { x: sh.x - Math.round(2 * S), y: hip.y + 2 };
      B = { x: sh.x + Math.round(4 * S) * e.dir, y: hip.y + Math.round(6 * S) + Math.round(sw2 * 3) };
    } else if (e.state === 'draw') {
      A = { x: sh.x - Math.round(3 * S), y: hip.y + 2 };
      B = { x: sh.x + Math.round(3 * S), y: hip.y + Math.round(5 * S) };
    } else if (e.state === 'stagger') {
      A = { x: sh.x - Math.round(4 * S), y: sh.y + Math.round(4 * S) };
      B = { x: sh.x + Math.round(4 * S), y: sh.y + Math.round(3 * S) };
    } else if (sw) {
      // 手臂与同侧腿反相摆动，且摆动方向跟随朝向
      var sa = Math.sin(e.phase), sb = Math.sin(e.phase + Math.PI);
      A = { x: sh.x - armReach + Math.round(sa * d.stride * 0.8 * e.dir), y: hip.y + Math.round(2 * S) };
      B = { x: sh.x + armReach + Math.round(sb * d.stride * 0.8 * e.dir), y: hip.y + Math.round(2 * S) };
    } else {
      A = { x: sh.x - armReach, y: hip.y + 1 };
      B = { x: sh.x + armReach, y: hip.y + 1 };
    }
    // 手臂受伤 → 垂着不动
    if (e.wound.arm > 0) A = { x: sh.x - Math.round(2 * S), y: hip.y + Math.round(3 * S) };
    return { A: A, B: B };
  }

  /* ---------- 通用身体绘制（骨架点驱动，直立与倒地共用） ---------- */
  function drawFigure(ctx, e, pts, arms, o) {
    var S = e.S, d = o.d, R = e.ramp;
    var main = R[2], dark = R[1], deep = R[0], lit = R[3], hi = R[4];
    var pants = e.pants;
    var hip = pts.hip, sh = pts.sh, head = pts.head;
    var legW = Math.max(1, Math.round(3 * S * e.build.w));
    var armW = Math.max(1, Math.round(2 * S));

    /* 后腿：比前腿暗一档、细一档，制造前后景深；但不能用外套最深色，
       否则和裤子色相差太大，膝盖处会「断开」成两根独立棍子 */
    var backW = Math.max(1, legW - 1);
    var backCol = shadeDown(pants);
    linePx(ctx, hip.x - 1, hip.y, pts.kneeA.x, pts.kneeA.y, backW, backCol, 1);
    linePx(ctx, pts.kneeA.x, pts.kneeA.y, pts.footA.x, pts.footA.y, backW, backCol, 1);
    boot(ctx, pts.footA.x, pts.footA.y, S, e.dir, C.MT0);

    /* 后臂（暗 + 细一档，与后腿一致地后退） */
    linePx(ctx, sh.x - Math.round(2 * S), sh.y + 2, arms.A.x, arms.A.y, Math.max(1, armW - 1), deep, 1);
    PS.dt(ctx, arms.A.x - 1, arms.A.y - 1, Math.max(1, Math.round(2 * S)), Math.max(1, Math.round(2 * S)), C.SK0, 1);

    /* 背包 / 电台（在躯干之后） */
    if (e.carry === 'backpack' || e.carry === 'radio') drawBackRig(ctx, e, sh, hip, S);

    /* 躯干：下摆宽 → 收腰 → 肩略宽 → 圆肩收口 */
    var tw = d.torsoW, skw = d.skirtW;
    band(ctx, hip.x, hip.y, sh.x, sh.y, skw, tw, main, lit, deep, {
      waist: 0.55, waistW: Math.max(3, Math.round(tw * 0.86)),
      lit: 0.55, dark: 0.75
    });
    coatDetail(ctx, e, hip, sh, d, S);

    /* 前腿（比后腿亮一档 + 粗一档，形成明确的前后关系） */
    linePx(ctx, hip.x + 1, hip.y, pts.kneeB.x, pts.kneeB.y, legW, shadeOf(pants), 1);
    linePx(ctx, pts.kneeB.x, pts.kneeB.y, pts.footB.x, pts.footB.y, legW, shadeOf(pants), 1);
    boot(ctx, pts.footB.x, pts.footB.y, S, e.dir, C.MT1);

    /* 头 + 帽子 + 脸 */
    drawHead(ctx, e, head, sh, d, S, o.t);

    /* 前臂 */
    linePx(ctx, sh.x + Math.round(2 * S), sh.y + 2, arms.B.x, arms.B.y, armW, main, 1);
    PS.dt(ctx, arms.B.x - 1, arms.B.y - 1, Math.max(1, Math.round(2 * S)), Math.max(1, Math.round(2 * S)), e.skin, 1);

    /* 伤口血迹 */
    var dmg = 1 - e.hp / 100;
    if (dmg > 0.15) {
      var spots = Math.floor(dmg * 6);
      for (var k = 0; k < spots; k++) {
        var ang = k * 2.3 + e.seed;
        PS.dt(ctx, sh.x + Math.round(Math.sin(ang) * 3 * S), sh.y + 2 + k * 2,
          Math.max(1, Math.round(2 * S)), Math.max(1, Math.round(2 * S)), C.BL2, 0.85);
      }
    }
  }

  /* 靴子：靴尖朝行进方向，是判断朝向最直观的像素。
     之前只有 1px 高，在 39px 高的人物上几乎看不见，这里加厚成 2~3px */
  function boot(ctx, fx, fy, S, dir, col) {
    var bw = Math.max(3, Math.round(4.5 * S));
    var bh = Math.max(2, Math.round(1.6 * S));
    var x = Math.round(fx), y = Math.round(fy);
    var bx = x - (dir > 0 ? Math.round(bw * 0.3) : Math.round(bw * 0.7));
    // 鞋身
    PS.rect(ctx, bx, y - bh + 1, bw, bh, col);
    // 鞋帮受光
    PS.dt(ctx, bx, y - bh + 1, bw, 1, C.MT2, 0.55);
    // 鞋头：朝行进方向多伸 1~2px，是读朝向的关键
    var tipX = dir > 0 ? bx + bw : bx - Math.max(1, Math.round(1.5 * S));
    PS.rect(ctx, tipX, y - bh + 1, Math.max(1, Math.round(1.5 * S)), bh - 1, col);
    PS.dt(ctx, dir > 0 ? tipX + Math.max(1, Math.round(1.5 * S)) - 1 : tipX, y - bh + 1,
      Math.max(1, Math.round(1.5 * S)), 1, C.MT3, 0.7);
  }

  function shadeOf(col) {
    // 给一个颜色找"更亮"的版本（简易查表）
    switch (col) {
      case C.CN0: return C.CN1; case C.CN1: return C.CN2;
      case C.CT0: return C.CT1; case C.WD0: return C.WD1;
      case C.MT1: return C.MT2;
      default: return col;
    }
  }
  /* 给裤子/衣物找「暗一档」的同色系版本——必须保持色相不变，
     否则前后腿会在膝盖处断开 */
  function shadeDown(col) {
    switch (col) {
      case C.CN2: return C.CN0; case C.CN1: return C.CN0;
      case C.CT1: return C.CT0; case C.CT2: return C.CT1;
      case C.WD1: return C.WD0; case C.WD2: return C.WD1;
      case C.MT2: return C.MT1; case C.MT1: return C.MT0;
      case C.BR1: return C.BR0;
      default: return col;
    }
  }

  /* 外套款式细节 */
  function coatDetail(ctx, e, hip, sh, d, S) {
    var R = e.ramp, main = R[2], dark = R[1], lit = R[3], hi = R[4];
    var midY = Math.round((hip.y + sh.y) / 2);
    var halfW = Math.max(2, Math.round(d.torsoW / 2));
    var cx = Math.round((hip.x + sh.x) / 2);
    var id = e.coat.id;

    if (id === 'greatcoat') {
      // 双排扣 + 腰带 + 肩章
      for (var i = 0; i < 3; i++) {
        var yy = sh.y + 2 + i * Math.max(2, Math.round(3 * S));
        PS.dt(ctx, cx - 2, yy, 1, 1, hi, 0.8);
        PS.dt(ctx, cx + 2, yy, 1, 1, hi, 0.8);
      }
      var by = sh.y + Math.round(d.torsoH * 0.62);
      PS.dt(ctx, cx - halfW, by, halfW * 2, 1, C.MT0, 0.85);
      PS.rect(ctx, cx - 1, by, Math.max(1, Math.round(2 * S)), 1, C.BR2M);
      PS.dt(ctx, cx - halfW - 1, sh.y, halfW * 2 + 2, 1, e.fur[2], 0.9);
    } else if (id === 'padded') {
      // 横向绗缝
      var rows = Math.max(2, Math.round(d.torsoH / Math.max(2, Math.round(3 * S))));
      for (var r = 1; r < rows; r++) {
        var ry = sh.y + Math.round(d.torsoH * r / rows);
        PS.dt(ctx, cx - halfW, ry, halfW * 2, 1, dark, 0.9);
        PS.dt(ctx, cx - halfW, ry - 1, halfW * 2, 1, lit, 0.35);
      }
      PS.dt(ctx, cx - halfW, sh.y, halfW * 2, 1, dark, 1);   // 立领
    } else if (id === 'leather') {
      // 皮衣：斜拉链 + 强高光
      PS.dt(ctx, cx - halfW, sh.y + 1, Math.max(2, Math.round(3 * S)), Math.max(3, Math.round(d.torsoH * 0.7)), hi, 0.35);
      for (var z = 0; z < Math.round(d.torsoH * 0.6); z++) {
        PS.dt(ctx, cx + Math.round(z * 0.3), sh.y + 2 + z, 1, 1, hi, 0.7);
      }
      PS.dt(ctx, cx - halfW, sh.y, halfW * 2, 1, dark, 1);
      PS.dt(ctx, cx - halfW, hip.y - 1, halfW * 2, 1, dark, 1);
    } else if (id === 'wool') {
      // 翻领 V 字 + 单排扣
      for (var v = 0; v < Math.max(2, Math.round(4 * S)); v++) {
        PS.dt(ctx, cx - v, sh.y + 1 + v, 1, 1, lit, 0.8);
        PS.dt(ctx, cx + v, sh.y + 1 + v, 1, 1, lit, 0.8);
      }
      PS.dt(ctx, cx, midY, 1, Math.max(2, Math.round(4 * S)), hi, 0.6);
    } else if (id === 'parka') {
      // 毛领 + 下摆收紧 + 口袋
      PS.dt(ctx, cx - halfW - 1, sh.y, halfW * 2 + 2, Math.max(2, Math.round(2 * S)), e.fur[1], 0.95);
      PS.dt(ctx, cx - halfW - 1, sh.y, halfW * 2 + 2, 1, e.fur[3], 0.5);
      PS.dt(ctx, cx - Math.round(3 * S), hip.y - Math.round(3 * S), Math.max(2, Math.round(3 * S)), 1, dark, 0.8);
      PS.dt(ctx, cx + Math.round(1 * S), hip.y - Math.round(3 * S), Math.max(2, Math.round(3 * S)), 1, dark, 0.8);
    } else {
      // 雪地迷彩：不规则深色斑块
      var rr = PS.mulberry32(Math.floor(e.seed) + 7);
      for (var c = 0; c < 7; c++) {
        var ox = Math.round((rr() - 0.5) * d.torsoW * 1.1);
        var oy = Math.round(rr() * d.torsoH);
        PS.dt(ctx, cx + ox, sh.y + oy, 1 + Math.floor(rr() * 2), 1 + Math.floor(rr() * 2), C.CT2, 0.55);
      }
      PS.dt(ctx, cx - halfW - 1, sh.y, halfW * 2 + 2, 1, C.SN7, 0.7);
    }

    // 肩章（军官大檐帽 / 钢盔 搭配）
    if (e.hat === 'cap') {
      PS.dt(ctx, cx - halfW, sh.y + 1, Math.max(2, Math.round(3 * S)), 1, C.BR2M, 0.7);
      PS.dt(ctx, cx + halfW - Math.max(2, Math.round(3 * S)), sh.y + 1, Math.max(2, Math.round(3 * S)), 1, C.BR2M, 0.7);
    }
    // 敷料/绷带（受伤的）
    if (e.wound.torso > 0) {
      PS.dt(ctx, cx - 1, midY - 1, Math.max(2, Math.round(3 * S)), 2, C.SN6, 0.75);
      PS.dt(ctx, cx - 1, midY, Math.max(2, Math.round(3 * S)), 1, C.BL3, 0.6);
    }
  }

  function drawBackRig(ctx, e, sh, hip, S) {
    var w = Math.max(2, Math.round(4 * S)), h = Math.max(3, Math.round(7 * S));
    var x = sh.x - (e.dir > 0 ? w + 1 : -1);
    var y = sh.y + 2;
    if (e.carry === 'backpack') {
      PS.rect(ctx, x, y, w, h, C.WD1);
      PS.dt(ctx, x, y, w, 1, C.WD2, 0.8);
      PS.dt(ctx, x + w - 1, y, 1, h, C.VOID, 0.7);
      PS.dt(ctx, x, y + Math.round(h * 0.5), w, 1, C.CT0, 0.8);
    } else {
      // 电台：盒子 + 天线
      PS.rect(ctx, x, y, w, Math.round(h * 0.8), C.MT1);
      PS.dt(ctx, x, y, w, 1, C.MT3, 0.7);
      var ax = x + Math.floor(w / 2);
      PS.rect(ctx, ax, y - Math.max(3, Math.round(7 * S)), 1, Math.max(3, Math.round(7 * S)), C.MT3);
      if (Math.sin(e.t * 3 + e.seed) > 0.6) PS.dt(ctx, ax, y - Math.max(3, Math.round(7 * S)), 1, 1, C.BL5, 1);
    }
  }

  /* ---------- 头 / 帽子 / 脸 ---------- */
  function drawHead(ctx, e, head, sh, d, S, t) {
    var hw = d.headW, hh = d.headH;
    var hx = Math.round(head.x - hw / 2), hy = Math.round(head.y - hh / 2);
    var skin = e.skin;
    var jaw = hy + Math.round(hh * 0.42);          // 下半张脸（下巴）起始行
    var colW = Math.max(2, Math.round(2.6 * S));   // 脖子宽度

    // 整个头：颅顶到下颌铺满，不留空档
    PS.rect(ctx, hx, hy, hw, hh, skin);
    // 后脑/上半部压暗一档，形成体积
    PS.dt(ctx, hx, hy, hw, Math.round(hh * 0.42), C.SK0, 0.55);
    // 脸部受光面 / 暗面
    PS.dt(ctx, hx + hw - 1, hy + 1, 1, Math.round(hh * 0.7), C.SN7, 0.22);
    PS.dt(ctx, hx, jaw, 1, hh - Math.round(hh * 0.42), C.VOID, 0.45);

    // 脖子：够宽把头连到肩上
    PS.rect(ctx, Math.round(head.x) - Math.floor(colW / 2), hy + hh - Math.max(1, Math.round(2 * S)),
      colW, Math.max(2, Math.round(3 * S)), C.SK0);
    PS.dt(ctx, Math.round(head.x) - Math.floor(colW / 2), hy + hh - Math.max(1, Math.round(2 * S)),
      colW, 1, C.VOID, 0.4);

    // 眼睛（朝行进方向）
    var ex = e.dir > 0 ? hx + hw - 2 : hx + 1;
    PS.rect(ctx, ex, hy + Math.round(hh * 0.62), 1, 1, C.VOID);

    // 脸部细节
    if (e.face === 'beard') PS.dt(ctx, hx, hy + Math.round(hh * 0.66), hw, Math.max(2, Math.round(3 * S)), e.fur[0], 0.85);
    else if (e.face === 'mustache') PS.dt(ctx, hx, hy + Math.round(hh * 0.70), hw, 1, e.fur[0], 0.8);
    else if (e.face === 'stubble') PS.dt(ctx, hx, hy + Math.round(hh * 0.72), hw, 1, C.SN3, 0.35);
    else if (e.face === 'scarfMask') {
      PS.rect(ctx, hx, hy + Math.round(hh * 0.55), hw, Math.max(2, Math.round(hh * 0.45)), C.CT1);
      PS.dt(ctx, hx, hy + Math.round(hh * 0.55), hw, 1, C.CT3, 0.6);
    } else if (e.face === 'goggles') {
      PS.rect(ctx, hx, hy + Math.round(hh * 0.45), hw, Math.max(1, Math.round(2 * S)), C.MT2);
      PS.dt(ctx, hx + 1, hy + Math.round(hh * 0.45) + 1, 1, 1, C.IC5, 0.8);
      PS.dt(ctx, hx + hw - 2, hy + Math.round(hh * 0.45) + 1, 1, 1, C.IC5, 0.8);
    }
    // 女性长发
    if (e.female && e.hat !== 'babushka' && e.hat !== 'scarf') {
      PS.dt(ctx, hx - 1, hy + Math.round(hh * 0.4), 1, Math.max(2, Math.round(hh * 0.6)), C.BR2, 0.85);
    }

    // 帽子
    var hatH = Math.max(1, Math.round(hh * 0.55));
    switch (e.hat) {
      case 'ushanka':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, hatH, e.fur[1]);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, e.fur[2], 0.8);
        PS.rect(ctx, hx - 1, hy + Math.round(hh * 0.45), 2, Math.max(1, Math.round(hh * 0.5)), e.fur[0]);
        PS.rect(ctx, hx + hw - 1, hy + Math.round(hh * 0.45), 2, Math.max(1, Math.round(hh * 0.5)), e.fur[0]);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.SN6, 0.35);       // 帽上积雪
        break;
      case 'helmet':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, hatH, C.MT2);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.MT4, 0.75);
        PS.dt(ctx, hx - 2, hy + Math.round(hh * 0.4), hw + 4, 1, C.MT1, 1);   // 盔檐
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.SN6, 0.4);
        break;
      case 'beanie':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, hatH, e.ramp[1]);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, e.ramp[3], 0.7);
        PS.rect(ctx, hx - 1, hy + hatH - 1, hw + 2, 1, e.ramp[2]);
        PS.dt(ctx, hx, hy - 2, hw, 1, e.ramp[4], 0.6);
        break;
      case 'cap':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, Math.max(1, Math.round(hh * 0.40)), C.CT1);
        PS.rect(ctx, hx - 2, hy + Math.round(hh * 0.38), hw + 4, 1, C.MT0);    // 大檐
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.CT3, 0.6);
        PS.dt(ctx, hx + Math.floor(hw / 2), hy - 1, 1, Math.max(1, Math.round(hh * 0.3)), C.BR2M, 0.7);
        break;
      case 'hood':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, Math.max(2, Math.round(hh * 0.72)), e.ramp[1]);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 2, e.ramp[3], 0.5);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.SN6, 0.5);
        break;
      case 'scarf':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, Math.max(2, Math.round(hh * 0.62)), C.BR3);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.BR4, 0.6);
        PS.dt(ctx, hx - 1, hy + Math.round(hh * 0.6), 2, Math.max(1, Math.round(2 * S)), C.BR2);
        break;
      case 'babushka':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, Math.max(2, Math.round(hh * 0.66)), C.RED);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.BL4, 0.35);
        PS.dt(ctx, hx - 2, hy + Math.round(hh * 0.5), 2, Math.max(1, Math.round(2 * S)), C.RED);
        PS.dt(ctx, hx + hw, hy + Math.round(hh * 0.5), 2, Math.max(1, Math.round(2 * S)), C.RED);
        break;
      case 'bandage':
        PS.rect(ctx, hx - 1, hy - 1, hw + 2, Math.max(2, Math.round(hh * 0.60)), C.SN5);
        PS.dt(ctx, hx - 1, hy - 1, hw + 2, 1, C.SN7, 0.7);
        PS.dt(ctx, hx - 1, hy + 1, hw + 2, 1, C.BL2, 0.55);
        break;
      default:  // bald
        PS.dt(ctx, hx, hy - 1, hw, Math.max(1, Math.round(hh * 0.32)), C.SK0, 0.55);
        PS.dt(ctx, hx, hy - 1, hw, 1, skin, 0.6);
        break;
    }

    // 抽烟的火点
    if (e.state === 'smoke') {
      PS.dt(ctx, head.x + Math.round(2 * S) * e.dir, head.y + Math.round(1 * S), 1, 1,
        Math.sin(t * 9) > 0 ? C.LP5 : C.LP3, 0.95);
    }
    // 头部中弹
    if (e.wound.head > 0) {
      PS.dt(ctx, hx, hy, hw, Math.max(2, Math.round(hh * 0.5)), C.BL2, 0.8);
    }
  }

  /* ---------- 携带物（手上 / 身边） ---------- */
  function drawCarry(ctx, e, pts, arms, d, t) {
    var S = e.S, B = arms.B, A = arms.A;
    switch (e.carry) {
      case 'shovel':
        linePx(ctx, B.x, B.y, B.x + Math.round(3 * S) * e.dir, B.y + Math.round(9 * S), 1, C.WD3, 1);
        PS.rect(ctx, B.x + Math.round(2 * S) * e.dir, B.y + Math.round(8 * S), Math.max(2, Math.round(3 * S)), Math.max(2, Math.round(3 * S)), C.MT2);
        break;
      case 'bucket':
        PS.rect(ctx, B.x - 1, B.y + 1, Math.max(3, Math.round(4 * S)), Math.max(3, Math.round(4 * S)), C.MT1);
        PS.dt(ctx, B.x - 1, B.y + 1, Math.max(3, Math.round(4 * S)), 1, C.MT3, 0.8);
        PS.dt(ctx, B.x, B.y, 1, 1, C.MT3, 1);
        break;
      case 'lantern':
        PS.rect(ctx, B.x - 1, B.y + 1, 3, Math.max(3, Math.round(4 * S)), C.MT1);
        PS.dt(ctx, B.x, B.y + 2, 1, Math.max(1, Math.round(2 * S)), C.LP4, 1);
        PS.dt(ctx, B.x - 2, B.y, 5, 5, C.LP2, 0.10);
        break;
      case 'crutch':
        linePx(ctx, A.x - 1, A.y - Math.round(6 * S), A.x - 1, pts.footA.y, 1, C.WD3, 1);
        PS.rect(ctx, A.x - 2, A.y - Math.round(7 * S), 3, 1, C.WD2);
        break;
      case 'jerrycan':
        PS.rect(ctx, B.x - 2, B.y + 1, Math.max(3, Math.round(5 * S)), Math.max(3, Math.round(5 * S)), C.CT1);
        PS.dt(ctx, B.x - 2, B.y + 1, Math.max(3, Math.round(5 * S)), 1, C.CT3, 0.7);
        PS.dt(ctx, B.x - 1, B.y + 1, 1, 1, C.MT2, 1);
        break;
      case 'satchel':
        PS.rect(ctx, pts.hip.x + Math.round(3 * S) * (e.dir > 0 ? 1 : -1), pts.hip.y + 1,
          Math.max(2, Math.round(3 * S)), Math.max(2, Math.round(4 * S)), C.WD1);
        PS.dt(ctx, pts.hip.x + Math.round(3 * S) * (e.dir > 0 ? 1 : -1), pts.hip.y + 1,
          Math.max(2, Math.round(3 * S)), 1, C.WD3, 0.6);
        break;
    }
  }

  /* ---------- 狗 ---------- */
  function drawDog(ctx, e, ox, oy) {
    var dg = e.dog, S = e.S;
    var ph = dg.ph;
    var dx = dg.dx;
    if (dg.state === 'mourn') dx = -Math.round(7 * S) + Math.round(Math.sin(ph * 0.9) * 3);
    var x = Math.round(ox + dx * (e.dir > 0 ? -1 : 1));
    var y = Math.round(oy);
    var bw = Math.max(3, Math.round(6 * S)), bh = Math.max(2, Math.round(3 * S));
    var legSwing = Math.sin(ph) * 1.5;
    // 身体
    PS.rect(ctx, x - Math.round(bw / 2), y - bh - 2, bw, bh, C.WD1);
    PS.dt(ctx, x - Math.round(bw / 2), y - bh - 2, bw, 1, C.WD3, 0.7);
    // 腿
    for (var i = 0; i < 2; i++) {
      var lx = x - Math.round(bw / 2) + 1 + i * (bw - 2);
      var sw2 = (i === 0 ? legSwing : -legSwing);
      PS.rect(ctx, lx, y - 2, 1, Math.max(1, Math.round(2 * S) + (sw2 > 0 ? 1 : 0)), C.WD0);
    }
    // 头
    var hx = x + Math.round(bw / 2) * (e.dir > 0 ? 1 : -1);
    var hy = y - bh - Math.max(2, Math.round(3 * S));
    PS.rect(ctx, hx - 1, hy, Math.max(2, Math.round(3 * S)), Math.max(2, Math.round(3 * S)), C.WD2);
    PS.dt(ctx, hx - 1, hy, 1, 1, C.VOID, 0.8);    // 眼
    // 耳 + 鼻
    PS.dt(ctx, hx - 1, hy - 1, 1, 1, C.WD0, 1);
    PS.dt(ctx, hx + Math.max(1, Math.round(2 * S)), hy + 1, 1, 1, C.VOID, 1);
    // 尾巴
    var tw = dg.state === 'mourn' ? -1 : Math.sin(ph * 2) * 2;
    linePx(ctx, x - Math.round(bw / 2), y - bh - 2, x - Math.round(bw / 2) - 2, y - bh - 3 + tw, 1, C.WD2, 1);
    // 嗅的时候低头
    if (dg.state === 'sniff') PS.dt(ctx, hx, hy + Math.max(2, Math.round(3 * S)) + 1, 1, 1, C.SN5, 0.5);
  }

  /* ============================================================
     倒地动画（10 种）
     ============================================================ */
  function drawFalling(ctx, e, x, t) {
    drawDeathPose(ctx, e, x, e.lay, t, true);
  }
  function drawCorpse(ctx, e, x, t) {
    drawDeathPose(ctx, e, x, 1, t, false);
  }

  function drawDeathPose(ctx, e, x, k, t, live) {
    var S = e.S, d = dims(e);
    var baseY = Math.round(e.baseY) + (e.dy || 0);
    var type = e.deathType || 'back';

    switch (type) {
      case 'crumble': drawCrumble(ctx, e, x, baseY, k, d, t); break;
      case 'kneel': drawKneelFall(ctx, e, x, baseY, k, d, t); break;
      case 'slide': drawSlideFall(ctx, e, x, baseY, k, d, t); break;
      case 'crawlDeath': drawCrawlDeath(ctx, e, x, baseY, k, d, t); break;
      case 'overQuay': drawOverQuay(ctx, e, x, baseY, k, d, t); break;
      case 'trip': drawTrip(ctx, e, x, baseY, k, d, t); break;
      case 'fling': drawFling(ctx, e, x, baseY, k, d, t); break;
      case 'spin': drawSpin(ctx, e, x, baseY, k, d, t); break;
      default: drawTopple(ctx, e, x, baseY, k, d, t); break;   // back / forward
    }

    // 尸体上的落雪
    if (!live && e.corpseSnow > 0) {
      var p = pose(e);
      var rr = PS.mulberry32(Math.floor(e.seed) + 3);
      var n = Math.floor(e.corpseSnow * 26);
      for (var i = 0; i < n; i++) {
        PS.dt(ctx, x + Math.round((rr() - 0.5) * 20 * S), baseY - Math.round(rr() * 7 * S), 1, 1, C.SN7, 0.5 + rr() * 0.4);
      }
    }
  }

  /* 旋转倒地：以脚为轴把整根身体转过去 */
  function rotatedPts(e, x, baseY, ang, dirs, d, lift) {
    var L = d.legL + d.torsoH + d.headH;
    var ax = x, ay = baseY - lift;
    function P(u) {
      return { x: ax + Math.sin(ang) * dirs * u * L, y: ay - Math.cos(ang) * u * L };
    }
    var uKnee = (d.legL * 0.5) / L, uHip = d.legL / L;
    var uSh = (d.legL + d.torsoH) / L, uHead = (d.legL + d.torsoH + d.headH * 0.55) / L;
    return {
      footA: P(0), footB: P(0),
      kneeA: P(uKnee), kneeB: P(uKnee),
      hip: P(uHip), sh: P(uSh), head: P(uHead)
    };
  }
  function fallenArms(e, pts, d, ang, dirs) {
    var S = e.S, sh = pts.sh;
    var spread = Math.max(3, Math.round(6 * S));
    var nx = Math.cos(ang), ny = Math.sin(ang);
    return {
      A: { x: sh.x - nx * spread * 0.4 - dirs * spread * 0.7, y: sh.y - ny * spread * 0.4 + spread * 0.5 },
      B: { x: sh.x + nx * spread * 0.4 + dirs * spread * 0.7, y: sh.y + ny * spread * 0.4 + spread * 0.5 }
    };
  }

  function drawTopple(ctx, e, x, baseY, k, d, t) {
    var ang = ease(k) * Math.PI / 2;
    var dirs = e.deathDir;
    var lift = Math.round(3 * e.S);
    var pts = rotatedPts(e, x, baseY, ang, dirs, d, lift * Math.sin(ang));
    drawFigure(ctx, e, pts, fallenArms(e, pts, d, ang, dirs), { d: d, t: t });
  }

  function drawSpin(ctx, e, x, baseY, k, d, t) {
    // 侧向翻转：躯干宽度先收窄再张开，同时后仰
    var ang = ease(k) * Math.PI / 2;
    var squash = Math.abs(Math.cos(k * Math.PI));
    var d2 = {
      headW: Math.max(2, Math.round(d.headW * (0.45 + 0.55 * squash))),
      headH: d.headH, torsoH: d.torsoH,
      torsoW: Math.max(2, Math.round(d.torsoW * (0.35 + 0.65 * squash))),
      skirtW: Math.max(3, Math.round(d.skirtW * (0.35 + 0.65 * squash))),
      armL: d.armL, legL: d.legL, stride: d.stride, lift: d.lift
    };
    var pts = rotatedPts(e, x, baseY, ang, e.deathDir, d2, Math.round(3 * e.S) * Math.sin(ang));
    drawFigure(ctx, e, pts, fallenArms(e, pts, d2, ang, e.deathDir), { d: d2, t: t });
  }

  function drawFling(ctx, e, x, baseY, k, d, t) {
    // 被冲击力掀翻：腾空翻转 → 重重砸地。
    // 注意：倾角终点必须是 π/2（躺平）；若转到 2π 会「转一圈又站起来」。
    var ang = ease(k) * Math.PI / 2;
    var dirs = e.deathDir;
    // 腾空段身体蜷缩，落地摊开
    var tuck = Math.sin(k * Math.PI);
    var d2 = {
      headW: d.headW, headH: d.headH, torsoH: Math.max(3, Math.round(d.torsoH * (1 - tuck * 0.22))),
      torsoW: d.torsoW, skirtW: d.skirtW,
      armL: d.armL, legL: Math.max(2, Math.round(d.legL * (1 - tuck * 0.30))),
      stride: d.stride, lift: d.lift
    };
    var pts = rotatedPts(e, x, baseY, ang, dirs, d2, Math.round(3 * e.S) * Math.sin(ang));
    drawFigure(ctx, e, pts, fallenArms(e, pts, d2, ang, dirs), { d: d2, t: t });
  }

  function drawTrip(ctx, e, x, baseY, k, d, t) {
    // 绊倒：向前扑翻滚，最后面朝下趴着（终点 π/2）
    var ang = ease(k) * Math.PI / 2;
    var dirs = e.dir;
    var tuck = Math.sin(k * Math.PI);
    var d2 = {
      headW: d.headW, headH: d.headH, torsoH: Math.max(3, Math.round(d.torsoH * (1 - tuck * 0.28))),
      torsoW: d.torsoW, skirtW: d.skirtW,
      armL: d.armL, legL: Math.max(2, Math.round(d.legL * (1 - tuck * 0.34))),
      stride: d.stride, lift: d.lift
    };
    var pts = rotatedPts(e, x, baseY, ang, dirs, d2, Math.round(3 * e.S) * Math.sin(ang));
    drawFigure(ctx, e, pts, fallenArms(e, pts, d2, ang, dirs), { d: d2, t: t });
    // 翻滚时四肢甩开
    if (tuck > 0.4) {
      PS.dt(ctx, pts.sh.x + Math.round(dirs * 5 * e.S), baseY - Math.round(2 * e.S), 2, 1, C.MT0, 0.8);
    }
  }

  function drawCrumble(ctx, e, x, baseY, k, d, t) {
    // 原地瘫软：逐段压缩成一堆（爆头/致命的典型）
    var S = e.S, kk = ease(k);
    // 终点必须是一「滩」而不是一「个」：腿几乎归零、躯干压到 1/3、
    // 头也一起塌下去，否则会读成「跪着」或「还站着」。
    var legL = Math.max(1, Math.round(d.legL * (1 - kk * 0.94)));
    var torsoH = Math.max(2, Math.round(d.torsoH * (1 - kk * 0.62)));
    var headH = Math.max(2, Math.round(d.headH * (1 - kk * 0.55)));
    var hipY = baseY - legL;
    var shY = hipY - torsoH;
    var headY = shY - headH;
    var slump = Math.round(kk * 4 * S) * e.deathDir;
    var pts = {
      footA: { x: x - Math.round(2 * S), y: baseY }, footB: { x: x + Math.round(2 * S), y: baseY },
      kneeA: { x: x - Math.round(3 * S), y: baseY - Math.round(legL * 0.4) },
      kneeB: { x: x + Math.round(3 * S), y: baseY - Math.round(legL * 0.4) },
      hip: { x: x + Math.round(slump * 0.3), y: hipY },
      sh: { x: x + Math.round(slump * 0.7), y: shY },
      head: { x: x + Math.round(slump * 1.1), y: headY + Math.round((d.headH - headH) * 0.5) }
    };
    var arms = {
      A: { x: pts.sh.x - Math.round(4 * S), y: baseY - 1 },
      B: { x: pts.sh.x + Math.round(4 * S), y: baseY - 1 }
    };
    var d2 = {
      headW: d.headW, headH: headH,
      torsoH: torsoH, torsoW: d.torsoW, skirtW: Math.max(4, Math.round(d.skirtW * (1 - kk * 0.15))),
      armL: d.armL, legL: legL, stride: d.stride, lift: d.lift
    };
    drawFigure(ctx, e, pts, arms, { d: d2, t: t });
    // 头垂下来
    if (kk > 0.5) PS.dt(ctx, pts.head.x - 1, pts.head.y + Math.round(d.headH * 0.3), Math.max(2, Math.round(3 * S)), 2, C.BL2, 0.7);
  }

  function drawKneelFall(ctx, e, x, baseY, k, d, t) {
    // 跪倒：先双膝着地，上身再往前扑
    var S = e.S, dirs = e.deathDir;
    var k1 = clamp(k / 0.55, 0, 1), k2 = clamp((k - 0.5) / 0.5, 0, 1);
    var kneeDrop = ease(k1);
    var legL = Math.max(2, Math.round(d.legL * (1 - kneeDrop * 0.62)));
    var hipY = baseY - legL;
    var torsoAng = ease(k2) * Math.PI / 2;
    var torsoH = d.torsoH;
    var shY = hipY - Math.cos(torsoAng) * torsoH;
    var shX = x + Math.sin(torsoAng) * dirs * torsoH;
    var headY = shY - Math.cos(torsoAng) * d.headH;
    var headX = shX + Math.sin(torsoAng) * dirs * d.headH * 0.7;
    var pts = {
      footA: { x: x - Math.round(2 * S), y: baseY }, footB: { x: x + Math.round(2 * S), y: baseY },
      kneeA: { x: x - Math.round(3 * S) - Math.round(kneeDrop * 2 * S) * dirs, y: baseY - 1 },
      kneeB: { x: x + Math.round(3 * S), y: baseY - 1 },
      hip: { x: x + Math.round(kneeDrop * 1 * S) * dirs, y: hipY },
      sh: { x: shX, y: shY },
      head: { x: headX, y: headY + Math.round(d.headH * 0.2) }
    };
    var arms = {
      A: { x: shX - Math.round(3 * S), y: baseY - Math.round(2 * S) },
      B: { x: shX + Math.round(4 * S) * dirs, y: shY + Math.round(5 * S) }
    };
    drawFigure(ctx, e, pts, arms, { d: d, t: t });
  }

  function drawSlideFall(ctx, e, x, baseY, k, d, t) {
    // 沿掩体滑落：蹲姿 → 侧躺，脚往前溜
    var S = e.S, dirs = e.deathDir, kk = ease(k);
    var slide = Math.round(kk * 7 * S) * dirs;
    var legL = Math.max(2, Math.round(d.legL * (1 - kk * 0.85)));
    var hipY = baseY - legL;
    var leanAng = kk * Math.PI / 2.2;
    var shY = hipY - Math.cos(leanAng) * d.torsoH;
    var shX = x + slide * 0.4 + Math.sin(leanAng) * dirs * d.torsoH;
    var headX = shX + Math.sin(leanAng) * dirs * d.headH * 0.8;
    var headY = shY - Math.cos(leanAng) * d.headH * 0.8;
    var pts = {
      footA: { x: x - Math.round(2 * S) + slide, y: baseY }, footB: { x: x + Math.round(3 * S) + slide, y: baseY },
      kneeA: { x: x - Math.round(2 * S) + slide * 0.5, y: baseY - Math.round(legL * 0.5) },
      kneeB: { x: x + Math.round(3 * S) + slide * 0.5, y: baseY - Math.round(legL * 0.5) },
      hip: { x: x + slide * 0.4, y: hipY },
      sh: { x: shX, y: shY },
      head: { x: headX, y: headY + Math.round(d.headH * 0.2) }
    };
    var arms = {
      A: { x: shX - Math.round(4 * S), y: shY + Math.round(6 * S) },
      B: { x: shX + Math.round(3 * S), y: shY + Math.round(7 * S) }
    };
    drawFigure(ctx, e, pts, arms, { d: d, t: t });
  }

  function drawCrawlDeath(ctx, e, x, baseY, k, d, t) {
    // 爬不动了：前臂一软，脸砸进雪里
    var S = e.S, kk = ease(k), dr = e.dir;      // 爬行方向 = 爬行时的朝向
    var low = Math.round(d.legL * 0.12);
    var hipY = baseY - low;
    var shY = hipY - Math.max(2, Math.round(d.torsoH * (1 - kk * 0.55)));
    var headDrop = Math.round(kk * d.headH * 0.9);
    var pts = {
      footA: { x: x - Math.round(6 * S) * dr, y: baseY }, footB: { x: x - Math.round(4 * S) * dr, y: baseY - 1 },
      kneeA: { x: x - Math.round(7 * S) * dr, y: baseY - 1 }, kneeB: { x: x - Math.round(6 * S) * dr, y: baseY - 1 },
      hip: { x: x - Math.round(2 * S) * dr, y: hipY },
      sh: { x: x + Math.round(2 * S) * dr, y: shY },
      head: { x: x + Math.round(5 * S) * dr, y: shY - Math.max(1, Math.round(d.headH * 0.35)) + headDrop }
    };
    var arms = {
      A: { x: x - Math.round(1 * S) * dr, y: baseY - 1 },
      B: { x: x + Math.round(7 * S) * dr, y: baseY - 1 + Math.round((1 - kk) * 3) }
    };
    drawFigure(ctx, e, pts, arms, { d: d, t: t });
  }

  function drawOverQuay(ctx, e, x, baseY, k, d, t) {
    // 翻过石堤坠向河面
    var S = e.S, dirs = e.deathDir;
    var k1 = clamp(k / 0.55, 0, 1), k2 = clamp((k - 0.55) / 0.45, 0, 1);
    // 向后翻过堤沿 → 之后一路坠到河面；倾角停在 π/2（躺平），靠 dy 表现坠落
    var ang = ease(k1) * Math.PI / 2;
    var y = baseY;
    var pts = rotatedPts(e, x, y, ang, dirs, d, 0);
    drawFigure(ctx, e, pts, fallenArms(e, pts, d, ang, dirs), { d: d, t: t });
    // 落水后：只露出一部分 + 水花
    if (k2 > 0.6) {
      var wy = G.RIVER_TOP + 1;
      if (baseY > wy - 4) {
        PS.dt(ctx, x - Math.round(7 * S), wy - 1, Math.round(14 * S), 3, C.WT3, 0.5);
      }
    }
  }

  function ease(t) {
    // 起手慢、中间加速、落地沉（重力感）
    return t * t * (3 - 2 * t) * 0.35 + Math.pow(t, 1.6) * 0.65;
  }

  /* ============================================================
     刷怪
     ============================================================ */
  E.DESIRED = 16;
  E.spawnTimer = 0;
  E.tickSpawn = function (dt) {
    E.spawnTimer -= dt;
    if (E.spawnTimer > 0) return;
    E.spawnTimer = 0.5 + Math.random() * 1.1;
    if (list.length >= E.DESIRED) return;
    var fromLeft = chance(0.5);
    make(Math.random(), fromLeft ? 1 : -1, fromLeft ? -14 : PW + 14);
  };

  /* ============================================================
     统计
     ============================================================ */
  E.stat = function () {
    var alive = 0, fleeing = 0, hiding = 0, down = 0;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.dead || e.state === 'corpse') { down++; continue; }
      alive++;
      if (e.state === 'run' || e.state === 'hide' || e.state === 'startle') fleeing++;
      if (e.state === 'cower') hiding++;
    }
    return { alive: alive, fleeing: fleeing, hiding: hiding, down: down };
  };

})(window.PS);

<script>
/* ============================================================
   GAME — 主循环 / 输入 / 栓动狙击枪 / HUD / 任务流程
   ============================================================ */
(function (PS) {
  'use strict';
  var C = PS.C, PW = PS.PW, PH = PS.PH, FX = PS.FX, E = PS.Enemy, G = PS.GEO;
  var W = PS.World;

  var cv, ctx, stage;
  var Game = PS.Game = {};
  var T = 0, lastMs = 0, lastPaint = 0;

  /* ---------- 画质档位 ---------- */
  var QUALITY = {
    low:    { fps: 30, snow: 60,  scan: false, clouds: false, windows: false, searchlight: false, smoke: false, lamps: false, river: false },
    midlow: { fps: 45, snow: 120, scan: false, clouds: true,  windows: true,  searchlight: false, smoke: false, lamps: true,  river: true },
    mid:    { fps: 60, snow: 200, scan: true,  clouds: true,  windows: true,  searchlight: true,  smoke: true,  lamps: true,  river: true },
    high:   { fps: 60, snow: 320, scan: true,  clouds: true,  windows: true,  searchlight: true,  smoke: true,  lamps: true,  river: true }
  };
  function loadQuality() {
    try {
      var q = localStorage.getItem('lewu_ps_quality');
      if (QUALITY[q]) return q;
    } catch (e) {}
    return 'midlow';
  }

  /* ---------- 状态 ---------- */
  var S = {
    mode: 'brief',            // brief | play | over
    aimX: PW * 0.5, aimY: 168,
    mag: 5, MAG: 5,
    cycle: 0, cycleDur: 1.05,
    reload: 0, reloadDur: 2.3,
    holdBreath: false, stamina: 1,
    shake: 0, flash: 0, kick: 0,
    kills: 0, head: 0, shots: 0, hits: 0, missed: 0,
    startT: 0, endT: 0,
    target: 20,
    wind: 0, windTarget: 0, windT: 0,
    tracer: null,
    msg: '', msgT: 0,
    soundOn: true,
    quality: loadQuality()
  };
  Game.S = S;

  var buttons = [
      { id: 'fire', x: PW - 96, y: PH - 40, w: 86, h: 30, label: 'FIRE', kind: 'big' },
      { id: 'reload', x: PW - 152, y: PH - 40, w: 52, h: 30, label: 'RLD', kind: 'mid' },
      { id: 'sound', x: PW - 30, y: 10, w: 22, h: 16, label: 'SND', kind: 'sml' },
      { id: 'city', x: PW - 56, y: 10, w: 22, h: 16, label: 'MAP', kind: 'sml' }
    ];
  var scopeCv, scanCv;              // 瞄具视野暗角（代替画枪：不出现枪身）
  var snow = [];
  var MUZZLE = { x: PW * 0.82, y: PH + 34 };   // 射手在画面外右下方

  /* ============================================================
     初始化
     ============================================================ */
  Game.init = function () {
    cv = document.getElementById('scene');
    cv.width = PW; cv.height = PH;
    ctx = cv.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;

    FX.init();
    buildStatic();
    W.build();
    seedSnow();
    var qbar = document.querySelector('.qbar');
    if (qbar) {
      syncQualityUI();
      qbar.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-q]');
        if (b) applyQuality(b.getAttribute('data-q'));
      });
    }
    E.reset();
    for (var i = 0; i < 8; i++) E.tickSpawn(9);

    // 按钮（内部像素坐标）
    buttons = [
      { id: 'fire', x: PW - 74, y: PH - 32, w: 66, h: 24, label: 'FIRE', kind: 'big' },
      { id: 'reload', x: PW - 116, y: PH - 32, w: 40, h: 24, label: 'RLD', kind: 'mid' },
      { id: 'sound', x: PW - 26, y: 8, w: 18, h: 14, label: 'SND', kind: 'sml' },
      { id: 'city', x: PW - 48, y: 8, w: 18, h: 14, label: 'MAP', kind: 'sml' }
    ];

    bindInput();
    requestAnimationFrame(loop);
  };

  /* ---------- 静态资源 ---------- */
  function buildStatic() {
    // 瞄具视野：圆形暗角（玩家是通过瞄具在看，画面里不出现枪）
    scopeCv = PS.layer(PW, PH, function (g) {
      var cx = PW * 0.5, cy = PH * 0.50, R = 300;
      for (var y = 0; y < PH; y++) {
        for (var x = 0; x < PW; x++) {
          var dx = (x - cx) / R, dy = (y - cy) / (R * 0.86);
          var d = Math.sqrt(dx * dx + dy * dy);
          if (d < 0.66) continue;
          var lv = Math.min(0.86, (d - 0.66) * 2.6);
          PS.dt(g, x, y, 1, 1, C.VOID, lv);
        }
      }
      // 镜筒内缘的一圈极淡反光
      for (var a = 0; a < 720; a++) {
        var ang = a / 720 * 6.2832;
        var rx = cx + Math.cos(ang) * R * 0.665;
        var ry = cy + Math.sin(ang) * R * 0.86 * 0.665;
        if (rx >= 0 && rx < PW && ry >= 0 && ry < PH) PS.dt(g, rx, ry, 1, 1, C.SN4, 0.10);
      }
    });
    scanCv = PS.layer(PW, PH, function (g) {
      for (var y = 0; y < PH; y += 3) PS.dt(g, 0, y, PW, 1, C.VOID, 0.06);
    });
  }

  /* ---------- 画质 ---------- */
  function qualityCfg() { return QUALITY[S.quality] || QUALITY.midlow; }

  function makeFlake() {
    return {
      x: PS.MR(-10, PW + 10), y: PS.MR(0, PH),
      d: Math.random(), ph: Math.random() * 6.28,
      r: Math.random() < 0.12 ? 2 : 1
    };
  }

  function syncQualityUI() {
    var btns = document.querySelectorAll('.qopts button[data-q]');
    Array.prototype.forEach.call(btns, function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-q') === S.quality));
    });
  }

  function applyQuality(name) {
    if (!QUALITY[name]) name = 'midlow';
    S.quality = name;
    var n = qualityCfg().snow;
    if (snow.length > n) snow.length = n;
    while (snow.length < n) snow.push(makeFlake());
    syncQualityUI();
    try { localStorage.setItem('lewu_ps_quality', name); } catch (e) {}
  }
  Game.applyQuality = applyQuality;

  /* ---------- 雪 ---------- */
  function seedSnow() {
    snow.length = 0;
    for (var i = 0; i < qualityCfg().snow; i++) snow.push(makeFlake());
  }

  /* ============================================================
     输入
     ============================================================ */
  function toLocal(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    return {
      x: (clientX - r.left) / r.width * PW,
      y: (clientY - r.top) / r.height * PH
    };
  }

  function bindInput() {
    function hitBtn(p) {
      for (var i = 0; i < buttons.length; i++) {
        var b = buttons[i];
        if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) return b;
      }
      return null;
    }

    cv.addEventListener('mousemove', function (ev) {
      var p = toLocal(ev.clientX, ev.clientY);
      S.aimX = p.x; S.aimY = p.y;
    });
    cv.addEventListener('mousedown', function (ev) {
      PS.Audio.unlock();
      if (S.soundOn) PS.Audio.startWind();
      var p = toLocal(ev.clientX, ev.clientY);
      var b = hitBtn(p);
      if (b) { press(b); return; }
      S.aimX = p.x; S.aimY = p.y;
      if (S.mode === 'brief') { startGame(); return; }
      if (S.mode === 'over') { restart(); return; }
      fire();
    });
    cv.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      S.holdBreath = true;
    });
    window.addEventListener('mouseup', function () { S.holdBreath = false; });

    cv.addEventListener('touchstart', function (ev) {
      ev.preventDefault();
      PS.Audio.unlock();
      if (S.soundOn) PS.Audio.startWind();
      var tp = ev.changedTouches[0];
      var p = toLocal(tp.clientX, tp.clientY);
      var b = hitBtn(p);
      if (b) { press(b); return; }
      S.aimX = p.x; S.aimY = p.y;
      if (S.mode === 'brief') startGame();
      else if (S.mode === 'over') restart();
    }, { passive: false });
    cv.addEventListener('touchmove', function (ev) {
      ev.preventDefault();
      var tp = ev.changedTouches[0];
      var p = toLocal(tp.clientX, tp.clientY);
      S.aimX = p.x; S.aimY = p.y;
    }, { passive: false });

    window.addEventListener('keydown', function (ev) {
      var k = ev.key.toLowerCase();
      if (k === ' ' || k === 'enter') {
        ev.preventDefault();
        if (S.mode === 'brief') startGame();
        else if (S.mode === 'over') restart();
        else fire();
      }
      if (k === 'r') reload();
      if (k === 'shift') S.holdBreath = true;
      if (k === 'm') { S.soundOn = PS.Audio.toggle(); if (S.soundOn) PS.Audio.startWind(); }
      // 微调瞄准（狙击校准）
      if (k === 'arrowleft') S.aimX -= ev.shiftKey ? 0.2 : 1;
      if (k === 'arrowright') S.aimX += ev.shiftKey ? 0.2 : 1;
      if (k === 'arrowup') S.aimY -= ev.shiftKey ? 0.2 : 1;
      if (k === 'arrowdown') S.aimY += ev.shiftKey ? 0.2 : 1;
    });
    window.addEventListener('keyup', function (ev) {
      if (ev.key === 'Shift') S.holdBreath = false;
    });
  }

  function press(b) {
    PS.Audio.ui();
    if (b.id === 'fire') {
      if (S.mode === 'brief') { startGame(); return; }
      if (S.mode === 'over') { restart(); return; }
      fire();
    } else if (b.id === 'reload') {
      reload();
    } else if (b.id === 'sound') {
      S.soundOn = PS.Audio.toggle();
      if (S.soundOn) PS.Audio.startWind();
    } else if (b.id === 'city') {
      W.build();
      FX.init();
    }
  }

  function startGame() {
    S.mode = 'play';
    S.startT = T;
    S.kills = 0; S.head = 0; S.shots = 0; S.hits = 0; S.missed = 0;
    S.mag = S.MAG; S.cycle = 0; S.reload = 0;
    E.reset(); FX.init();
    for (var i = 0; i < 7; i++) E.tickSpawn(9);
    say('ENGAGE');
  }
  function restart() { S.mode = 'brief'; }

  function say(m, dur) { S.msg = m; S.msgT = dur || 2; }

  /* ============================================================
     射击
     ============================================================ */
  function fire() {
    if (S.mode !== 'play') return;
    if (S.reload > 0) return;
    if (S.cycle > 0) { PS.Audio.dry(); return; }
    if (S.mag <= 0) { PS.Audio.dry(); say('NO ROUNDS'); reload(); return; }

    S.mag--;
    S.shots++;
    S.cycle = S.cycleDur;
    S.shake = 3.6;
    S.flash = 2;
    S.kick = 1;                 // 后坐：准星上跳并张开
    PS.Audio.shot();

    // 射手在画面外，弹道自右下角进入
    var mz = MUZZLE;
    // 弹着点 = 准星 + 晃动 + 风偏
    var fp = firePoint();
    var px = Math.floor(fp.x), py = Math.floor(fp.y);

    var blocked = isBlocked(px, py);
    var hit = blocked ? null : E.hitTest(px, py);

    if (hit) {
      S.hits++;
      var fatal;
      if (hit.part === 'head') {
        S.head++;
        fatal = E.hurt(hit.e, 'head', 200, 1, 0.25);
        PS.Audio.hitHead();
        say(hit.part === 'head' ? 'HEADSHOT' : '', 1.4);
      } else {
        fatal = E.hurt(hit.e, hit.part, hit.part === 'torso' ? 55 : 25, 1, 0.25);
        PS.Audio.hitBody();
      }
      if (fatal) {
        S.kills++;
        if (S.kills >= S.target) setTimeout(finish, 900);
      }
      E.noise(px, py, 150, true);
      FX.impact(px, py, 'snow', 1);
    } else {
      S.missed++;
      var mat = materialAt(px, py, blocked);
      FX.impact(px, py, mat, 1);
      if (mat === 'water') PS.Audio.splash(); else PS.Audio.impact(mat === 'stone' || mat === 'metal');
      E.noise(px, py, 110, false);
    }

    S.tracer = { x0: mz.x, y0: mz.y, x1: px, y1: py, t: 0, life: 0.14 };
    if (S.mag === 0) reload();
  }

  function reload() {
    if (S.mode !== 'play' || S.reload > 0 || S.mag === S.MAG) return;
    S.reload = S.reloadDur;
    PS.Audio.load();
    say('RELOADING', 1.2);
  }

  // 准星实际偏移
  function firePoint() {
    var sw = swayAmp();
    var sx = (Math.sin(T * 1.15) * 1.7 + Math.sin(T * 2.71 + 1.3) * 0.9) * sw;
    var sy = (Math.cos(T * 0.93) * 1.3 + Math.sin(T * 3.31) * 0.6) * sw;
    return {
      x: S.aimX + sx + S.wind,
      y: S.aimY + sy
    };
  }
  function swayAmp() {
    var base = 1;
    if (S.holdBreath && S.stamina > 0) base *= 0.32;
    return base;
  }

  function isBlocked(x, y) {
    var cs = W.covers;
    for (var i = 0; i < cs.length; i++) {
      var c = cs[i];
      if (x >= c.x && x < c.x + c.w && y >= c.y && y < c.y + c.h) return true;
    }
    return false;
  }

  function materialAt(x, y, blocked) {
    if (blocked) return 'stone';
    if (y >= G.RIVER_TOP && y < G.RIVER_BOT) return 'water';
    if (y >= G.NEAR_TOP && y < G.NEAR_GND) return 'ice';
    if (y >= G.QUAY_TOP && y < G.QUAY_BOT) return 'stone';
    if (y >= G.NEAR_GND) return 'snow';
    if (y >= G.CITY_BASE) return 'snow';
    return 'stone';
  }

  function finish() {
    if (S.mode !== 'play') return;
    S.mode = 'over';
    S.endT = T;
  }

  /* ============================================================
     主循环
     ============================================================ */
  function loop(ms) {
    var dt = lastMs ? Math.min(0.05, (ms - lastMs) / 1000) : 0.016;
    lastMs = ms;
    T += dt;
    update(dt);
    // 按画质档位限制绘制帧率；逻辑仍然每帧更新，操作不会变顿
    var interval = 1000 / qualityCfg().fps;
    if (!lastPaint || ms - lastPaint >= interval - 0.5) {
      render();
      lastPaint = ms;
    }
    requestAnimationFrame(loop);
  }

  function update(dt) {
    FX._now = T;

    // 风：缓慢变化
    S.windT -= dt;
    if (S.windT <= 0) { S.windT = 4 + Math.random() * 7; S.windTarget = (Math.random() - 0.5) * 5.2; }
    S.wind += (S.windTarget - S.wind) * Math.min(1, dt * 0.6);

    // 屏息耐力
    if (S.holdBreath && S.mode === 'play') S.stamina = Math.max(0, S.stamina - dt * 0.22);
    else S.stamina = Math.min(1, S.stamina + dt * 0.14);

    if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 14);
    if (S.flash > 0) S.flash -= dt * 22;
    if (S.kick > 0) S.kick = Math.max(0, S.kick - dt * 3.4);
    if (S.msgT > 0) S.msgT -= dt;
    if (S.tracer) { S.tracer.t += dt; if (S.tracer.t > S.tracer.life) S.tracer = null; }

    if (S.mode === 'play') {
      if (S.cycle > 0) {
        var before = S.cycle;
        S.cycle -= dt;
        if (before > S.cycleDur * 0.62 && S.cycle <= S.cycleDur * 0.62) PS.Audio.bolt();
        if (S.cycle <= 0) S.cycle = 0;
      }
      if (S.reload > 0) {
        S.reload -= dt;
        if (S.reload <= 0) { S.reload = 0; S.mag = S.MAG; PS.Audio.load(); }
      }
      E.tickSpawn(dt);
      E.update(dt, T);
    }
    FX.update(dt, T);

    // 雪
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      f.y += (10 + f.d * 34) * dt;
      f.x += (7 + f.d * 16 + Math.sin(T * 0.8 + f.ph) * 6) * dt;
      if (f.y > PH + 2) { f.y = -2; f.x = PS.MR(-10, PW + 10); }
      if (f.x > PW + 8) f.x -= PW + 16;
    }
  }

  /* ============================================================
     绘制
     ============================================================ */
  function render() {
    var sx = 0, sy = 0;
    if (S.shake > 0.1) {
      sx = Math.round((Math.random() - 0.5) * S.shake);
      sy = Math.round((Math.random() - 0.5) * S.shake);
    }

    ctx.fillStyle = C.VOID;
    ctx.fillRect(0, 0, PW, PH);

    drawScene(sx, sy);
    drawSnow(1);
    drawSnow(0);      // 少量近层飘雪在最前
    if (qualityCfg().scan) ctx.drawImage(scanCv, 0, 0);
    ctx.drawImage(scopeCv, 0, 0);

    if (S.flash > 0) PS.dt(ctx, 0, 0, PW, PH, C.LP4, Math.min(0.30, S.flash * 0.09));

    drawCrosshair();
    drawHUD();
    if (S.mode === 'brief') drawBrief();
    if (S.mode === 'over') drawResult();
  }

  function drawScene(sx, sy) {
    var q = qualityCfg();
    ctx.drawImage(W.sky, sx, sy);
    if (q.clouds) W.drawClouds(ctx, T);
    ctx.drawImage(W.city, sx, sy);
    if (q.windows) W.drawWindows(ctx, T);
    if (q.searchlight) W.drawSearchlight(ctx, T);
    if (q.smoke) W.drawSmoke(ctx, T);
    ctx.drawImage(W.street, sx, sy);
    FX.drawDecals(ctx);
    if (q.lamps) W.drawLamps(ctx, T);
    // 深度分层：远处的人 → 前景道具（沙袋/车/雪堆）→ 近处的人
    E.drawRange(ctx, T, -1, 0.52);
    ctx.drawImage(W.propsF, sx, sy);
    E.drawRange(ctx, T, 0.52, 2);
    FX.drawParts(ctx);
    ctx.drawImage(W.riverBase, sx, sy);
    if (q.river) W.drawRiverFx(ctx, T);
    ctx.drawImage(W.nearBank, sx, sy);
    if (S.tracer) drawTracer();
  }

  function drawTracer() {
    var tr = S.tracer;
    var a = 1 - tr.t / tr.life;
    var steps = Math.floor(Math.hypot(tr.x1 - tr.x0, tr.y1 - tr.y0));
    if (steps > 0) {
      for (var i = 0; i <= steps; i += 1) {
        var t = i / steps;
        if (t < (1 - a) * 0.85) continue;
        PS.dt(ctx, Math.round(tr.x0 + (tr.x1 - tr.x0) * t), Math.round(tr.y0 + (tr.y1 - tr.y0) * t),
          1, 1, t > 0.6 ? C.LP5 : C.SN6, a * (0.5 + t * 0.5));
      }
    }
  }

  function drawSnow(front) {
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      if (front ? (f.d > 0.86) : (f.d <= 0.86)) {
        PS.dt(ctx, Math.round(f.x), Math.round(f.y), f.r, f.r,
          front ? C.SN8 : C.SN6, 0.35 + f.d * 0.5);
      }
    }
  }

  /* ---------- 准星（无枪：靠准星 + 后坐跳动 + 屏息表现射击） ---------- */
  function drawCrosshair() {
    var fp = firePoint();
    var x = Math.round(fp.x);
    var y = Math.round(fp.y) - Math.round(S.kick * 9);   // 后坐上跳
    var open = Math.round(S.kick * 7);                   // 后坐张开
    var armed = S.reload <= 0 && S.cycle <= 0 && S.mag > 0;
    var col = armed ? C.SN8 : C.BL4;

    // 十字线（留中心空）
    for (var i = 3 + open; i < 11 + open; i++) {
      PS.dt(ctx, x - i, y, 1, 1, col, 0.85);
      PS.dt(ctx, x + i, y, 1, 1, col, 0.85);
      PS.dt(ctx, x, y - i, 1, 1, col, 0.85);
      PS.dt(ctx, x, y + i, 1, 1, col, 0.85);
    }
    // 密位刻度
    for (var k = 1; k < 4; k++) {
      PS.dt(ctx, x, y + k * 4 + 3 + open, 1, 1, col, 0.6);
      PS.dt(ctx, x - k * 4 - 3 - open, y, 1, 1, col, 0.6);
      PS.dt(ctx, x + k * 4 + 3 + open, y, 1, 1, col, 0.6);
    }
    // 中心点
    PS.dt(ctx, x, y, 1, 1, armed ? C.BL5 : C.BL3, 1);
    // 外环角标
    var R = 12 + open;
    PS.dt(ctx, x - R, y - R, 3, 1, col, 0.45);
    PS.dt(ctx, x - R, y - R, 1, 3, col, 0.45);
    PS.dt(ctx, x + R - 2, y - R, 3, 1, col, 0.45);
    PS.dt(ctx, x + R, y - R, 1, 3, col, 0.45);
    PS.dt(ctx, x - R, y + R, 3, 1, col, 0.45);
    PS.dt(ctx, x - R, y + R - 2, 1, 3, col, 0.45);
    PS.dt(ctx, x + R - 2, y + R, 3, 1, col, 0.45);
    PS.dt(ctx, x + R, y + R - 2, 1, 3, col, 0.45);

    if (S.holdBreath) {
      PS.dt(ctx, x - 14 - open, y - 14 - open, 1, 1, C.SN7, 1);
      PS.dt(ctx, x + 14 + open, y + 14 + open, 1, 1, C.SN7, 1);
    }
  }

  /* ---------- HUD ---------- */
  function drawHUD() {
    var st = E.stat();

    // 左上：任务面板
    panel(6, 6, 118, 34);
    PS.text(ctx, 'OBJECTIVE', 12, 12, C.SN6);
    PS.text(ctx, 'PATROL ' + S.kills + '/' + S.target, 12, 21, C.LP4);
    PS.text(ctx, 'CONTACT ' + st.alive, 12, 30, C.SN7);
    // 进度条
    var pw = Math.floor(106 * Math.min(1, S.kills / S.target));
    PS.rect(ctx, 12, 37, 106, 2, C.CN0);
    PS.dt(ctx, 12, 37, pw, 2, C.LP3, 1);

    // 右上：统计 + 状态
    panel(PW - 6 - 96, 28, 96, 46);
    PS.text(ctx, 'KILLS ' + S.kills, PW - 96, 34, C.SN7);
    PS.text(ctx, 'HEAD  ' + S.head, PW - 96, 43, C.BL5);
    var acc = S.shots ? Math.round(S.hits / S.shots * 100) : 0;
    PS.text(ctx, 'ACC   ' + acc + '%', PW - 96, 52, C.SN6);
    PS.text(ctx, 'DOWN  ' + st.down, PW - 96, 61, C.SN5);

    // 左下：弹药 + 呼吸 + 风
    panel(6, PH - 6 - 34, 132, 34);
    for (var i = 0; i < S.MAG; i++) {
      var bx = 12 + i * 9;
      var loaded = i < S.mag;
      PS.rect(ctx, bx, PH - 34, 3, 9, loaded ? C.BR2M : C.CN0);
      PS.dt(ctx, bx, PH - 34, 3, 2, loaded ? C.BR3M : C.CN2, 1);
      PS.rect(ctx, bx, PH - 24, 3, 2, loaded ? C.RS2 : C.CN1);
    }
    // 呼吸条
    PS.text(ctx, 'BRTH', 12, PH - 12, C.SN6);
    PS.rect(ctx, 34, PH - 13, 40, 5, C.CN0);
    PS.dt(ctx, 34, PH - 13, Math.floor(40 * S.stamina), 5, S.stamina > 0.3 ? C.SN6 : C.BL4, 1);
    // 风
    PS.text(ctx, 'WIND', 80, PH - 12, C.SN6);
    var wx = 112, wl = Math.round(S.wind * 3);
    PS.rect(ctx, wx, PH - 10, 24, 1, C.CN3);
    if (wl !== 0) {
      var dirn = wl > 0 ? 1 : -1;
      for (var d = 0; d < Math.abs(wl); d++) PS.dt(ctx, wx + 12 + dirn * d, PH - 10, 1, 1, C.SN7, 0.8);
      PS.dt(ctx, wx + 12 + dirn * Math.abs(wl), PH - 11, 1, 3, C.SN8, 1);
    }

    // 中间提示
    if (S.msgT > 0 && S.msg) {
      var tw = PS.textW(S.msg);
      PS.text(ctx, S.msg, Math.round((PW - tw) / 2), 128, Math.sin(T * 20) > 0 ? C.LP4 : C.LP3);
    }
    // 换弹/拉栓进度
    if (S.reload > 0) {
      var rw = Math.floor(60 * (1 - S.reload / S.reloadDur));
      PS.text(ctx, 'RELOAD', Math.round(PW / 2 - 27), 140, C.SN6);
      PS.rect(ctx, Math.round(PW / 2 - 30), 148, 60, 3, C.CN0);
      PS.dt(ctx, Math.round(PW / 2 - 30), 148, rw, 3, C.LP3, 1);
    } else if (S.cycle > 0) {
      PS.text(ctx, 'BOLT', Math.round(PW / 2 - 10), 148, C.SN5);
    }

    drawButtons();
  }

  function panel(x, y, w, h) {
    PS.dt(ctx, x, y, w, h, C.VOID, 0.55);
    PS.dt(ctx, x, y, w, 1, C.SN5, 0.35);
    PS.dt(ctx, x, y + h - 1, w, 1, C.CN0, 0.7);
    PS.dt(ctx, x, y, 1, h, C.SN5, 0.25);
    PS.dt(ctx, x + w - 1, y, 1, h, C.CN0, 0.6);
  }

  function drawButtons() {
    for (var i = 0; i < buttons.length; i++) button(buttons[i]);
  }
  function button(b) {
    var busy = (b.id === 'fire' && (S.cycle > 0 || S.reload > 0));
    var hot = busy ? 0 : 1;
    PS.rect(ctx, b.x, b.y, b.w, b.h, busy ? C.CN1 : C.CN2);
    PS.dt(ctx, b.x, b.y, b.w, 1, busy ? C.CN3 : C.SN6, hot ? 0.8 : 0.4);
    PS.dt(ctx, b.x, b.y + b.h - 1, b.w, 1, C.VOID, 0.8);
    PS.dt(ctx, b.x, b.y, 1, b.h, C.SN5, hot ? 0.5 : 0.2);
    PS.dt(ctx, b.x + b.w - 1, b.y, 1, b.h, C.VOID, 0.6);
    if (b.kind === 'big') PS.dt(ctx, b.x + 1, b.y + 1, b.w - 2, b.h - 2, b.id === 'fire' ? C.BL3 : C.CN3, 0.35);
    var lbl = b.label;
    if (b.id === 'sound') lbl = S.soundOn ? 'SND' : 'OFF';
    var tw = PS.textW(lbl);
    PS.text(ctx, lbl, Math.round(b.x + (b.w - tw) / 2), Math.round(b.y + (b.h - 7) / 2),
      busy ? C.SN5 : (b.id === 'fire' ? C.LP5 : C.SN7));
  }

  /* ---------- 简报 / 结算 ---------- */
  function drawBrief() {
    PS.dt(ctx, 0, 0, PW, PH, C.VOID, 0.62);
    var bw = 300, bh = 118, bx = Math.round((PW - bw) / 2), by = Math.round((PH - bh) / 2);
    PS.rect(ctx, bx, by, bw, bh, C.CN0);
    PS.dt(ctx, bx, by, bw, 1, C.SN7, 0.8);
    PS.dt(ctx, bx, by + bh - 1, bw, 1, C.SN7, 0.4);
    PS.dt(ctx, bx, by, 1, bh, C.SN7, 0.5);
    PS.dt(ctx, bx + bw - 1, by, 1, bh, C.SN7, 0.5);
    PS.dt(ctx, bx + 2, by + 2, bw - 4, bh - 4, C.NG2, 0.4);

    PS.text(ctx, 'OPERATION WINTER LINE', bx + 14, by + 14, C.LP4);
    PS.dt(ctx, bx + 12, by + 24, bw - 24, 1, C.SN6, 0.35);
    PS.text(ctx, 'SECTOR 07 - FROZEN RIVER', bx + 14, by + 30, C.SN6);
    PS.text(ctx, 'TARGETS : RIVERBANK PATROL', bx + 14, by + 42, C.SN7);
    PS.text(ctx, 'THEY ARE UNARMED AND MOVING', bx + 14, by + 52, C.SN5);
    PS.text(ctx, 'SUPPRESS THE BANK. 20 UNITS.', bx + 14, by + 62, C.SN5);
    PS.text(ctx, 'AMMO 5 ROUNDS - BOLT ACTION', bx + 14, by + 74, C.SN5);
    PS.text(ctx, 'THEY WILL SCATTER AND DIE BADLY', bx + 14, by + 84, C.BL5);

    var blink = Math.sin(T * 4) > -0.2;
    if (blink) {
      var tw = PS.textW('PRESS FIRE TO BEGIN');
      PS.text(ctx, 'PRESS FIRE TO BEGIN', Math.round((PW - tw) / 2), by + 98, C.LP5);
    }
    PS.text(ctx, 'MOUSE AIM / SHIFT STEADY / R RELOAD', bx + 14, by + 108, C.SN4, 1);
  }

  function drawResult() {
    PS.dt(ctx, 0, 0, PW, PH, C.VOID, 0.70);
    var acc = S.shots ? Math.round(S.hits / S.shots * 100) : 0;
    var time = Math.round(S.endT - S.startT);
    var rank = 'C';
    var score = acc * 0.5 + (S.head / Math.max(1, S.kills)) * 100 * 0.3 + (S.target / Math.max(1, time)) * 60 * 0.2;
    if (score > 78) rank = 'S'; else if (score > 62) rank = 'A'; else if (score > 46) rank = 'B';
    var bw = 250, bh = 108, bx = Math.round((PW - bw) / 2), by = Math.round((PH - bh) / 2);
    PS.rect(ctx, bx, by, bw, bh, C.CN0);
    PS.dt(ctx, bx, by, bw, 1, C.LP4, 0.8);
    PS.dt(ctx, bx, by + bh - 1, bw, 1, C.LP4, 0.4);
    PS.dt(ctx, bx, by, 1, bh, C.LP4, 0.5);
    PS.dt(ctx, bx + bw - 1, by, 1, bh, C.LP4, 0.5);

    PS.text(ctx, 'BANK SUPPRESSED', bx + 14, by + 14, C.LP4);
    PS.dt(ctx, bx + 12, by + 24, bw - 24, 1, C.SN6, 0.35);
    PS.text(ctx, 'KILLS      ' + S.kills, bx + 14, by + 32, C.SN7);
    PS.text(ctx, 'HEADSHOTS  ' + S.head, bx + 14, by + 42, C.BL5);
    PS.text(ctx, 'ACCURACY   ' + acc + '%', bx + 14, by + 52, C.SN7);
    PS.text(ctx, 'TIME       ' + time + 'S', bx + 14, by + 62, C.SN6);
    PS.text(ctx, 'SHOTS      ' + S.shots, bx + 14, by + 72, C.SN6);
    PS.text(ctx, 'RATING', bx + 150, by + 44, C.SN6);
    PS.text(ctx, rank, bx + 176, by + 42, rank === 'S' ? C.LP5 : C.SN8);
    if (Math.sin(T * 4) > -0.2) {
      var tw = PS.textW('CLICK TO REDEPLOY');
      PS.text(ctx, 'CLICK TO REDEPLOY', Math.round((PW - tw) / 2), by + 90, C.LP5);
    }
  }

})(window.PS);

</script>
  <script>PS.Game.init();</script>
