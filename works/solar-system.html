<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>太阳系 · 实时轨道模拟</title>
<style>
  :root{
    --bg:#05070c;
    --ink:#e6ebf4;
    --dim:#8b95a8;
    --dim2:#5d6678;
    --line:rgba(255,255,255,.09);
    --line2:rgba(255,255,255,.055);
    --panel:rgba(9,13,21,.78);
    --amber:#ffb765;
    --ice:#7fd4ff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  #hud>*{pointer-events:auto}

  /* ---------- 顶部 ---------- */
  #top{position:absolute;left:22px;top:18px;display:flex;align-items:baseline;gap:14px}
  #top h1{font-size:15px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
  #top .sub{font-size:11px;color:var(--dim2);letter-spacing:.06em}
  #fps{position:absolute;right:20px;top:18px;font-family:var(--mono);font-size:11px;color:var(--dim2);
    letter-spacing:.04em;text-align:right;line-height:1.6}
  #fps b{color:var(--dim);font-weight:500}

  /* ---------- 左侧天体列表 ---------- */
  #list{position:absolute;left:18px;top:64px;width:186px;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow:hidden}
  #list .hd{padding:9px 12px 7px;font-size:10px;letter-spacing:.18em;color:var(--dim2);
    border-bottom:1px solid var(--line2)}
  .row{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer;
    border-left:2px solid transparent;transition:background .16s,border-color .16s}
  .row:hover{background:rgba(255,255,255,.045)}
  .row.on{background:rgba(255,183,101,.09);border-left-color:var(--amber)}
  .row .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 8px currentColor}
  .row .nm{font-size:12.5px;letter-spacing:.02em}
  .row .au{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim2)}

  /* ---------- 右侧信息卡 ---------- */
  #card{position:absolute;right:18px;top:64px;width:294px;max-height:calc(100% - 266px);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    overflow-y:auto;overflow-x:hidden;
    opacity:0;transform:translateX(14px);transition:opacity .3s,transform .3s;pointer-events:none}
  #card.show{opacity:1;transform:none;pointer-events:auto}
  #fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  #tip{position:fixed;left:50%;bottom:200px;z-index:7;white-space:nowrap;
    transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
    padding:8px 15px;border-radius:20px;font-size:11.5px;color:#dbe4f2;letter-spacing:.02em;
    background:rgba(10,14,22,.88);border:1px solid var(--line);
    transition:opacity .5s,transform .5s}
  #tip.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #pick-ring{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;
    border:1.5px solid rgba(150,205,255,.95);border-radius:50%;opacity:0;
    box-shadow:0 0 12px rgba(120,180,255,.55)}
  #pick-ring.go{animation:prRing .8s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes prRing{
    0%{opacity:0;transform:scale(.30)}
    18%{opacity:.95;transform:scale(1.0)}
    100%{opacity:0;transform:scale(3.1)}
  }
  #card::-webkit-scrollbar{width:5px}
  #card::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px}
  #card .ch{padding:14px 16px 12px;border-bottom:1px solid var(--line2)}
  #card .ch .cn{font-size:19px;font-weight:600;letter-spacing:.03em}
  #card .ch .ce{font-size:10px;color:var(--dim2);letter-spacing:.2em;text-transform:uppercase;margin-top:3px}
  #card .ch .ct{display:inline-block;margin-top:8px;font-size:10px;color:var(--amber);
    border:1px solid rgba(255,183,101,.28);border-radius:3px;padding:2px 7px;letter-spacing:.08em}
  #card .cb{padding:12px 16px 14px}
  #card .note{font-size:12.5px;line-height:1.85;color:#c3cbd9;letter-spacing:.015em}
  #card table{width:100%;border-collapse:collapse;margin-top:14px;font-size:11.5px}
  #card td{padding:4.5px 0;vertical-align:top;border-top:1px solid var(--line2)}
  #card td:first-child{color:var(--dim2);width:41%;letter-spacing:.02em}
  #card td:last-child{font-family:var(--mono);color:#d3dae6;text-align:right;font-size:11px;
    font-variant-numeric:tabular-nums}
  #card .moons{margin-top:14px;padding-top:11px;border-top:1px solid var(--line2)}
  #card .moons .mt{font-size:10px;letter-spacing:.16em;color:var(--dim2);margin-bottom:7px}
  #card .moons .mi{display:flex;justify-content:space-between;font-size:11.5px;padding:3px 0;color:#c3cbd9}
  #card .moons .mi span:last-child{font-family:var(--mono);font-size:10.5px;color:var(--dim2)}

  /* ---------- 底部时间条 ---------- */
  #time{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;width:min(620px,94vw);
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:11px 15px 12px}
  #time .t1{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  #date{font-family:var(--mono);font-size:16px;letter-spacing:.05em;font-variant-numeric:tabular-nums}
  #jday{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.04em}
  #spd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--amber);
    letter-spacing:.03em;white-space:nowrap}
  #time .t2{display:flex;align-items:center;gap:9px}
  .btn{font:inherit;font-size:11.5px;color:var(--dim);background:rgba(255,255,255,.05);
    border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;
    transition:.16s;letter-spacing:.03em;white-space:nowrap}
  .btn:hover{color:var(--ink);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18)}
  .btn.on{color:#0a0d14;background:var(--amber);border-color:var(--amber);font-weight:600}
  .btn.sq{padding:5px 9px;font-family:var(--mono)}
  #rng{flex:1;-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
    background:linear-gradient(90deg,rgba(127,212,255,.5),rgba(255,183,101,.6));outline:none;cursor:pointer}
  #rng::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:#e6ebf4;border:2px solid #0a0d14;box-shadow:0 0 0 1px rgba(255,255,255,.25);cursor:pointer}
  #rng::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#e6ebf4;
    border:2px solid #0a0d14;cursor:pointer}

  /* ---------- 右下视图控制 ---------- */
  #view{position:absolute;right:18px;bottom:104px;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
  #view .grp{display:flex;gap:5px}
  #view .lbl{font-size:10px;letter-spacing:.14em;color:var(--dim2);margin-bottom:1px}

  /* ---------- 屏幕标签 ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .lab{position:absolute;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.06em;
    color:rgba(230,235,244,.82);text-shadow:0 1px 6px #000,0 0 14px #000;white-space:nowrap;
    transition:opacity .2s;will-change:transform}
  .lab i{display:block;font-style:normal;font-family:var(--mono);font-size:9px;
    color:rgba(139,149,168,.75);letter-spacing:.04em;margin-top:1px}
  .lab.sel{color:var(--amber)}
  .lab.sel::after{content:"";position:absolute;left:-9px;top:50%;width:4px;height:4px;margin-top:-2px;
    border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}

  /* ---------- 提示 ---------- */
  #hint{position:absolute;left:18px;bottom:18px;font-size:10.5px;color:var(--dim2);line-height:1.85;
    letter-spacing:.02em;max-width:190px}
  #hint b{color:var(--dim);font-weight:500}

  /* ---------- 启动遮罩 ---------- */
  #boot{position:fixed;inset:0;z-index:9;background:#05070c;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .bt{font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
  #boot .bb{width:210px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  #boot .bf{height:100%;width:0%;background:var(--amber);transition:width .25s}
  #boot .bs{font-family:var(--mono);font-size:10px;color:var(--dim2);letter-spacing:.1em}
  #boot.err .bt{color:#ff8a7a}

  #err{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
    background:#05070c;padding:30px;text-align:center;font-size:13px;line-height:2;color:var(--dim)}

  @media (max-width:900px){
    #list{width:150px}
    #card{width:250px;max-height:calc(100% - 250px)}
    #hint{display:none}
    #top .sub{display:none}
  }
  @media (max-width:640px){
    /* 手机上不再把天体列表藏起来：改成顶部一条可横向滑动的选择条 */
    #list{display:block;left:12px;right:104px;top:48px;width:auto}
    #list .hd{display:none}
    #list-b{display:flex;gap:4px;padding:6px 7px;overflow-x:auto;overflow-y:hidden;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    #list-b::-webkit-scrollbar{display:none}
    .row{flex:0 0 auto;padding:5px 9px;gap:6px;border-left:0;border-bottom:2px solid transparent;
      border-radius:6px}
    .row.on{border-bottom-color:var(--amber)}
    .row .nm{font-size:11.5px;white-space:nowrap}
    .row .au{display:none}
    #view{bottom:96px}
    #card{left:12px;right:12px;width:auto;top:auto;bottom:174px;max-height:42%}
    #view .lbl{display:none}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>
<div id="fx"><div id="pick-ring"></div></div>
<div id="tip">拖动旋转 · 双指缩放/拖动 · 点天体飞过去</div>

<div id="hud">
  <div id="top">
    <h1>Solar System</h1>
    <div class="sub">J2000 平均轨道要素 · 实时开普勒解算</div>
  </div>
  <div id="fps">
    <div><b id="f-fps">—</b> fps</div>
    <div id="f-dist">—</div>
  </div>

  <div id="list"><div class="hd">天体</div><div id="list-b"></div></div>

  <div id="card">
    <div class="ch">
      <div class="cn" id="c-name">太阳</div>
      <div class="ce" id="c-en">Sun</div>
      <div class="ct" id="c-type">G2V 主序星</div>
    </div>
    <div class="cb">
      <div class="note" id="c-note"></div>
      <table id="c-tab"></table>
      <div class="moons" id="c-moons" style="display:none">
        <div class="mt">主要卫星</div>
        <div id="c-moons-b"></div>
      </div>
    </div>
  </div>

  <div id="time">
    <div class="t1">
      <div id="date">2000-01-01</div>
      <div id="jday">JD 2451545.0</div>
      <div id="spd">1.0 天/秒</div>
    </div>
    <div class="t2">
      <button class="btn sq" id="b-play" title="空格">暂停</button>
      <button class="btn" id="b-now">回到今天</button>
      <button class="btn" id="b-rev" title="反转时间">反向</button>
      <input type="range" id="rng" min="0" max="1000" value="520">
    </div>
  </div>

  <div id="view">
    <div class="lbl">视图</div>
    <div class="grp">
      <button class="btn on" id="b-scale">压缩比例</button>
      <button class="btn" id="b-orbit">轨道</button>
      <button class="btn" id="b-label">名称</button>
      <button class="btn" id="b-belt">小行星带</button>
    </div>
    <div class="grp">
      <button class="btn" id="b-top">俯视</button>
      <button class="btn" id="b-free">自由视角</button>
      <button class="btn" id="b-tour">自动导览</button>
    </div>
  </div>

  <div id="hint">
    <b>拖拽</b> 旋转视角 · <b>滚轮</b> 缩放<br>
    <b>点击天体</b> 镜头飞过去并查看数据<br>
    <b>空格</b> 暂停 · <b>1–9</b> 选择行星 · <b>Esc</b> 返回全景<br>
    <span id="scale-note">当前为压缩比例：轨道经压缩以便同屏观察</span>
  </div>
</div>

<div id="boot">
  <div class="bt">Solar System</div>
  <div class="bb"><div class="bf" id="boot-f"></div></div>
  <div class="bs" id="boot-s">初始化</div>
</div>

<div id="err"></div>

<script>
"use strict";
/* =========================================================================
   太阳系实时轨道模拟
   - 行星位置由 J2000 平均轨道要素 + 开普勒方程解算，非预设动画
   - 行星表面为程序化生成纹理（3D fbm / 陨石坑 / 条带），无任何外部贴图
   - 渲染为手写 WebGL：球体光照、大气边缘光、土星环与环上阴影、辉光后处理
   ========================================================================= */

const TAU = Math.PI*2, DEG = Math.PI/180, RAD = 180/Math.PI;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const smoothstep=(e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const $ = (id)=> document.getElementById(id);

/* ============================ 噪声 ============================ */
/* 整数哈希 → value noise → fbm，全部无缝（对球面 3D 坐标直接采样） */
function hashi(x,y,z){
  let h = x*374761393 + y*668265263 + z*2147483647;
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}
function vnoise(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  let r=0;
  const c000=hashi(xi,yi,zi),     c100=hashi(xi+1,yi,zi);
  const c010=hashi(xi,yi+1,zi),   c110=hashi(xi+1,yi+1,zi);
  const c001=hashi(xi,yi,zi+1),   c101=hashi(xi+1,yi,zi+1);
  const c011=hashi(xi,yi+1,zi+1), c111=hashi(xi+1,yi+1,zi+1);
  r  = lerp(lerp(c000,c100,u), lerp(c010,c110,u), v);
  const r2 = lerp(lerp(c001,c101,u), lerp(c011,c111,u), v);
  return lerp(r,r2,w);
}
function fbm(x,y,z,oct,lac,gain){
  let s=0, a=0.5, f=1, n=0;
  for(let i=0;i<oct;i++){
    s += a*vnoise(x*f, y*f, z*f);
    n += a; a*=gain; f*=lac;
  }
  return s/n;
}
function ridged(x,y,z,oct,lac){
  let s=0,a=0.5,f=1,n=0;
  for(let i=0;i<oct;i++){
    const v = 1 - Math.abs(vnoise(x*f,y*f,z*f)*2-1);
    s += a*v*v; n += a; a*=0.5; f*=lac;
  }
  return s/n;
}
/* 陨石坑场：稀疏随机坑心，返回 [0,1] 的坑深度与边缘隆起 */
const CRATERS = (function(){
  const N = 260, pts = new Float32Array(N*4);
  for(let i=0;i<N;i++){
    const u = Math.random()*2-1, th = Math.random()*TAU;
    const s = Math.sqrt(Math.max(0,1-u*u));
    pts[i*4]   = s*Math.cos(th);
    pts[i*4+1] = u;
    pts[i*4+2] = s*Math.sin(th);
    pts[i*4+3] = 0.02 + Math.pow(Math.random(),3.2)*0.16;
  }
  return pts;
})();
function craters(x,y,z){
  let d = 1;
  for(let i=0;i<CRATERS.length/4;i++){
    const px=CRATERS[i*4], py=CRATERS[i*4+1], pz=CRATERS[i*4+2], pr=CRATERS[i*4+3];
    const dx=x-px, dy=y-py, dz=z-pz;
    const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(dist < pr*1.55){
      const t = dist/pr;
      if(t < 0.82) d = Math.min(d, 1 - (1 - t/0.82)*0.62);        /* 坑底 */
      else if(t < 1.28) d = Math.min(d, 1 + (1-Math.abs(t-1.05)/0.23)*0.34); /* 环形隆起 */
    }
  }
  return d;
}

/* ============================ 天文数据 ============================ */
/* 轨道要素来源：JPL / Standish 平均要素表（J2000 历元）
   a: 半长轴 AU | e: 偏心率 | i: 轨道倾角(°) | L: 平均经度(°) | w: 近日点经度(°) | n: 升交点经度(°) */
const SUN = {
  id:"sun", name:"太阳", en:"Sun", type:"G2V 主序星", kind:"sun",
  radiusKm:696340, rotH:609.12, tilt:7.25, color:"#ffd08a",
  facts:{
    "赤道直径":"1,392,700 km","质量":"1.989×10³⁰ kg","占系统质量":"99.86 %",
    "光球温度":"5,772 K","核心温度":"1.57×10⁷ K","核心压力":"2.6×10¹⁶ Pa",
    "自转（赤道）":"25.4 天","主要成分":"H 73.5% / He 24.9%",
    "绝对星等":"+4.83","年龄":"约 46 亿年"
  },
  note:"占整个太阳系质量的 99.86%。核心每秒把约 6 亿吨氢聚变为氦，而那里产生的能量要花上数万年才能走到表面。光球温度 5,772 K，外层日冕却高达百万度——这个反常加热的机制至今没有定论。"
};

const PLANETS = [
{ id:"mercury", name:"水星", en:"Mercury", type:"类地行星", kind:"rock",
  a:0.38709927, e:0.20563593, i:7.00497902, L:252.25032350, w:77.45779628, n:48.33076593,
  radiusKm:2439.7, rotH:1407.6, tilt:0.034, color:"#9c8f83", seed:11,
  facts:{ "赤道直径":"4,879 km","质量":"0.055 地球","平均密度":"5.43 g/cm³","表面重力":"3.70 m/s²",
    "自转周期":"58.6 天","公转周期":"88.0 天","一个太阳日":"176 地球日",
    "表面温度":"−173 ~ 427 °C","大气":"几乎无（外逸层）","卫星":"0",
    "半长轴":"0.387 AU","偏心率":"0.2056","轨道倾角":"7.00°" },
  note:"没有真正的大气，昼夜温差接近 600 °C。自转 58.6 天、公转 88 天，两者锁在 3:2 的共振上，结果是一个太阳日长达 176 个地球日——相当于两个水星年。表面布满与月球相似的撞击坑，其中卡洛里盆地直径 1,550 km。" },

{ id:"venus", name:"金星", en:"Venus", type:"类地行星", kind:"venus",
  a:0.72333566, e:0.00677672, i:3.39467605, L:181.97909950, w:131.60246718, n:76.67984255,
  radiusKm:6051.8, rotH:-5832.5, tilt:177.36, color:"#e8c48b", seed:23,
  facts:{ "赤道直径":"12,104 km","质量":"0.815 地球","平均密度":"5.24 g/cm³","表面重力":"8.87 m/s²",
    "自转周期":"243.0 天（逆行）","公转周期":"224.7 天","表面温度":"464 °C",

/* ============================ 轨道解算 ============================ */
/* 由 J2000 平均要素求日心黄道直角坐标（AU）
   d = 距 J2000.0（2000-01-01 12:00 TT）的天数 */
function solveKepler(M, e){
  M = ((M % TAU) + TAU) % TAU;
  let E = M + e*Math.sin(M);
  for(let k=0;k<8;k++){
    const dM = M - (E - e*Math.sin(E));
    const dE = dM / (1 - e*Math.cos(E));
    E += dE;
    if(Math.abs(dE) < 1e-10) break;
  }
  return E;
}
function bodyState(p, d){
  /* 平均运动：n = 0.9856076686 / a^1.5  (度/天) */
  const nn = 0.9856076686 / Math.pow(p.a, 1.5);
  const M = (p.L - p.w)*DEG + nn*d*DEG;
  const E = solveKepler(M, p.e);
  const I = p.i*DEG, om = p.n*DEG, argp = (p.w - p.n)*DEG;
  const xp = p.a*(Math.cos(E) - p.e);
  const yp = p.a*Math.sqrt(1 - p.e*p.e)*Math.sin(E);
  const co=Math.cos(om), so=Math.sin(om), ca=Math.cos(argp), sa=Math.sin(argp), ci=Math.cos(I), si=Math.sin(I);
  const x = (ca*co - sa*so*ci)*xp + (-sa*co - ca*so*ci)*yp;
  const y = (ca*so + sa*co*ci)*xp + (-sa*so + ca*co*ci)*yp;
  const z = (sa*si)*xp + (ca*si)*yp;
  /* 黄道 → 渲染坐标：Y 轴为黄道北，X-Z 为黄道面 */
  return { x:x, y:z, z:-y };
}
/* 由儒略日求公历日期（yyyy-mm-dd） */
function jdToDate(jd){
  const z = Math.floor(jd + 0.5), f = jd + 0.5 - z;
  let a = z;
  if(z >= 2299161){
    const al = Math.floor((z - 1867216.25)/36524.25);
    a = z + 1 + al - Math.floor(al/4);
  }
  const b = a + 1524, c = Math.floor((b - 122.1)/365.25), dd = Math.floor(365.25*c), e = Math.floor((b - dd)/30.6001);
  const day = b - dd - Math.floor(30.6001*e) + f;
  const month = e < 14 ? e - 1 : e - 13;
  const year = month > 2 ? c - 4716 : c - 4715;
  return { y:year, m:month, d:Math.floor(day) };
}
const J2000 = 2451545.0;
function todayJD(){
  const now = new Date();
  return now.getTime()/86400000 + 2440587.5;
}
function fmtDate(jd){
  const g = jdToDate(jd);
  const mm = String(g.m).padStart(2,"0"), dd = String(g.d).padStart(2,"0");
  return g.y + "-" + mm + "-" + dd;
}

/* ============================ 颜色 ============================ */
function hex2rgb(h){
  const s = h.replace("#","");
  return [parseInt(s.slice(0,2),16)/255, parseInt(s.slice(2,4),16)/255, parseInt(s.slice(4,6),16)/255];
}
/* ============================ 程序化表面纹理 ============================ */
/* 对球面方向直接采样 3D 噪声，天然无缝、无极点拉伸接缝 */
function worley(x,y,z,f){
  const gx=Math.floor(x*f), gy=Math.floor(y*f), gz=Math.floor(z*f);
  let f1=1e9;
  for(let dz=-1;dz<=1;dz++)for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const cx=gx+dx, cy=gy+dy, cz=gz+dz;
    const h1=hashi(cx,cy,cz), h2=hashi(cx+17,cy-31,cz+7), h3=hashi(cx-5,cy+13,cz-23);
    const px=(cx+h1)/f, py=(cy+h2)/f, pz=(cz+h3)/f;
    const ddx=x-px, ddy=y-py, ddz=z-pz;
    const d=ddx*ddx+ddy*ddy+ddz*ddz;
    if(d<f1) f1=d;
  }
  return Math.sqrt(f1)*f;
}
const NOFF = [[0,0,0],[13.7,5.2,-9.4],[-8.3,17.1,4.6],[21.5,-11.8,7.2],[-19.4,-6.7,15.3],[6.1,23.9,-13.1]];
function offs(seed){ const o = NOFF[seed % NOFF.length]; return o; }

function genSurface(kind, W, H, seed, base){
  const data = new Uint8Array(W*H*4);

  const bc = hex2rgb(base);
  const TAU2 = Math.PI*2;

    const phi = (y+0.5)/H*Math.PI;
    const sp = Math.sin(phi), cp = Math.cos(phi);

        const n1 = fbm(X*2.4, Y*2.4, Z*2.4, 4, 2.1, 0.5);
        const cr = worley(X, Y, Z, 6.5);
        const n2 = fbm(X*11, Y*11, Z*11, 3, 2.2, 0.5);
        let v = 0.46 + n1*0.30 - 0.30*Math.pow(1-clamp(cr,0,1), 2.0);
        v += (n2-0.5)*0.10;

            b = lerp(b, lerp(0.24, 0.33, sw), t);
            v = lerp(v, 0.62 + sw*0.2, t);
          }
        }
        v = clamp(v, 0, 1);
        if(isJ){
          const lo=[0.796,0.639,0.455], hi=[0.960,0.878,0.741];
          r=lerp(lo[0],hi[0],v); g=lerp(lo[1],hi[1],v); b=lerp(lo[2],hi[2],v);
        }else{
          const lo=[0.808,0.706,0.494], hi=[0.973,0.906,0.760];
          r=lerp(lo[0],hi[0],v); g=lerp(lo[1],hi[1],v); b=lerp(lo[2],hi[2],v);
        }
      }
      else if(kind === "uranus"){
        const band = Math.sin(Y*Math.PI*5.0 + fbm(X*0.9, Y*1.5, Z*0.9, 2, 2.1, 0.5)*1.4);
        const t = fbm(X*2.2, Y*5.0, Z*2.2, 3, 2.1, 0.5);
        let v = 0.52 + band*0.075 + (t-0.5)*0.16;
        v = clamp(v, 0, 1);
        r=lerp(0.545,0.757,v); g=lerp(0.827,0.925,v); b=lerp(0.855,0.949,v);
        if(lat > 0.80){ const k=smoothstep(0.80,0.96,lat); r=lerp(r,0.80,k); g=lerp(g,0.90,k); b=lerp(b,0.93,k); }
      }
      else if(kind === "neptune"){
        const band = Math.sin(Y*Math.PI*4.2 + fbm(X*0.9, Y*1.4, Z*0.9, 2, 2.1, 0.5)*1.6);
        const t = fbm(X*2.6, Y*5.4, Z*2.6, 4, 2.1, 0.52);
        let v = 0.46 + band*0.10 + (t-0.5)*0.34;
        /* 大暗斑 */
        let dth = th - 4.05;
        dth = Math.atan2(Math.sin(dth), Math.cos(dth));
        const ex = dth*0.95, ey = (dy - 0.30)*2.5;
        const rr = Math.sqrt(ex*ex+ey*ey);
        if(rr < 0.22){ const k=smoothstep(0.22,0.08,rr); v = lerp(v, 0.10, k*0.85); }
        /* 白色云带 */
        const cl = ridged(X*3.4, Y*8.0, Z*3.4, 3, 2.2);
        if(cl > 0.72){ const k=smoothstep(0.72,0.95,cl); r=lerp(r,0.92,k); g=lerp(g,0.95,k); b=lerp(b,1.0,k); }
        v = clamp(v, 0, 1);
        r=lerp(0.153,0.494,v); g=lerp(0.282,0.647,v); b=lerp(0.635,0.925,v);
      }
      else if(kind === "io"){
        const t = fbm(X*3.0, Y*3.0, Z*3.0, 4, 2.15, 0.52);
        const sp = ridged(X*6.5, Y*6.5, Z*6.5, 3, 2.2);
        let v = clamp(0.34 + t*0.66, 0, 1);
        r=lerp(0.588,0.937,v); g=lerp(0.435,0.851,v); b=lerp(0.157,0.478,v);
        if(sp > 0.62){ const k=smoothstep(0.62,0.86,sp); r=lerp(r,0.78,k); g=lerp(g,0.36,k); b=lerp(b,0.20,k); }
        if(t > 0.80){ const k=smoothstep(0.80,0.93,t); r=lerp(r,0.96,k); g=lerp(g,0.95,k); b=lerp(b,0.88,k); }
      }
      else if(kind === "europa"){
        const ice = fbm(X*2.2, Y*2.2, Z*2.2, 4, 2.1, 0.5);
        const cr = ridged(X*9.0, Y*9.0, Z*9.0, 4, 2.15);
        let v = clamp(0.62 + ice*0.30, 0, 1);
        r=lerp(0.694,0.925,v); g=lerp(0.651,0.902,v); b=lerp(0.596,0.867,v);
        if(cr > 0.70){ const k=smoothstep(0.70,0.92,cr); r=lerp(r,0.60,k); g=lerp(r*0.62,0.40,k); b=lerp(b,0.30,k); }
      }
      else if(kind === "ganymede"){
        const n1 = fbm(X*2.6, Y*2.6, Z*2.6, 4, 2.1, 0.5);
        const gr = ridged(X*7.5, Y*7.5, Z*7.5, 3, 2.2);
        const cr = worley(X, Y, Z, 5.5);
        let v = 0.46 + n1*0.30 - 0.20*Math.pow(1-clamp(cr,0,1),2.2);
        v = clamp(v + (gr-0.5)*0.12, 0, 1);
        const k = 0.52 + 0.78*v;
        r*=k; g*=k*0.985; b*=k*0.94;
      }
      else if(kind === "titan"){
        const t = fbm(X*1.9, Y*2.6, Z*1.9, 4, 2.1, 0.5);
        let v = clamp(0.44 + t*0.56, 0, 1);
        r=lerp(0.663,0.925,v); g=lerp(0.435,0.741,v); b=lerp(0.157,0.376,v);
      }
      else if(kind === "triton"){
        const t = fbm(X*2.8, Y*2.8, Z*2.8, 4, 2.1, 0.5);
        const cr = ridged(X*6.0, Y*6.0, Z*6.0, 3, 2.2);
        let v = clamp(0.50 + t*0.44, 0, 1);
        r=lerp(0.706,0.925,v); g=lerp(0.663,0.898,v); b=lerp(0.655,0.890,v);
        if(cr > 0.74){ const k=smoothstep(0.74,0.93,cr); r=lerp(r,0.72,k); g=lerp(g,0.60,k); b=lerp(b,0.58,k); }
      }
      else if(kind === "pluto"){
        const t = fbm(X*2.1, Y*2.1, Z*2.1, 4, 2.1, 0.5);
        const cr = worley(X, Y, Z, 4.2);
        /* 斯普特尼克平原：一个大尺度亮区 */
        let dth = th - 1.35;
        dth = Math.atan2(Math.sin(dth), Math.cos(dth));
        const ex = dth*0.9, ey = (dy + 0.10)*2.2;
        const rr = Math.sqrt(ex*ex+ey*ey);
        let v = clamp(0.38 + t*0.52, 0, 1);
        if(rr < 0.30) v = lerp(v, 0.86, smoothstep(0.30,0.14,rr));
        v -= 0.14*Math.pow(1-clamp(cr,0,1), 2.4);
        v = clamp(v, 0, 1);
        r=lerp(0.541,0.925,v); g=lerp(0.451,0.878,v); b=lerp(0.353,0.784,v);
      }
      else if(kind === "moon"){
        const n1 = fbm(X*2.2, Y*2.2, Z*2.2, 4, 2.1, 0.5);
        const cr = worley(X, Y, Z, 7.5);
        const mare = fbm(X*1.25-13, Y*1.25, Z*1.25, 3, 2.1, 0.5);
        let v = 0.50 + n1*0.24 - 0.26*Math.pow(1-clamp(cr,0,1), 2.0);
        if(mare < 0.44) v -= (0.44-mare)*0.72;      /* 月海：更暗的玄武岩平原 */
        v = clamp(v, 0, 1);
        const k = 0.46 + 0.88*v;
        r*=k; g*=k*0.99; b*=k*0.96;
      }
      else if(kind === "callisto"){
        const n1 = fbm(X*2.4, Y*2.4, Z*2.4, 4, 2.1, 0.5);
        const cr = worley(X, Y, Z, 8.0);
        let v = 0.44 + n1*0.26 - 0.30*Math.pow(1-clamp(cr,0,1), 1.9);
        v = clamp(v, 0, 1);
        const k = 0.40 + 0.82*v;
        r*=k; g*=k*0.98; b*=k*0.93;
      }

      const i = (y*W + x)*4;
      data[i]   = clamp(r,0,1)*255;
      data[i+1] = clamp(g,0,1)*255;
      data[i+2] = clamp(b,0,1)*255;
      data[i+3] = 255;
      if(night){
        night[i]   = clamp(nl*1.00,0,1)*255;
        night[i+1] = clamp(nl*0.82,0,1)*255;
        night[i+2] = clamp(nl*0.50,0,1)*255;
        night[i+3] = 255;
      }
    }
  }
  return { data:data, night:night, w:W, h:H };
}

/* 环的径向剖面（1D） */
function genRingTex(W, uranus){
  const d = new Uint8Array(W*4);
  for(let x=0;x<W;x++){
    const t = (x+0.5)/W;
    let a, r, g, b;
    if(uranus){
      const band = 0.5 + 0.5*Math.sin(t*46.0);
      a = 0.05 + 0.20*Math.pow(band, 2.0) * (1 - Math.abs(t-0.55)*1.2);
      a *= (1 - smoothstep(0.93, 1.0, t)) * smoothstep(0.0, 0.06, t);
      r=0.62; g=0.70; b=0.76;
    }else{
      /* 土星：C 环 → B 环 → 卡西尼缝 → A 环（含恩克缝） */
      let base;
      if(t < 0.279)      base = 0.16 + 0.10*Math.sin(t*30.0);            /* C */
      else if(t < 0.691) base = 0.80 + 0.14*Math.sin(t*58.0);            /* B */
      else if(t < 0.762) base = 0.05;                                     /* 卡西尼 */
      else               base = 0.44 + 0.16*Math.sin(t*72.0);             /* A */
      a = base;
      /* 恩克缝 */
      a *= 1 - 0.85*Math.exp(-Math.pow((t-0.946)/0.016, 2));
      /* 细纹结构 */
      a *= 0.80 + 0.34*fbm(t*95.0, 3.3, 1.7, 3, 2.2, 0.5);
      a *= smoothstep(0.0, 0.035, t) * (1 - smoothstep(0.955, 1.0, t));
      a = clamp(a, 0, 1);
      r = lerp(0.70, 0.88, t); g = lerp(0.64, 0.83, t); b = lerp(0.53, 0.72, t);
    }
    const i = x*4;
    d[i]=r*255; d[i+1]=g*255; d[i+2]=b*255; d[i+3]=a*255;
  }
  return { data:d, w:W, h:1 };
}

const canvas = $("gl");
let gl = null, isGL2 = false;
try{
  const opt = { alpha:false, antialias:true, depth:true, stencil:false,
                powerPreference:"high-performance", preserveDrawingBuffer:false };
  gl = canvas.getContext("webgl2", opt);
  if(gl) isGL2 = true;
  if(!gl) gl = canvas.getContext("webgl", opt) || canvas.getContext("experimental-webgl", opt);
}catch(e){ gl = null; }

if(!gl){
  $("boot").classList.add("err","gone");
  $("err").style.display = "flex";
  $("err").innerHTML = "这个页面需要 WebGL。<br>请换用较新的浏览器，或在设置里开启硬件加速。";
  throw new Error("no webgl");
}

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error("shader error:\n" + log + "\n---\n" + src);
    throw new Error("shader: " + log);
  }
  return s;
}
function makeProg(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error("link: " + gl.getProgramInfoLog(p));
  const u = {}, a = {};
  const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<nu;i++){
    const nm = gl.getActiveUniform(p, i).name.replace("[0]","");
    u[nm] = gl.getUniformLocation(p, nm);
  }
  const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
  for(let i=0;i<na;i++){
    const nm = gl.getActiveAttrib(p, i).name;
    a[nm] = gl.getAttribLocation(p, nm);
  }
  return { p:p, u:u, a:a };
}
function buf(target, data, usage){
  const b = gl.createBuffer();
  gl.bindBuffer(target, b);
  gl.bufferData(target, data, usage || gl.STATIC_DRAW);
  return b;
}
function bindAttr(prog, name, buffer, size, stride, offset){
  const loc = prog.a[name];
  if(loc === undefined || loc < 0) return;
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride || 0, offset || 0);
}

/* ============================ 着色器 ============================ */
/* 球面几何：纬度/经度网格，UV 与纹理生成严格对应（v=0 北极） */
function sphereGeo(lat, lon){
  const nv = (lat+1)*(lon+1);
  const pos = new Float32Array(nv*3), uv = new Float32Array(nv*2);
  let k=0, m=0;
  for(let i=0;i<=lat;i++){
    const phi = i/lat*Math.PI, sp = Math.sin(phi), cp = Math.cos(phi);
    for(let j=0;j<=lon;j++){
      const th = j/lon*TAU;
      pos[k++] = sp*Math.cos(th); pos[k++] = cp; pos[k++] = sp*Math.sin(th);
      uv[m++] = j/lon; uv[m++] = i/lat;
    }
  }
  const idx = [];
  for(let i=0;i<lat;i++)for(let j=0;j<lon;j++){
    const a = i*(lon+1)+j, b = a+1, c = a+lon+1, d = c+1;
    /* 绕序保证外表面为正面（CCW 朝外），否则背面剔除会把整颗星球剔成黑球 */
    idx.push(a,b,c, b,d,c);
  }
  const ia = (nv > 65535) ? new Uint32Array(idx) : new Uint16Array(idx);
  if(nv > 65535 && !gl.getExtension("OES_element_index_uint") && !isGL2){
    console.warn("uint index unsupported");
  }
  return { pos:pos, uv:uv, idx:ia, count:idx.length };
}

  float r = length(vP);
  if(r > 1.0) discard;
  float ang = atan(vP.y, vP.x);
  float rays = 0.72 + 0.28 * sin(ang * 9.0 + uTime * 0.10)
                    * sin(ang * 23.0 - uTime * 0.07);
  float a = pow(1.0 - r, 2.6) * rays;
  a += pow(1.0 - r, 12.0) * 0.9;
  gl_FragColor = vec4(vec3(1.0, 0.72, 0.36) * a * uStrength, 1.0);
}`;

  s += (texture2D(uTex, vUV + uDir * 3.2308).rgb + texture2D(uTex, vUV - uDir * 3.2308).rgb) * 0.070270;

/* ============================ 矩阵 ============================ */
function m4(){ return new Float32Array(16); }
function ident(o){ o.fill(0); o[0]=o[5]=o[10]=o[15]=1; return o; }
function persp(o, fovy, asp, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  o.fill(0);
  o[0]=f/asp; o[5]=f; o[10]=(far+near)*nf; o[11]=-1; o[14]=2*far*near*nf;
  return o;
}
function lookAt(o, ex,ey,ez, cx,cy,cz, ux,uy,uz){
  let zx=ex-cx, zy=ey-cy, zz=ez-cz;
  let l = Math.hypot(zx,zy,zz) || 1; zx/=l; zy/=l; zz/=l;
  let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l = Math.hypot(xx,xy,xz) || 1; xx/=l; xy/=l; xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx; o[1]=yx; o[2]=zx; o[3]=0;
  o[4]=xy; o[5]=yy; o[6]=zy; o[7]=0;
  o[8]=xz; o[9]=yz; o[10]=zz; o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[14]=-(zx*ex+zy*ey+zz*ez);
  o[15]=1;
  return o;
}
function mulm(o, a, b){
  for(let c=0;c<4;c++){
    const b0=b[c*4], b1=b[c*4+1], b2=b[c*4+2], b3=b[c*4+3];
    o[c*4]   = a[0]*b0 + a[4]*b1 + a[8]*b2  + a[12]*b3;
    o[c*4+1] = a[1]*b0 + a[5]*b1 + a[9]*b2  + a[13]*b3;
    o[c*4+2] = a[2]*b0 + a[6]*b1 + a[10]*b2 + a[14]*b3;
    o[c*4+3] = a[3]*b0 + a[7]*b1 + a[11]*b2 + a[15]*b3;
  }
  return o;
}
/* 位置 + 均匀缩放 + 自转轴倾角 tilt / 自转相位 spin */
function compose(o, px,py,pz, s, spin, tilt){
  const cy=Math.cos(spin), sy=Math.sin(spin), ct=Math.cos(tilt), st=Math.sin(tilt);
  const m00=cy*ct, m01=-cy*st, m02=sy;
  const m10=st,    m11=ct,     m12=0;
  const m20=-sy*ct,m21=sy*st,  m22=cy;
  o[0]=m00*s; o[1]=m10*s; o[2]=m20*s; o[3]=0;
  o[4]=m01*s; o[5]=m11*s; o[6]=m21*s; o[7]=0;
  o[8]=m02*s; o[9]=m12*s; o[10]=m22*s; o[11]=0;
  o[12]=px; o[13]=py; o[14]=pz; o[15]=1;
  return o;
}

GEO.ringBand = (function(){

    const rr = j/NR;                       /* 0=内 1=外 */
    for(let i=0;i<=NT;i++){

      v[k++] = Math.cos(a)*rr; v[k++] = Math.sin(a)*rr;

  }

    const a=j*(NT+1)+i, b=a+1, c=a+NT+1, dd=c+1;
    idx.push(a,c,b, b,c,dd);

function makeTex(img, w, h, mip, rep){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, img);
  const ws = rep ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, ws);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
  if(mip) gl.generateMipmap(gl.TEXTURE_2D);
  return t;
}

const STARS = (function(){
  const N = 3200, G = 1700;
  const pos = new Float32Array((N+G)*3), col = new Float32Array((N+G)*3), sz = new Float32Array(N+G);
  const galN = (function(){
    const a = 0.42, b = 0.86, c = -0.29;
    const l = Math.hypot(a,b,c); return [a/l, b/l, c/l];
  })();
  function put(i, x, y, z, size, temp){
    const l = Math.hypot(x,y,z) || 1;
    pos[i*3]=x/l; pos[i*3+1]=y/l; pos[i*3+2]=z/l;
    /* 色温：冷(蓝) → 暖(橙) */
    let r,g,b;
    if(temp < 0.5){ const t=temp*2; r=lerp(0.62,1.0,t); g=lerp(0.72,0.95,t); b=1.0; }
    else{ const t=(temp-0.5)*2; r=1.0; g=lerp(0.95,0.78,t); b=lerp(1.0,0.62,t); }
    col[i*3]=r; col[i*3+1]=g; col[i*3+2]=b;
    sz[i] = size;
  }
  for(let i=0;i<N;i++){
    const u = Math.random()*2-1, th = Math.random()*TAU, s = Math.sqrt(Math.max(0,1-u*u));
    const m = Math.pow(Math.random(), 3.4);
    put(i, s*Math.cos(th), u, s*Math.sin(th), 0.55 + m*3.4, Math.random());
  }
  /* 银河带：沿银道面聚集的密集暗星 */
  for(let i=0;i<G;i++){
    const u = Math.random()*2-1, th = Math.random()*TAU, s = Math.sqrt(Math.max(0,1-u*u));
    let x = s*Math.cos(th), y = u, z = s*Math.sin(th);
    const d = x*galN[0] + y*galN[1] + z*galN[2];
    const spread = (Math.random()-0.5) * (0.16 + 0.30*Math.pow(Math.random(),2));
    const k = d + spread;
    x -= galN[0]*d; y -= galN[1]*d; z -= galN[2]*d;
    const l0 = Math.hypot(x,y,z) || 1;
    x/=l0; y/=l0; z/=l0;
    x += galN[0]*k; y += galN[1]*k; z += galN[2]*k;
    const m = Math.pow(Math.random(), 4.2);
    put(N+i, x, y, z, 0.45 + m*1.7, 0.15 + Math.random()*0.7);
  }
  return {
    pos: buf(gl.ARRAY_BUFFER, pos), col: buf(gl.ARRAY_BUFFER, col),
    sz: buf(gl.ARRAY_BUFFER, sz), n: N+G
  };
})();

const BELT = (function(){
  const N = 1500;
  const U = new Float32Array(N*3), V = new Float32Array(N*3);
  const R = new Float32Array(N), T0 = new Float32Array(N), SZ = new Float32Array(N);
  for(let i=0;i<N;i++){
    const a = 2.06 + Math.pow(Math.random(), 0.85)*1.30;   /* 2.06 – 3.36 AU */
    const inc = (Math.random()-0.5)*0.26;
    const node = Math.random()*TAU;
    const cn=Math.cos(node), sn=Math.sin(node), ci=Math.cos(inc), si=Math.sin(inc);
    U[i*3]=cn; U[i*3+1]=0; U[i*3+2]=sn;
    V[i*3]=ci*sn; V[i*3+1]=si; V[i*3+2]=-ci*cn;
    /* 柯克伍德空隙：在 2.50 / 2.82 / 2.95 AU 附近减薄 */
    let keep = 1;
    const gaps = [[2.502,0.030],[2.825,0.028],[2.958,0.024],[3.279,0.020]];
    for(const gp of gaps) if(Math.abs(a-gp[0]) < gp[1] && Math.random() < 0.82) keep = 0;
    R[i] = keep ? a : a;
    T0[i] = Math.random()*TAU;
    SZ[i] = keep ? (0.35 + Math.pow(Math.random(),2.4)*1.05) : 0.0;
  }
  return {
    U: buf(gl.ARRAY_BUFFER, U), V: buf(gl.ARRAY_BUFFER, V),
    R: buf(gl.ARRAY_BUFFER, R), T0: buf(gl.ARRAY_BUFFER, T0), SZ: buf(gl.ARRAY_BUFFER, SZ), n:N
  };
})();

/* ---- 轨道线 ---- */
function orbitLine(p, N){
  const v = new Float32Array(N*3), aa = new Float32Array(N);
  const I = p.i*DEG, om = p.n*DEG, argp = (p.w - p.n)*DEG;
  const co=Math.cos(om), so=Math.sin(om), ca=Math.cos(argp), sa=Math.sin(argp), ci=Math.cos(I), si=Math.sin(I);
  for(let k=0;k<N;k++){
    const M = k/N*TAU;
    const E = solveKepler(M, p.e);
    const xp = p.a*(Math.cos(E)-p.e);
    const yp = p.a*Math.sqrt(1-p.e*p.e)*Math.sin(E);
    const x = (ca*co-sa*so*ci)*xp + (-sa*co-ca*so*ci)*yp;
    const y = (ca*so+sa*co*ci)*xp + (-sa*so+ca*co*ci)*yp;
    const z = (sa*si)*xp + (ca*si)*yp;
    v[k*3]=x; v[k*3+1]=z; v[k*3+2]=-y;
    aa[k]=p.a;
  }
  return { pos: buf(gl.ARRAY_BUFFER, v), a: buf(gl.ARRAY_BUFFER, aa), n:N };
}

function makeFBO(w, h, depth){
  const tex = gl.createTexture();

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let rb = null;
  if(depth){
    rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
  }

}

const mProj = m4(), mView = m4(), mVP = m4(), mModel = m4(), mMVP = m4(), mStarVP = m4(), mStarView = m4();
const camPos = [0,0,0], camRight = [1,0,0], camUp = [0,1,0];
function updateCamera(){
  const c = S.cam;
  const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const cy = Math.cos(c.yaw), sy = Math.sin(c.yaw);
  camPos[0] = c.tx + c.dist*cp*sy;
  camPos[1] = c.ty + c.dist*sp;
  camPos[2] = c.tz + c.dist*cp*cy;
  let fx = c.tx - camPos[0], fy = c.ty - camPos[1], fz = c.tz - camPos[2];
  const fl = Math.hypot(fx,fy,fz) || 1; fx/=fl; fy/=fl; fz/=fl;
  /* right = forward × worldUp */
  let rx = -fz, ry = 0, rz = fx;
  const rl = Math.hypot(rx,ry,rz) || 1; rx/=rl; ry/=rl; rz/=rl;
  camRight[0]=rx; camRight[1]=ry; camRight[2]=rz;
  /* up = right × forward */
  camUp[0] = ry*fz - rz*fy; camUp[1] = rz*fx - rx*fz; camUp[2] = rx*fy - ry*fx;
  lookAt(mView, camPos[0],camPos[1],camPos[2], c.tx,c.ty,c.tz, camUp[0],camUp[1],camUp[2]);
  const near = Math.max(0.004, c.dist*0.006);
  const far  = c.dist*40 + 4000;
  persp(mProj, S.fov, S.W/S.H, near, far);
  mulm(mVP, mProj, mView);
  /* 星空：只取旋转部分 */
  mStarView.set(mView);

  persp(mProj, S.fov, S.W/S.H, 0.05, 100);
  mulm(mStarVP, mProj, mStarView);
}
function project(m, x, y, z){
  const cx = m[0]*x + m[4]*y + m[8]*z  + m[12];
  const cy = m[1]*x + m[5]*y + m[9]*z  + m[13];
  const cw = m[3]*x + m[7]*y + m[11]*z + m[15];
  if(cw <= 0.0001) return null;
  return { x:(cx/cw*0.5+0.5)*S.W/S.dpr/S.rs, y:(1-(cy/cw*0.5+0.5))*S.H/S.dpr/S.rs, w:cw };
}

/* ============================ 相机过渡 ============================
   点天体不再瞬移：统一走 startFly() 的缓动飞行；
   用户自己缩放/拖动会取消飞行并接管相机，且缩放距离不再被每帧覆盖回去。
   ================================================================ */
function camMinDist(){
  const o = S.sel;
  if(o && o.r){
    if(o.id === "sun") return Math.max(o.r*1.30, 0.05);
    return Math.max(o.r*1.45, 0.02);
  }
  /* 自由视角的注视点就是原点＝太阳。这里必须停在太阳表面之外：
     否则一路放大就会一头钻进太阳里，画面从「看太阳」直接变成「在太阳内部」，
     看起来就像相机被瞬移到了别处（老 bug 的真正来源） */
  return Math.max(SUN_OBJ.r*1.35, 0.05);
}
function shortAng(a, b){
  let d = (b - a) % TAU;
  if(d >  Math.PI) d -= TAU;
  if(d < -Math.PI) d += TAU;
  return d;
}
/* 相机的「目标姿态」。行星在动，所以选中态每帧重算 */
function camGoal(){
  const c = S.cam, o = S.sel;
  /* 手势打断了飞行：注视点就地停住。
     否则下一帧会把 tx/ty/tz 硬贴到天体上——飞行只走了一半，
     于是第二根手指刚按下去，画面就"整体错开一段"（用户说的瞬移）。 */
  if(c.free){
    return { yaw:c.yaw, pitch:c.pitchT, dist:c.distT,
             tx:c.gx, ty:c.gy, tz:c.gz, lock:false, track:false };
  }
  if(o && o.id !== "sun" && o.pos){
    /* 落到向阳侧再偏 32°：被照亮的半球 + 一条晨昏线，立体感最强 */
    return { yaw: Math.atan2(-o.pos.x, -o.pos.z) + 0.56,
             pitch: 0.26,
             dist: Math.max(o.r*9.5, o.r*6 + 0.6),
             tx:o.pos.x, ty:o.pos.y, tz:o.pos.z, lock:true, track:true };
  }
  if(o && o.id === "sun"){
    return { yaw:c.yaw, pitch:0.24, dist:Math.max(o.r*4.6, 46),
             tx:0, ty:0, tz:0, lock:true, track:false };
  }
  /* 自由视角：保持用户当前的朝向与缩放，只把注视点收回原点 */
  return { yaw:c.yaw, pitch:c.pitchT, dist:c.distT,
           tx:c.gx, ty:c.gy, tz:c.gz, lock:false, track:false };
}
function startFly(dur){
  const c = S.cam;
  c.free = false;                 /* 显式飞行 = 重新接管注视点与跟随 */
  const g = camGoal();
  c.fly = { t:0, dur:Math.max(0.05, dur || 0.6),
            fyaw:c.yaw, fpitch:c.pitch, fdist:c.dist,
            ftx:c.tx, fty:c.ty, ftz:c.tz, g:g };
  c.pitchT = g.pitch;
  c.distT  = g.dist;
}
function cancelFly(){
  const c = S.cam;
  if(!c.fly) return;
  c.fly = null;
  /* 取消飞行必须同时冻结「目标值」，否则：
     · dist 会继续滑向飞行终点（比如 165 一直缩到 56）；
     · pitch 会被拉向目标俯仰；
     · 注视点会贴上目标天体。
     三者都会让画面在手指刚落下时整体挪一段，观感就是瞬移。 */
  c.distT  = c.dist;
  c.pitchT = c.pitch;
  c.gx = c.tx; c.gy = c.ty; c.gz = c.tz;
  c.free = true;
}
/* 起步给一点加速、末段长长地减速——镜头推进比对称的 ease-in-out 更跟手，
   也不会出现「点了半天没反应」的迟滞感 */
function easeInOut(u){
  u = clamp(u, 0, 1);
  if(u < 0.18){ const v = u/0.18; return v*v*0.28; }
  const v = (u - 0.18)/0.82;
  /* Math.max(0, …)：避免 1-v 出现 -1e-16 时 Math.pow 返回 NaN */
  return 0.28 + (1 - Math.pow(Math.max(0, 1 - v), 2.4))*0.72;
}

function updateCam(dt){
  const c = S.cam;
  if(c.fly){
    const f = c.fly, g = f.g;
    /* 目标天体还在公转：把终点持续刷新到它的当前位置，飞行结束正好咬合 */
    if(g.track && S.sel && S.sel.pos){
      g.tx = S.sel.pos.x; g.ty = S.sel.pos.y; g.tz = S.sel.pos.z;
      g.yaw = Math.atan2(-S.sel.pos.x, -S.sel.pos.z) + 0.56;
      g.dist = Math.max(S.sel.r*9.5, S.sel.r*6 + 0.6);
    }
    f.t += dt;
    let u = f.dur > 0 ? f.t/f.dur : 1;
    if(u >= 1){ u = 1; c.fly = null; }
    const e = easeInOut(u);
    c.yaw   = f.fyaw   + shortAng(f.fyaw, g.yaw) * e;
    c.pitch = f.fpitch + (g.pitch - f.fpitch) * e;
    c.dist  = f.fdist  + (g.dist  - f.fdist)  * e;
    c.tx    = f.ftx    + (g.tx    - f.ftx)    * e;
    c.ty    = f.fty    + (g.ty    - f.fty)    * e;
    c.tz    = f.ftz    + (g.tz    - f.ftz)    * e;
  }else{
    /* 没有飞行任务：角度归用户，距离平滑趋近目标，注视点锁死天体（不再有跟随滞后） */
    c.pitch += (c.pitchT - c.pitch) * Math.min(1, dt*4.0);
    c.dist  += (c.distT  - c.dist)  * Math.min(1, dt*3.2);
    const g = camGoal();
    if(g.lock){ c.tx = g.tx; c.ty = g.ty; c.tz = g.tz; }
    else{
      const k = Math.min(1, dt*3.0);
      c.tx += (g.tx - c.tx)*k; c.ty += (g.ty - c.ty)*k; c.tz += (g.tz - c.tz)*k;
    }
  }
  /* 最小距离：换目标 / 换比例时下限会变，用软推出代替硬钳制，
     否则下限一变大就会被「弹」一下，同样是瞬移观感 */
  const md = camMinDist();
  if(c.dist < md){
    const gap = md - c.dist;
    c.dist = Math.min(md, c.dist + Math.max(gap*Math.min(1, dt*6.0), md*0.005));
  }
  if(c.distT < md) c.distT = md;
  c.dist = Math.min(c.dist, 40000);
}

/* 点击反馈：在目标位置放一圈扩散的环，配合镜头飞行，避免「点了个寂寞」 */
function flashAt(o){
  const el = $("pick-ring");
  if(!el || !o.pos) return;
  let x = o.sx, y = o.sy;
  if(x == null || x < -1000){
    const p = project(mVP, o.pos.x, o.pos.y, o.pos.z);
    if(!p) return;
    x = p.x; y = p.y;
  }
  el.style.left = x.toFixed(0) + "px";
  el.style.top  = y.toFixed(0) + "px";
  el.classList.remove("go");
  void el.offsetWidth;                 /* 强制回流，让动画能重复播放 */
  el.classList.add("go");
}

/* ============================ 每帧逻辑 ============================ */
function updateSim(dt){
  if(S.playing){
    const dir = S.rev ? -1 : 1;
    S.t += dir * S.speed * dt;
  }
  S.time += dt;
  S.real += (S.realT - S.real) * Math.min(1, dt*2.2);
  if(Math.abs(S.realT - S.real) < 0.0008) S.real = S.realT;   /* 插值到位后吸附，避免永久残差 */
  /* 相机平滑统一在 updateCam() 内处理 */

  for(const o of ALL){
    if(o.id === "sun"){ o.r = bodyRadius(SUN.radiusKm, S.real); continue; }
    const st = bodyState(o.def, S.t);
    const s = orbScale(o.def.a, S.real);
    o.pos.x = st.x*s; o.pos.y = st.y*s; o.pos.z = st.z*s;
    o.distAU = Math.hypot(st.x, st.y, st.z);
    o.r = bodyRadius(o.radiusKm, S.real);
    const rotDays = o.def.rotH/24;
    o.spin = (S.t/rotDays)*TAU;
    o.atten = 1.5*Math.pow(Math.max(0.05, o.distAU), -0.19);
    for(const m of o.moonObjs){
      const ang = (S.t/m.periodD)*TAU;
      const cn=Math.cos(m.node), sn=Math.sin(m.node), ci=Math.cos(m.inc), si=Math.sin(m.inc);
      const ux=cn, uy=0, uz=sn;
      const vx=ci*sn, vy=si, vz=-ci*cn;
      const orbR = lerp(o.r*(2.9 + m.moonIdx*0.95), m.orbitKm*KM_UNIT, S.real);
      const ca=Math.cos(ang), sa=Math.sin(ang);
      m.pos.x = o.pos.x + orbR*(ca*ux + sa*vx);
      m.pos.y = o.pos.y + orbR*(ca*uy + sa*vy);
      m.pos.z = o.pos.z + orbR*(ca*uz + sa*vz);
      m.r = bodyRadius(m.radiusKm, S.real);
      m.spin = ang;
      m.atten = o.atten;
    }
  }
  updateCam(dt);
}

/* ============================ 渲染 ============================ */
function drawSphere(o, mvp){
  /* 屏幕半径（渲染像素）：决定 LOD 与“最小可见半径” */
  const dd = Math.max(0.001, Math.hypot(o.pos.x-camPos[0], o.pos.y-camPos[1], o.pos.z-camPos[2]));
  const sr = o.r * (S.H/2) / Math.tan(S.fov/2) / dd;
  const minPx = (o.id === "sun") ? (S.real > 0.5 ? 13.0 : 3.4) : 2.6;
  const rr = (sr < minPx) ? o.r * (minPx/sr) : o.r;
  const geo = (sr > 30) ? GEO.hi : GEO.lo;
  compose(mModel, o.pos.x, o.pos.y, o.pos.z, rr, o.spin, o.tilt);
  mulm(mMVP, mvp, mModel);
  gl.uniformMatrix4fv(PROG.planet.u.uModel, false, mModel);
  gl.uniformMatrix4fv(PROG.planet.u.uMVP, false, mMVP);
  /* 光源方向：从天体指向太阳 */
  let lx = -o.pos.x, ly = -o.pos.y, lz = -o.pos.z;
  const ll = Math.hypot(lx,ly,lz) || 1;
  gl.uniform3f(PROG.planet.u.uLight, lx/ll, ly/ll, lz/ll);
  gl.uniform3f(PROG.planet.u.uCam, camPos[0], camPos[1], camPos[2]);
  gl.uniform1f(PROG.planet.u.uAtten, o.atten);
  gl.uniform1f(PROG.planet.u.uAmb, 0.10);
  gl.uniform1f(PROG.planet.u.uFill, 0.26);
  const rim = o.rim;
  if(rim){ gl.uniform3f(PROG.planet.u.uRim, rim.c[0], rim.c[1], rim.c[2]);
           gl.uniform1f(PROG.planet.u.uRimPow, rim.pow);
           gl.uniform1f(PROG.planet.u.uRimStr, rim.str); }
  else   { gl.uniform3f(PROG.planet.u.uRim, 0,0,0); gl.uniform1f(PROG.planet.u.uRimPow, 3);
           gl.uniform1f(PROG.planet.u.uRimStr, 0); }
  gl.uniform1f(PROG.planet.u.uSpec, o.spec||0);
  gl.uniform1f(PROG.planet.u.uHasNight, o.night ? 1 : 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, o.tex);
  gl.uniform1i(PROG.planet.u.uTex, 0);
  if(o.night){
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, o.night);
    gl.uniform1i(PROG.planet.u.uNight, 1);
  }
  bindAttr(PROG.planet, "aPos", geo.pos, 3);
  bindAttr(PROG.planet, "aUV", geo.uv, 2);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, geo.i);
  gl.drawElements(gl.TRIANGLES, geo.count, gl.UNSIGNED_SHORT, 0);
}
GEO.hi.i = buf(gl.ELEMENT_ARRAY_BUFFER, GEO.hi.idx);
GEO.hi.uvB = buf(gl.ARRAY_BUFFER, GEO.hi.uv);
GEO.hi.pos = buf(gl.ARRAY_BUFFER, GEO.hi.pos);
GEO.lo.i = buf(gl.ELEMENT_ARRAY_BUFFER, GEO.lo.idx);
GEO.lo.uvB = buf(gl.ARRAY_BUFFER, GEO.lo.uv);
GEO.lo.pos = buf(gl.ARRAY_BUFFER, GEO.lo.pos);
GEO.hi.uv = GEO.hi.uvB; GEO.lo.uv = GEO.lo.uvB;

function drawRing(o){
  const cfg = o.ring;
  if(!cfg || !cfg.tex) return;
  const s = o.r;
  gl.useProgram(PROG.ring.p);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.disable(gl.CULL_FACE);
  compose(mModel, o.pos.x, o.pos.y, o.pos.z, 1, 0, o.tilt);
  mulm(mMVP, mVP, mModel);
  gl.uniformMatrix4fv(PROG.ring.u.uModel, false, mModel);
  gl.uniformMatrix4fv(PROG.ring.u.uMVP, false, mMVP);
  gl.uniform3f(PROG.ring.u.uCam, camPos[0], camPos[1], camPos[2]);
  gl.uniform3f(PROG.ring.u.uSun, 0, 0, 0);
  gl.uniform1f(PROG.ring.u.uInner, cfg.inner*s);
  gl.uniform1f(PROG.ring.u.uOuter, cfg.outer*s);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, cfg.tex);
  gl.uniform1i(PROG.ring.u.uTex, 0);
  /* 用 ringBand：aXY 存归一化的环平面坐标，shader 里再按内外半径映射 */
  bindAttr(PROG.ring, "aXY", GEO.ringBand.b, 2);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, GEO.ringBand.i);
  gl.drawElements(gl.TRIANGLES, GEO.ringBand.n, gl.UNSIGNED_SHORT, 0);
}

let grabReq = null, grabScene = false;
function frame(){
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastT)/1000);
  lastT = now;
  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){ fpsVal = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; adapt(fpsVal); }

  resize();
  if(!FB) { requestAnimationFrame(frame); return; }
  updateSim(dt);
  updateCamera();

  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene.fb);
  gl.viewport(0, 0, S.W, S.H);
  gl.clearColor(0.0, 0.0, 0.0, 1);
  /* 关键：clear 深度前必须打开 depthMask，否则深度缓冲根本清不掉，
     残留下帧的深度会让所有天体被深度测试剔除（星体逐帧消失的元凶） */
  gl.depthMask(true);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  /* --- 星空 --- */
  if(!DBG.stars){
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(PROG.star.p);
  gl.uniformMatrix4fv(PROG.star.u.uMVP, false, mStarVP);
  gl.uniform1f(PROG.star.u.uTime, S.time);
  gl.uniform1f(PROG.star.u.uScale, Math.max(1, S.dpr*S.rs));
  bindAttr(PROG.star, "aPos", STARS.pos, 3);
  bindAttr(PROG.star, "aColor", STARS.col, 3);
  bindAttr(PROG.star, "aSize", STARS.sz, 1);
  gl.drawArrays(gl.POINTS, 0, STARS.n);
  gl.disable(gl.BLEND);
  }

  gl.depthMask(true);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
  if(!DBG.nocull) gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);

  /* --- 小行星带 --- */
  if(S.showBelt && !DBG.belt){
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(PROG.belt.p);
    gl.uniformMatrix4fv(PROG.belt.u.uMVP, false, mVP);
    gl.uniform1f(PROG.belt.u.uTime, S.t);
    gl.uniform1f(PROG.belt.u.uReal, S.real);
    gl.uniform1f(PROG.belt.u.uK, 0.9856076686*DEG);
    gl.uniform1f(PROG.belt.u.uScale, Math.max(1, S.dpr*S.rs));
    gl.uniform3f(PROG.belt.u.uColor, 0.52, 0.48, 0.42);
    bindAttr(PROG.belt, "aU", BELT.U, 3);
    bindAttr(PROG.belt, "aV", BELT.V, 3);
    bindAttr(PROG.belt, "aR", BELT.R, 1);
    bindAttr(PROG.belt, "aTh0", BELT.T0, 1);
    bindAttr(PROG.belt, "aSize", BELT.SZ, 1);
    gl.drawArrays(gl.POINTS, 0, BELT.n);
    gl.disable(gl.BLEND); gl.depthMask(true);
  }

  /* --- 轨道线 --- */
  if(S.showOrbit){
    gl.useProgram(PROG.line.p);
    gl.uniformMatrix4fv(PROG.line.u.uMVP, false, mVP);
    gl.uniform1f(PROG.line.u.uReal, S.real);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    for(const o of ALL){
      if(!o.orbit) continue;
      const on = (S.sel && S.sel.id === o.id);
      gl.uniform4f(PROG.line.u.uColor, on?1.0:0.62, on?0.72:0.80, on?0.40:0.95, on?0.85:0.30);
      bindAttr(PROG.line, "aPos", o.orbit.pos, 3);
      bindAttr(PROG.line, "aA", o.orbit.a, 1);
      gl.drawArrays(gl.LINE_STRIP, 0, o.orbit.n);
    }
    gl.disable(gl.BLEND); gl.depthMask(true);
  }

  /* --- 太阳 --- */
  gl.useProgram(PROG.sun.p);
  if(!DBG.sun)
  {
    const o = SUN_OBJ;
    /* 与行星一致的最小可见半径：真实比例下太阳只有零点几像素，必须放大才看得见 */
    const sd = Math.max(0.001, Math.hypot(camPos[0], camPos[1], camPos[2]));
    const ssr = o.r * (S.H/2) / Math.tan(S.fov/2) / sd;
    const smp = (S.real > 0.5) ? 13.0 : 3.4;
    const srr = (ssr < smp) ? o.r * (smp/ssr) : o.r;
    compose(mModel, 0, 0, 0, srr, o.spin, o.tilt);
    mulm(mMVP, mVP, mModel);
    gl.uniformMatrix4fv(PROG.sun.u.uModel, false, mModel);
    gl.uniformMatrix4fv(PROG.sun.u.uMVP, false, mMVP);
    gl.uniform1f(PROG.sun.u.uTime, S.time);
    bindAttr(PROG.sun, "aPos", GEO.hi.pos, 3);
    bindAttr(PROG.sun, "aUV", GEO.hi.uv, 2);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, GEO.hi.i);
    gl.drawElements(gl.TRIANGLES, GEO.hi.count, gl.UNSIGNED_SHORT, 0);
  }
  /* 日冕 */
  gl.useProgram(PROG.corona.p);
  if(!DBG.corona){
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.depthMask(false);
  gl.uniformMatrix4fv(PROG.corona.u.uMVP, false, mVP);
  gl.uniform3f(PROG.corona.u.uRight, camRight[0], camRight[1], camRight[2]);
  gl.uniform3f(PROG.corona.u.uUp, camUp[0], camUp[1], camUp[2]);
  gl.uniform3f(PROG.corona.u.uCenter, 0, 0, 0);
  gl.uniform1f(PROG.corona.u.uSize, SUN_OBJ.r*2.6);
  gl.uniform1f(PROG.corona.u.uTime, S.time);
  gl.uniform1f(PROG.corona.u.uStrength, 0.85);
  bindAttr(PROG.corona, "aXY", GEO.quad.b, 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  /* --- 行星与卫星 --- */
  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.useProgram(PROG.planet.p);
  for(const o of DRAW){ if(o.id === "sun" || DBG.planets) continue; drawSphere(o, mVP); }

  /* --- 环 --- */
  for(const o of ALL){ if(o.ring && !DBG.rings) drawRing(o); }

  gl.disable(gl.BLEND);
  gl.depthMask(true);
  gl.disable(gl.CULL_FACE);

  /* --- 后处理 --- */
  gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
  gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb);
  gl.viewport(0, 0, BW, BH);
  gl.useProgram(PROG.thresh.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
  gl.uniform1i(PROG.thresh.u.uTex, 0);
  gl.uniform1f(PROG.thresh.u.uThresh, 0.52);
  bindAttr(PROG.thresh, "aXY", GEO.quad.b, 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.useProgram(PROG.blur.p);
  for(let i=0;i<2;i++){
    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.b.fb);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex);
    gl.uniform1i(PROG.blur.u.uTex, 0);
    gl.uniform2f(PROG.blur.u.uDir, (1.0+i*1.4)/BW, 0);
    bindAttr(PROG.blur, "aXY", GEO.quad.b, 2);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, FB.a.fb);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.b.tex);
    gl.uniform1i(PROG.blur.u.uTex, 0);
    gl.uniform2f(PROG.blur.u.uDir, 0, (1.0+i*1.4)/BH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, S.W, S.H);
  gl.useProgram(PROG.comp.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, FB.scene.tex);
  gl.uniform1i(PROG.comp.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, FB.a.tex);
  gl.uniform1i(PROG.comp.u.uBloom, 1);
  gl.uniform1f(PROG.comp.u.uStrength, DBG.post ? 0.0 : 1.28);
  gl.uniform1f(PROG.comp.u.uVig, 0.42);
  bindAttr(PROG.comp, "aXY", GEO.quad.b, 2);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);


  if(grabReq){
    const fromScene = grabScene;
    if(fromScene) gl.bindFramebuffer(gl.FRAMEBUFFER, FB.scene.fb);
    const px = new Uint8Array(S.W*S.H*4);
    gl.readPixels(0, 0, S.W, S.H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    if(fromScene) gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    const fn = grabReq; grabReq = null; grabScene = false; fn(px, S.W, S.H);
  }

  updateLabels();
  updateHUD();
  requestAnimationFrame(frame);
}

let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsVal = 60, adaptCool = 0;
function adapt(f){
  if(adaptCool > 0){ adaptCool -= 0.5; return; }
  if(f < 42 && S.rs > 0.50){ S.rs = Math.max(0.50, S.rs - 0.16); resize(); adaptCool = 2; }
  else if(f > 57 && S.rs < 1.0){ S.rs = Math.min(1.0, S.rs + 0.08); resize(); adaptCool = 3; }
}
function forceResize(){ S.W = 0; S.H = 0; resize(); }

/* ============================ 标签 ============================ */
const labelBox = $("labels");
const labelEls = {};
function ensureLabel(id, name, sub){
  if(labelEls[id]) return labelEls[id];
  const d = document.createElement("div");
  d.className = "lab";
  d.innerHTML = name + (sub ? "<i>" + sub + "</i>" : "");
  labelBox.appendChild(d);
  labelEls[id] = d;
  return d;
}
function updateLabels(){
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const placed = [];
  for(const o of ALL){
    const p = project(mVP, o.pos.x, o.pos.y, o.pos.z);
    const el = ensureLabel(o.id, o.def.name, "");
    if(!p || p.x < -60 || p.x > cw+60 || p.y < -40 || p.y > ch+40){
      el.style.opacity = "0";
      o.vis = false; o.sx = -9999; o.sy = -9999;
      continue;
    }
    o.vis = true; o.sx = p.x; o.sy = p.y;
    if(!S.showLabel){ el.style.opacity = "0"; continue; }
    const isSel = S.sel && S.sel.id === o.id;
    if(!isSel && placed.some(function(q){ return Math.abs(q.x-p.x) < 36 && Math.abs(q.y-p.y) < 22; })){
      el.style.opacity = "0"; continue;
    }
    placed.push({ x:p.x, y:p.y });
    const off = Math.max(9, o.r * (S.W/S.dpr/S.rs) / Math.max(0.01,p.w) * 0.5);
    el.style.opacity = (o.id === "sun") ? "0.92" : "0.88";
    el.style.transform = "translate(-50%,-50%) translate(" + p.x.toFixed(1) + "px," + (p.y - off - 8).toFixed(1) + "px)";
    el.className = "lab" + ((S.sel && S.sel.id === o.id) ? " sel" : "");
  }
  /* 卫星标签：仅在选中该行星时出现 */
  for(const o of ALL){
    if(!o.moonObjs) continue;
    const show = S.sel && (S.sel.id === o.id);
    for(const m of o.moonObjs){
      const el = ensureLabel(m.id, m.def.name, "");
      if(!show){ el.style.opacity = "0"; m.vis = false; continue; }
      const p = project(mVP, m.pos.x, m.pos.y, m.pos.z);
      if(!p){ el.style.opacity = "0"; m.vis = false; continue; }
      m.vis = true; m.sx = p.x; m.sy = p.y;
      if(!S.showLabel){ el.style.opacity = "0"; continue; }
      el.style.opacity = "0.8";
      el.style.transform = "translate(-50%,-50%) translate(" + p.x.toFixed(1) + "px," + (p.y - 12).toFixed(1) + "px)";
    }
  }
}
function updateHUD(){
  $("f-fps").textContent = fpsVal.toFixed(0);
  const du = S.cam.dist;
  $("f-dist").textContent = (S.realT > 0.5)
    ? (du/REAL_UNIT).toFixed(2) + " AU"
    : du.toFixed(du < 10 ? 2 : 0) + " 单位";
  const jd = J2000 + S.t;
  $("date").textContent = fmtDate(jd);
  $("jday").textContent = "JD " + jd.toFixed(1);
  const sp = Math.abs(S.speed);
  let txt;
  if(sp < 1/24)      txt = (sp*1440).toFixed(0) + " 分钟/秒";
  else if(sp < 1)    txt = (sp*24).toFixed(1) + " 小时/秒";
  else if(sp < 45)   txt = sp.toFixed(1) + " 天/秒";
  else if(sp < 400)  txt = (sp/30.44).toFixed(1) + " 月/秒";
  else               txt = (sp/365.25).toFixed(2) + " 年/秒";
  $("spd").textContent = (S.rev ? "− " : "") + txt;
}
/* ============================ 拾取 ============================ */
function screenR(o){
  const d = Math.hypot(o.pos.x-camPos[0], o.pos.y-camPos[1], o.pos.z-camPos[2]);
  return o.r * (S.H/2) / Math.tan(S.fov/2) / Math.max(0.001, d);
}
function pick(cx, cy){
  let best = null, bd = 1e9;
  for(const o of DRAW){
    if(!o.vis) continue;
    const d = Math.hypot(o.sx-cx, o.sy-cy);
    const thr = Math.max(15, Math.min(60, screenR(o)*0.6 + 12));
    if(d < thr && d < bd){ bd = d; best = o; }
  }
  return best;
}

function select(o){

    el.classList.toggle("on", !!o && el.dataset.id === o.id);
  }
  if(o){
    fillCard(o);
    /* 飞行时长按「要转多少度 + 要飞多远」自适应。
       原来 0.62–1.40 s 太快，像被"吸"过去；放慢到 1.25–2.45 s，
       让距离感和公转过程都看得见 */
    const g = camGoal();
    const dA = Math.abs(shortAng(S.cam.yaw, g.yaw));
    const dP = Math.hypot(g.tx - S.cam.tx, g.ty - S.cam.ty, g.tz - S.cam.tz);
    const rel = dP / Math.max(1, S.cam.dist + g.dist);
    startFly(clamp(1.25 + dA*0.36 + rel*0.95, 1.25, 2.45));
    flashAt(o);
  }else{
    S.cam.gx = 0; S.cam.gy = 0; S.cam.gz = 0;
    S.cam.distT = S.realT > 0.5 ? 1800 : 240;
    startFly(1.45);
    $("card").classList.remove("show");
  }
}

/* ============================ 交互 ============================ */
const ptrs = new Map();
let dragMoved = 0, pinchBase = 0, pinchDist0 = 0, lastX = 0, lastY = 0;
let lastMidX = 0, lastMidY = 0;
/* 整个手势期间只要出现过第二根手指，就绝不算"点击"。
   只在抬起那一刻看 ptrs.size 是不够的：三指抬到一指时 size 已经是 1，
   松手会误选天体并触发一次飞行——又是一次"瞬移"。 */
let gestureMulti = false;
let downX = 0, downY = 0;

/* 多指手势的基准值必须「每次手指数量变化都重建」。
   原来的写法只在第一根手指按下时记 lastX/lastY，双指捏合期间又完全不动它，
   于是两指抬掉一根之后，剩下那根手指只要动一点点，就会被算成
   「从第一根手指的位置飞过来」的大位移 —— 这就是松手时画面瞬移的原因。 */
function gestureStats(){
  let sx = 0, sy = 0, dsum = 0, dn = 0;
  const arr = [];
  ptrs.forEach(function(p){ arr.push(p); sx += p.x; sy += p.y; });
  const n = Math.max(1, arr.length);
  for(let i = 0; i < arr.length; i++){
    for(let j = i + 1; j < arr.length; j++){
      dsum += Math.hypot(arr[i].x - arr[j].x, arr[i].y - arr[j].y);
      dn++;
    }
  }
  /* 用「所有手指的质心」+「两两平均距离」而不是固定取前两根：
     三指变两指时也不会因为换了一对手指而让基准突变 */
  return { cx: sx / n, cy: sy / n, d: dn ? dsum / dn : 0 };
}
/* 以当前手指状态重新校准，并吞掉此前的位移（不累加，直接从此刻开始算） */
function syncGesture(){
  const g = gestureStats();
  lastX = g.cx; lastY = g.cy;
  lastMidX = g.cx; lastMidY = g.cy;
  if(ptrs.size >= 2){
    cancelFly();                       /* 双指按下即接管相机，避免飞行插值干扰缩放基准 */
    pinchBase = g.d;
    pinchDist0 = S.cam.dist;
  }else{
    pinchBase = 0;
  }
  return g;
}

canvas.addEventListener("pointerdown", function(e){
  /* 某些情况下 pointer 已释放，setPointerCapture 会抛错；捕获失败不影响后续逻辑 */
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if(ptrs.size === 1){
    dragMoved = 0; downX = e.clientX; downY = e.clientY;
    gestureMulti = false; canvas.classList.add("drag");
  }else{
    gestureMulti = true;
  }
  if(ptrs.size >= 2) gestureMulti = true;
  syncGesture();
});

canvas.addEventListener("pointermove", function(e){
  if(!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  const g = gestureStats();
  const c = S.cam;

  if(ptrs.size === 1){
    const dx = g.cx - lastX, dy = g.cy - lastY;
    lastX = g.cx; lastY = g.cy;
    lastMidX = g.cx; lastMidY = g.cy;
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if(dragMoved > 3){ cancelFly(); if(S.tour) toggleTour(); }   /* 用户接管，同时停掉导览 */
    c.yaw -= dx*0.0055;
    c.pitch = clamp(c.pitch + dy*0.0055, -1.5, 1.5);
    c.pitchT = c.pitch;
  }else if(ptrs.size >= 2){
    /* 双指：质心移动 → 转视角，间距变化 → 缩放。
       两者都用「本次增量」，中途多一根/少一根手指不会把旧位移重算一遍 */
    const dmx = g.cx - lastMidX, dmy = g.cy - lastMidY;
    lastMidX = g.cx; lastMidY = g.cy;
    lastX = g.cx; lastY = g.cy;
    if(Math.abs(dmx) + Math.abs(dmy) > 1.2){
      cancelFly(); if(S.tour) toggleTour();
      /* 双指只负责"粗调"：系数比单指小，避免两指没对齐时画面跟着甩 */
      c.yaw -= dmx*0.0028;
      c.pitch = clamp(c.pitch + dmy*0.0028, -1.5, 1.5);
      c.pitchT = c.pitch;
    }
    if(pinchBase > 4 && g.d > 0){
      cancelFly();
      /* 同时写 distT：否则每帧的平滑会把手指的缩放一点点拉回去（原来的「放大后弹回」） */
      const md = camMinDist();
      const soft = clamp((c.dist - md)/Math.max(0.5, md*1.2), 0.10, 1);
      c.dist = clamp(pinchDist0 * Math.pow(pinchBase/Math.max(4, g.d), soft), md, 40000);
      c.distT = c.dist;
    }
    dragMoved += 10;
  }
});

function endPtr(e){
  if(!ptrs.has(e.pointerId)) return;    /* 兜底监听会重复投递同一事件 */
  ptrs.delete(e.pointerId);
  if(ptrs.size === 0){
    canvas.classList.remove("drag");
    pinchBase = 0;
    /* 三条件都满足才算点击：位移小、按下抬起基本在同一点、全程只有一根手指 */
    const tapGap = Math.hypot(e.clientX - downX, e.clientY - downY);
    if(dragMoved < 7 && tapGap < 12 && !gestureMulti){
      const r = canvas.getBoundingClientRect();
      const hit = pick(e.clientX - r.left, e.clientY - r.top);
      select(hit, true);
    }
    dragMoved = 0;
    gestureMulti = false;
  }else{
    /* 还有手指在屏幕上：立刻以它当前的位置当新基准，位移从零开始 */
    syncGesture();
  }
}
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
/* 兜底：指针在画布外抬起（或捕获失败）时也要清掉，否则残留的 pointerId
   会让下一次单指按下被误判成双指，从此一直在算捏合 */
window.addEventListener("pointerup", endPtr);
window.addEventListener("pointercancel", endPtr);
window.addEventListener("blur", function(){
  ptrs.clear(); pinchBase = 0; dragMoved = 0; gestureMulti = false;
  canvas.classList.remove("drag");
});
canvas.addEventListener("wheel", function(e){
  e.preventDefault();
  cancelFly();
  if(S.tour) toggleTour();
  const md = camMinDist();
  /* 越贴近最近视距，步长越小：手感是「贴到表面」而不是「撞墙」 */
  const soft = clamp((S.cam.dist - md)/Math.max(0.5, md*1.2), 0.10, 1);
  const k = Math.exp(clamp(e.deltaY, -240, 240) * 0.0013 * soft);
  S.cam.dist = clamp(S.cam.dist * k, md, 40000);
  S.cam.distT = S.cam.dist;             /* 与 pinch 同理：缩放后保持，不再被拉回 */
}, { passive:false });
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
/* iOS 的 gesture* 是页面级缩放，canvas 上的 touch-action:none 拦不住它：
   双指一捏，整个网页先被放大，然后才轮到我们处理，看起来就像"画面跳了一下" */
["gesturestart","gesturechange","gestureend"].forEach(function(t){
  document.addEventListener(t, function(e){ e.preventDefault(); }, { passive:false });
});

window.addEventListener("keydown", function(e){
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key;
  if(k === " "){ e.preventDefault(); togglePlay(); }
  else if(k === "Escape"){ select(null, true); }
  else if(k === "0"){ select(SUN_OBJ, true); }
  else if(k >= "1" && k <= "9"){
    const i = parseInt(k, 10) - 1;
    if(i < PLANETS.length) select(ALL[i+1], true);
  }
  else if(k === "o" || k === "O"){ toggleBtn($("b-orbit"), "showOrbit"); }
  else if(k === "l" || k === "L"){ toggleBtn($("b-label"), "showLabel"); }
  else if(k === "r" || k === "R"){ setReal(S.realT > 0.5 ? 0 : 1); }
});

    }
    requestAnimationFrame(frame);
    return;
  }
  $("boot-f").style.width = ((bootI/bootSteps.length)*100).toFixed(0) + "%";
  $("boot-s").textContent = "生成表面 " + (bootI+1) + " / " + bootSteps.length;
  try{ bootSteps[bootI](); }
  catch(err){ console.error(err); }
  bootI++;
  setTimeout(bootStep, 6);
}
resize();
setTimeout(bootStep, 60);

/* ============================ 测试接口 ============================ */
window.__solar = {
  S:S, ALL:ALL, DRAW:DRAW, byId:byId, select:select, setReal:setReal, DBG:DBG,
  PROG:PROG,
  bodyState:bodyState, orbScale:orbScale, bodyRadius:bodyRadius,
  fmtDate:fmtDate, solveKepler:solveKepler,
  get bootDone(){ return bootDoneFlag; },
  get camPos(){ return camPos; },
  get fps(){ return fpsVal; },
  grab:function(fromScene){
    grabScene = !!fromScene;
    return new Promise(function(res){
      grabReq = function(px, w, h){
        let sum=0, mx=0, bright=0, n=0;
        for(let i=0;i<px.length;i+=4*13){
          const v=(px[i]+px[i+1]+px[i+2])/3;
          sum+=v; if(v>mx) mx=v; if(v>90) bright++; n++;
        }
        /* 12x8 网格亮度（readPixels 的 y 轴向上） */
        const G = [];
        for(let gy=0; gy<8; gy++){
          const row = [];
          for(let gx=0; gx<12; gx++){
            let s=0, c=0;
            const x0=Math.floor(gx*w/12), x1=Math.floor((gx+1)*w/12);
            const y0=Math.floor(gy*h/8), y1=Math.floor((gy+1)*h/8);
            for(let y=y0; y<y1; y+=3)for(let x=x0; x<x1; x+=3){
              const i=(y*w+x)*4; s+=(px[i]+px[i+1]+px[i+2])/3; c++;
            }
            row.push(c ? +(s/c).toFixed(1) : 0);
          }
          G.push(row);
        }
        res({ mean:sum/n, max:mx, bright:bright, samples:n, w:w, h:h, grid:G });
      };
    });
  },
  step:function(n){ S.playing=false; for(let i=0;i<(n||1);i++){ updateSim(1/60); } },
  renderOnce:function(){ updateCamera(); },
  /* 场景转储：所有天体按到相机的距离排序，给出屏幕位置与屏幕半径 */
  dump:function(){
    const out = [];
    for(const o of DRAW){
      if(!o.pos) continue;
      const pr = project(mVP, o.pos.x, o.pos.y, o.pos.z);
      const dd = Math.hypot(o.pos.x-camPos[0], o.pos.y-camPos[1], o.pos.z-camPos[2]);
      const sr = o.r*(S.H/2)/Math.tan(S.fov/2)/dd;
      out.push({ id:o.id, dist:+dd.toFixed(1), screenR:+sr.toFixed(1), r:+o.r.toFixed(2),
                 sx: pr ? +pr.x.toFixed(0) : null, sy: pr ? +pr.y.toFixed(0) : null });
    }
    out.sort(function(a,b){ return a.dist - b.dist; });
    return { cam:[+camPos[0].toFixed(1),+camPos[1].toFixed(1),+camPos[2].toFixed(1)],
             target:[+S.cam.tx.toFixed(1),+S.cam.ty.toFixed(1),+S.cam.tz.toFixed(1)],
             dist:+S.cam.dist.toFixed(1),
             css:[+(S.W/S.dpr/S.rs).toFixed(0), +(S.H/S.dpr/S.rs).toFixed(0)],
             W:S.W, H:S.H, bodies:out };
  },
  /* 探针：统计某天体在屏幕上圆盘区域内的明暗像素比例，用于验证「是否被照亮」 */
  probeBody:function(id){
    return new Promise(function(res){
      grabScene = true;
      grabReq = function(px, w, h){
        const o = byId(id);
        if(!o || !o.pos || !o.r){ res(null); return; }
        const pr = project(mVP, o.pos.x, o.pos.y, o.pos.z);
        if(!pr){ res(null); return; }
        const dd = Math.max(0.001, Math.hypot(o.pos.x-camPos[0], o.pos.y-camPos[1], o.pos.z-camPos[2]));
        const sr = Math.max(5, o.r*(S.H/2)/Math.tan(S.fov/2)/dd);
        const cx = pr.x*S.dpr*S.rs, cy = pr.y*S.dpr*S.rs, R = sr*0.92;
        let n=0, sum=0, mx=0, lit=0, dark=0;
        const stp = sr > 40 ? 2 : 1;
        /* 圆盘内 7x7 网格：一眼看出亮面在哪一侧、晨昏线在哪 */
        const G = 7, acc = new Float64Array(G*G), cnt = new Float64Array(G*G);
        for(let dy=-R; dy<=R; dy+=stp)for(let dx=-R; dx<=R; dx+=stp){
          if(dx*dx+dy*dy > R*R) continue;
          const X = Math.round(cx+dx), Y = Math.round(cy+dy);
          if(X<0 || Y<0 || X>=w || Y>=h) continue;
          const i = ((h-1-Y)*w + X)*4;
          const v = (px[i]+px[i+1]+px[i+2])/3;
          sum += v; if(v>mx) mx = v; if(v>28) lit++; if(v<10) dark++; n++;
          const gx = Math.min(G-1, Math.floor((dx/R*0.5+0.5)*G));
          const gy = Math.min(G-1, Math.floor((dy/R*0.5+0.5)*G));
          acc[gy*G+gx] += v; cnt[gy*G+gx]++;
        }
        const grid = [];
        for(let gy=0; gy<G; gy++){ const row=[]; for(let gx=0; gx<G; gx++){
          const k=gy*G+gx; row.push(cnt[k] ? +(acc[k]/cnt[k]).toFixed(0) : -1); } grid.push(row); }
        const ci = ((h>>1)*w + (w>>1))*4;
        const cpx = [px[ci], px[ci+1], px[ci+2]];
        const pi = ((h-1-Math.round(cy))*w + Math.round(cx))*4;
        const ppx = [px[pi], px[pi+1], px[pi+2]];
        res({ samples:n, mean:n?+(sum/n).toFixed(1):0, max:mx,
              litRatio:n?+(lit/n).toFixed(3):0, darkRatio:n?+(dark/n).toFixed(3):0,
              screenR:+sr.toFixed(1), cx:+cx.toFixed(0), cy:+cy.toFixed(0), grid:grid,
              centerPx:cpx, probePx:ppx, W:w, H:h });
      };
    });
  },
  grabRegion:function(rx, ry, rw, rh, fromScene){
    return new Promise(function(res){
      grabReq = function(px, w, h){
        const cv = document.createElement('canvas');
        cv.width = rw; cv.height = rh;
        const cx2 = cv.getContext('2d');
        const img = cx2.createImageData(rw, rh);
        for(let y=0;y<rh;y++){
          const sy = ry + (rh-1-y);
          for(let x=0;x<rw;x++){
            const si = (sy*w + (rx+x))*4, di = (y*rw+x)*4;
            img.data[di]=px[si]; img.data[di+1]=px[si+1]; img.data[di+2]=px[si+2]; img.data[di+3]=255;
          }
        }
        cx2.putImageData(img, 0, 0);
        res(cv.toDataURL('image/png'));
      };
      grabScene = !!fromScene;
    });
  }
};
