  function mountTodo(el) {
    el.innerHTML =
      '<div class="hd"><h1>待办</h1><p>只记今天真要做的事。截止日会用颜色标出临近的。</p></div>' +
      '<div class="sec"><div class="sec-hd"><h2>新增</h2><span class="spacer"></span><span class="hint">Enter 追加</span></div>' +
      '<div class="fields">' +
      '<div class="field"><label for="tdT">要做的事</label><input class="i" id="tdT" maxlength="80" placeholder="例如：回复客户邮件"></div>' +
      '<div class="field w-sm"><label for="tdP">优先级</label><select class="i" id="tdP"><option>普通</option><option>重要</option><option>紧急</option></select></div>' +
      '<div class="field w-md"><label for="tdD">截止日</label><input class="i" id="tdD" type="date"></div>' +
      '</div><div class="row" style="margin-top:14px"><button class="btn" id="tdAdd" type="button">加入清单</button></div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>进行中</h2><span class="spacer"></span><span class="hint" id="tdOpenN"></span></div><div class="list" id="tdOpen"></div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>已完成</h2><span class="spacer"></span><span class="hint" id="tdDoneN"></span></div><div class="list" id="tdDone"></div></div>';

    const q = function (s) { return el.querySelector(s); };
    const store = function () { return LU.load("todo", []); };
    const write = function (v) { LU.save("todo", v); };
    const tI = q("#tdT"), pI = q("#tdP"), dI = q("#tdD");

    function rowHTML(t) {
      const today = LU.today();
      let due = "";
      let dueStyle = "";
      if (t.due) {
        const diff = LU.daysBetween(today, t.due);
        if (diff < 0) { due = "逾期 " + Math.abs(diff) + " 天"; dueStyle = "color:var(--danger)"; }
        else if (diff === 0) { due = "今天到期"; dueStyle = "color:var(--danger)"; }
        else if (diff === 1) { due = "明天到期"; dueStyle = "color:var(--warn)"; }
        else if (diff <= 3) { due = diff + " 天后"; dueStyle = "color:var(--warn)"; }
        else due = LU.cnDate(t.due);
      }
      const pri = t.pri && t.pri !== "普通"
        ? '<span style="color:' + (t.pri === "紧急" ? "var(--danger)" : "var(--warn)") + '">' + esc(t.pri) + "</span>"
        : "";
      return '<div class="item ' + (t.done ? "done" : "") + '" data-id="' + t.id + '">' +
        '<input class="check" type="checkbox" data-act="toggle"' + (t.done ? " checked" : "") + ">" +
        '<div class="item-main"><div class="item-t">' + esc(t.text) + "</div>" +
        '<div class="item-m">' + pri + (due ? '<span style="' + dueStyle + '">' + esc(due) + "</span>" : "") + "</div></div>" +
        '<div class="item-acts"><button type="button" data-act="del" title="删除">' + LU.icon("trash", 13) + "</button></div></div>";
    }
    function bind(box) {
      Array.prototype.forEach.call(box.querySelectorAll(".item"), function (row) {
        const id = row.dataset.id;
        row.querySelector('[data-act="toggle"]').addEventListener("change", function (e) {
          const rows = store();
          rows.forEach(function (t) {
            if (t.id === id) {
              t.done = e.target.checked;
              if (t.done) t.doneAt = Date.now();
            }
          });
          write(rows);
          if (e.target.checked && LU.toast) LU.toast("完成一件");
          render();
        });
        row.querySelector('[data-act="del"]').addEventListener("click", function () {
          write(store().filter(function (t) { return t.id !== id; }));
          render();
        });
      });
    }
    function render() {
      const rows = store();
      const open = rows.filter(function (t) { return !t.done; });
      const done = rows.filter(function (t) { return t.done; });
      const priRank = { "紧急": 0, "重要": 1, "普通": 2 };
      open.sort(function (a, b) {
        if (a.due && b.due && a.due !== b.due) return a.due < b.due ? -1 : 1;
        if (a.due && !b.due) return -1;
        if (!a.due && b.due) return 1;
        return (priRank[a.pri] || 2) - (priRank[b.pri] || 2);
      });
      q("#tdOpenN").textContent = open.length ? open.length + " 项" : "";
      q("#tdDoneN").textContent = done.length ? done.length + " 项" : "";
      q("#tdOpen").innerHTML = open.length ? open.map(rowHTML).join("")
        : '<div class="empty"><b>清单是空的</b>想一件今天必须完成的事，写上去。</div>';
      q("#tdDone").innerHTML = done.length
        ? done.slice(0, 12).map(rowHTML).join("")
        : '<p class="result-empty">完成的事会收到这里。</p>';
      bind(q("#tdOpen"));
      bind(q("#tdDone"));
    }
    function add() {
      const text = tI.value.trim();
      if (!text) { if (LU.toast) LU.toast("先写点内容"); tI.focus(); return; }
      const rows = store();
      rows.push({ id: LU.uid(), ts: Date.now(), text: text, pri: pI.value, due: dI.value || "", done: false });
      write(rows);
      tI.value = "";
      dI.value = "";
      pI.value = "普通";
      render();
      tI.focus();
    }
    q("#tdAdd").addEventListener("click", add);
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target === tI) { e.preventDefault(); add(); }
    });
    LU.todoStats = function () {
      const rows = store();
      const t = LU.today();
      return {
        open: rows.filter(function (x) { return !x.done; }).length,
        todayDone: rows.filter(function (x) { return x.done && x.doneAt && LU.fmtDate(new Date(x.doneAt)) === t; }).length
      };
    };
    render();
  }

  /* ============================================================
     3. 习惯
     ============================================================ */
  function mountHabit(el) {
    el.innerHTML =
      '<div class="hd"><h1>习惯</h1><p>点亮最近 7 天。连续天数会自己累积，断一天就归零。</p></div>' +
      '<div class="sec"><div class="sec-hd"><h2>添加习惯</h2></div><div class="fields">' +
      '<div class="field"><label for="hbN">名称</label><input class="i" id="hbN" maxlength="24" placeholder="例如：读书 20 分钟"></div>' +
      "</div><div class=\"row\" style=\"margin-top:12px\"><button class=\"btn\" id=\"hbAdd\" type=\"button\">添加</button></div></div>" +
      '<div class="sec"><div class="sec-hd"><h2>7 天记录</h2><span class="spacer"></span><span class="hint" id="hbSum"></span></div>' +
      '<div id="hbList"></div></div>';

    const q = function (s) { return el.querySelector(s); };
    const store = function () { return LU.load("habit", []); };
    const write = function (v) { LU.save("habit", v); };
    const DOW = ["日", "一", "二", "三", "四", "五", "六"];

    function days(n) {
      const out = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        out.push(d);
      }
      return out;
    }
    function render() {
      const rows = store();
      const box = q("#hbList");
      const week = days(7);
      const today = LU.today();
      let totalToday = 0;
      rows.forEach(function (h) { if ((h.log || {})[today]) totalToday++; });
      q("#hbSum").textContent = rows.length ? "今天完成 " + totalToday + " / " + rows.length : "";

      if (!rows.length) {
        box.innerHTML = '<div class="empty"><b>还没有习惯</b>从一个最容易坚持的开始，比如喝水。</div>';
        return;
      }
      box.innerHTML = rows.map(function (h) {
        const log = h.log || {};
        let streak = 0;
        for (let i = 0; i < 400; i++) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const k = LU.fmtDate(d);
          if (log[k]) streak++;
          else if (i > 0) break;
        }
        const cells = week.map(function (d) {
          const k = LU.fmtDate(d);
          const isToday = k === today;
          return '<label class="hd-cell"><span class="hd-dow">' + DOW[d.getDay()] + "</span>" +
            '<input class="hd-box' + (isToday ? " today" : "") + '" type="checkbox" ' +
            (log[k] ? "checked" : "") + ' data-h="' + h.id + '" data-d="' + k + '"></label>';
        }).join("");
        return '<div class="habit"><div class="habit-hd">' +
          '<span class="habit-name">' + esc(h.name) + "</span>" +
          '<span class="habit-streak">连续 <b>' + streak + "</b> 天</span>" +
          '<span class="spacer" style="flex:1"></span>' +
          '<button class="btn quiet" type="button" data-del="' + h.id + '">删除</button></div>' +
          '<div class="habit-days">' + cells + "</div></div>";
      }).join("");

      Array.prototype.forEach.call(box.querySelectorAll(".hd-box"), function (cb) {
        cb.addEventListener("change", function () {
          const list = store();
          list.forEach(function (h) {
            if (h.id !== cb.dataset.h) return;
            h.log = h.log || {};
            if (cb.checked) {
              h.log[cb.dataset.d] = 1;
              if (cb.dataset.d === LU.today() && LU.toast) LU.toast("打卡成功");
            } else {
              delete h.log[cb.dataset.d];
            }
          });
          write(list);
          render();
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll("[data-del]"), function (b) {
        b.addEventListener("click", function () {
          if (!window.confirm("删除这个习惯和它的全部记录？")) return;
          write(store().filter(function (h) { return h.id !== b.dataset.del; }));
          render();
        });
      });
    }
    q("#hbAdd").addEventListener("click", function () {
      const n = q("#hbN").value.trim();
      if (!n) { if (LU.toast) LU.toast("给它起个名字"); return; }
      const rows = store();
      rows.push({ id: LU.uid(), name: n, log: {}, ts: Date.now() });
      write(rows);
      q("#hbN").value = "";
      render();
    });
    el.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target && e.target.id === "hbN") { e.preventDefault(); q("#hbAdd").click(); }
    });
    LU.habitStats = function () {
      const rows = store();
      const t = LU.today();
      return {
        total: rows.length,
        today: rows.filter(function (h) { return (h.log || {})[t]; }).length
      };
    };
    render();
  }

  /* ============================================================
     4. 专注
     ============================================================ */
  function mountFocus(el) {
    el.innerHTML =
      '<div class="hd"><h1>专注</h1><p>选一段时间，只做一件事。结束后自动记进专注流水。</p></div>' +
      '<div class="sec" style="text-align:center">' +
      '<div class="row" style="justify-content:center;margin-bottom:18px">' +
      '<span class="seg" id="fcSeg">' +
      '<button type="button" data-min="15" aria-pressed="false">15 分</button>' +
      '<button type="button" data-min="25" aria-pressed="true">25 分</button>' +
      '<button type="button" data-min="45" aria-pressed="false">45 分</button>' +
      '<button type="button" data-min="60" aria-pressed="false">60 分</button>' +
      "</span></div>" +
      '<div class="timer num" id="fcTime">25:00</div>' +
      '<div class="timer-sub" id="fcState">准备开始</div>' +
      '<div class="row" style="justify-content:center">' +
      '<button class="btn" id="fcGo" type="button">开始专注</button>' +
      '<button class="btn ghost" id="fcReset" type="button">重置</button>' +
      "</div></div>" +
      '<div class="sec"><div class="sec-hd"><h2>今天的专注</h2><span class="spacer"></span><span class="hint" id="fcSum"></span></div>' +
      '<div class="list" id="fcList"></div></div>';

    const q = function (s) { return el.querySelector(s); };
    const store = function () { return LU.load("focus", []); };
    const write = function (v) { LU.save("focus", v); };

    let minutes = 25;
    let left = 25 * 60000;
    let running = false;
    let timer = null;
    let startAt = 0;

    function paint() {
      const t = Math.max(0, left);
      const m = Math.floor(t / 60000);
      const s = Math.floor((t % 60000) / 1000);
      q("#fcTime").textContent = pad2(m) + ":" + pad2(s);
      q("#fcGo").textContent = running ? "暂停" : (t < minutes * 60000 ? "继续" : "开始专注");
      q("#fcState").textContent = running
        ? "专注中，手机放远一点"
        : (t === 0 ? "这段时间完成了" : (t < minutes * 60000 ? "已暂停" : "准备开始"));
      document.title = running ? pad2(m) + ":" + pad2(s) + " · 乐乌" : "乐乌 · 个人工具箱";
    }
    function tick() {
      left = startAt + minutes * 60000 - Date.now();
      if (left <= 0) {
        left = 0;
        stop();
        finish();
      }
      paint();
    }
    function stop() {
      running = false;
      if (timer) { clearInterval(timer); timer = null; }
    }
    function finish() {
      const list = store();
      list.unshift({ id: LU.uid(), ts: Date.now(), min: minutes, date: LU.today() });
      write(list);
      LU.trace({ tool: "专注", label: "完成一段专注", value: String(minutes), unit: "分钟", detail: "今天第 " + list.filter(function (f) { return f.date === LU.today(); }).length + " 段" });
      renderList();
      if (LU.toast) LU.toast("完成 " + minutes + " 分钟专注");
      left = minutes * 60000;
      paint();
    }
    function renderList() {
      const list = store().filter(function (f) { return f.date === LU.today(); });
      const total = list.reduce(function (s, f) { return s + f.min; }, 0);
      q("#fcSum").textContent = total ? "共 " + total + " 分钟" : "";
      q("#fcList").innerHTML = list.length
        ? list.map(function (f) {
            const d = new Date(f.ts);
            return '<div class="item"><div class="item-main"><div class="item-t">' + f.min + " 分钟专注</div>" +
              '<div class="item-m"><span>' + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + "</span></div></div>" +
              '<div class="item-amt in">+' + f.min + "</div></div>";
          }).join("")
        : '<div class="empty"><b>今天还没有专注记录</b>开始一段 25 分钟试试。</div>';
    }
    q("#fcSeg").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-min]");
      if (!b) return;
      Array.prototype.forEach.call(q("#fcSeg").querySelectorAll("button"), function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      minutes = parseInt(b.dataset.min, 10);
      stop();
      left = minutes * 60000;
      paint();
    });
    q("#fcGo").addEventListener("click", function () {
      if (running) {
        stop();
        left = startAt + minutes * 60000 - Date.now();
        paint();
        return;
      }
      if (left <= 0) left = minutes * 60000;
      running = true;
      startAt = Date.now() - (minutes * 60000 - left);
      timer = setInterval(tick, 250);
      paint();
    });
    q("#fcReset").addEventListener("click", function () {
      stop();
      left = minutes * 60000;
      paint();
    });
    paint();
    renderList();
    LU.focusStats = function () {
      const t = LU.today();
      const list = store().filter(function (f) { return f.date === t; });
      return list.reduce(function (s, f) { return s + f.min; }, 0);
    };
    // 工具卸载时清理定时器
    LU._cleanup = function () {
      if (timer) { clearInterval(timer); timer = null; }
      document.title = "乐乌 · 个人工具箱";
    };
  }

  /* ============================================================
     5. 计算器
     ============================================================ */
  function safeEval(expr) {
    const cleaned = String(expr).replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/，/g, ",");
    if (!/^[\d+\-*/%().\s]+$/.test(cleaned)) throw new Error("bad");
    const val = Function('"use strict";return (' + cleaned + ")")();
    if (typeof val !== "number" || !isFinite(val)) throw new Error("bad");
    return val;
  }

  function mountCalc(el) {
    el.innerHTML =
      '<div class="hd"><h1>计算器</h1><p>支持 + − × ÷ % 和括号。算完的结果可以直接存进记账。</p></div>' +
      '<div class="sec"><div class="result" id="caOut"><div class="result-val num">0</div></div></div>' +
      '<div class="sec"><div class="fields">' +
      '<div class="field" style="flex:1 1 100%"><label for="caEx">表达式</label>' +
      '<input class="i num" id="caEx" placeholder="例如：(3+5)*12/2" autocomplete="off" spellcheck="false" style="font-size:17px"></div>' +
      "</div>" +
      '<div class="fields" id="caKeys" style="margin-top:12px"></div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>计算历史</h2><span class="spacer"></span><button class="btn quiet" id="caClear" type="button">清空</button></div>' +
      '<div class="list" id="caHist"></div></div>';

    const q = function (s) { return el.querySelector(s); };
    const ex = q("#caEx"), out = q("#caOut");
    let last = null;

    const KEYS = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "−", "0", ".", "(", ")", "%", "+"];
    q("#caKeys").innerHTML =
      '<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;flex:1 1 100%">' +
      KEYS.map(function (k) {
        return '<button class="btn ghost" type="button" data-k="' + k + '" style="min-height:46px;font-size:16px;font-family:var(--font-num)">' + k + "</button>";
      }).join("") +
      '<button class="btn ghost" type="button" data-k="back" style="min-height:46px" title="退格">⌫</button>' +
      '<button class="btn ghost" type="button" data-k="clear" style="min-height:46px;font-size:13px">清空</button>' +
      '<button class="btn" type="button" data-k="eq" style="grid-column:span 2;min-height:46px">=</button>' +
      "</div>";

    function upd() {
      const v = ex.value.trim();
      if (!v) {
        out.innerHTML = '<div class="result-val num">0</div>';
        last = null;
        return;
      }
      try {
        const r = safeEval(v);
        const shown = Math.abs(r) > 1e12 ? r.toExponential(6) : String(+r.toFixed(10));
        last = { expr: v, val: shown };
        out.innerHTML = '<div class="result-val num">' + esc(shown) + "</div>" +
          '<div class="result-rows"><div class="result-row"><span>表达式</span><b style="font-size:12px;font-weight:400">' + esc(v) + "</b></div></div>" +
          '<div class="result-note">' + LU.actions([
            LU.chip("复制结果"),
            LU.chip("存为痕迹"),
            LU.chip("记成支出")
          ]) + "</div>";
        const chips = out.querySelectorAll(".chip");
        if (chips[0]) chips[0].addEventListener("click", LU.copy(shown));
        if (chips[1]) chips[1].addEventListener("click", function () {
          LU.trace({ tool: "计算器", label: v, value: shown, unit: "", detail: "" });
          if (LU.toast) LU.toast("已存入痕迹");
        });
        if (chips[2]) chips[2].addEventListener("click", function () {
          const amt = parseFloat(shown);
          if (!isFinite(amt) || amt <= 0) { if (LU.toast) LU.toast("需要正数才能记成支出"); return; }
          if (LU.addLedgerEntry) {
            LU.addLedgerEntry({ note: "计算器：" + v, amt: amt, type: "支出", cat: "其他" });
            if (LU.toast) LU.toast("已记入记账本");
          }
        });
      } catch (e) {
        out.innerHTML = '<div class="result-empty">表达式还不太完整，继续输入就好。</div>';
        last = null;
      }
    }
    ex.addEventListener("input", upd);
    ex.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      e.preventDefault();
      if (!last) return;
      const hist = LU.load("calc", []);
      hist.unshift({ id: LU.uid(), ts: Date.now(), expr: last.expr, val: last.val });
      LU.save("calc", hist.slice(0, 20));
      ex.value = "";
      upd();
      renderHist();
    });
    q("#caKeys").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-k]");
      if (!b) return;
      const k = b.dataset.k;
      if (k === "eq") {
        ex.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true }));
        return;
      }
      if (k === "clear") { ex.value = ""; upd(); return; }
      if (k === "back") { ex.value = ex.value.slice(0, -1); upd(); return; }
      ex.value += k;
      upd();
    });
    function renderHist() {
      const hist = LU.load("calc", []);
      q("#caHist").innerHTML = hist.length
        ? hist.map(function (h) {
            return '<div class="item" data-id="' + h.id + '"><div class="item-main">' +
              '<div class="item-t num" style="font-size:13px">' + esc(h.expr) + "</div>" +
              '<div class="item-m"><span class="num" style="color:var(--ink-2);font-weight:600">= ' + esc(h.val) + "</span></div></div>" +
              '<div class="item-acts"><button type="button" data-act="use" title="回填">' + LU.icon("arrow", 13) + "</button>" +
              '<button type="button" data-act="del" title="删除">' + LU.icon("trash", 13) + "</button></div></div>";
          }).join("")
        : '<p class="result-empty">按 Enter 保存一次计算，历史会留在这里。</p>';
      Array.prototype.forEach.call(q("#caHist").querySelectorAll(".item"), function (row) {
        const id = row.dataset.id;
        row.querySelector('[data-act="del"]').addEventListener("click", function () {
          LU.save("calc", LU.load("calc", []).filter(function (h) { return h.id !== id; }));
          renderHist();
        });
        row.querySelector('[data-act="use"]').addEventListener("click", function () {
          const h = LU.load("calc", []).filter(function (x) { return x.id === id; })[0];
          if (h) { ex.value = h.expr; upd(); ex.focus(); }
        });
      });
    }
    q("#caClear").addEventListener("click", function () {
      LU.save("calc", []);
      renderHist();
    });
    upd();
    renderHist();
  }

  /* ============================================================
     6. 贷款
     ============================================================ */
  function mountLoan(el) {
    el.innerHTML =
      '<div class="hd"><h1>贷款</h1><p>对比等额本息与等额本金的月供和总利息，并查看逐月还款表。</p></div>' +
      '<div class="sec"><div class="fields">' +
      '<div class="field"><label for="lnP">贷款总额（万元）</label><input class="i" id="lnP" type="number" value="100" step="1" min="0"></div>' +
      '<div class="field w-sm"><label for="lnR">年利率（%）</label><input class="i" id="lnR" type="number" value="3.6" step="0.01" min="0"></div>' +
      '<div class="field w-xs"><label for="lnY">年限</label><input class="i" id="lnY" type="number" value="30" step="1" min="1"></div>' +
      '<div class="field w-sm"><label for="lnM">还款方式</label><select class="i" id="lnM"><option>等额本息</option><option>等额本金</option></select></div>' +
      "</div><div class=\"row\" style=\"margin-top:14px\"><button class=\"btn\" id=\"lnGo\" type=\"button\">计算</button>" +
      '<span class="spacer"></span><button class="btn quiet" id="lnSave" type="button">记成计划</button></div></div>' +
      '<div id="lnResult"></div>';

    const q = function (s) { return el.querySelector(s); };

    function calc() {
      const P = (parseFloat(q("#lnP").value) || 0) * 10000;
      const rate = (parseFloat(q("#lnR").value) || 0) / 100 / 12;
      const n = (parseInt(q("#lnY").value, 10) || 0) * 12;
      const mode = q("#lnM").value;
      if (P <= 0 || n <= 0) { if (LU.toast) LU.toast("请填写贷款金额和年限"); return null; }
      const rows = [];
      let totalInterest = 0;
      if (mode === "等额本息") {
        const k = Math.pow(1 + rate, n);
        const m = rate ? (P * rate * k) / (k - 1) : P / n;
        let bal = P;
        for (let i = 1; i <= n; i++) {
          const interest = bal * rate;
          const principal = m - interest;
          bal = Math.max(0, bal - principal);
          totalInterest += interest;
          if (i <= 360) rows.push({ i: i, pay: m, principal: principal, interest: interest, bal: bal });
        }
        return { mode: mode, P: P, n: n, monthly: m, totalInterest: totalInterest, total: P + totalInterest, rows: rows, firstMonthly: m, lastMonthly: m };
      }
      const mp = P / n;
      let bal = P;
      let first = 0, lastM = 0;
      for (let i = 1; i <= n; i++) {
        const interest = bal * rate;
        const pay = mp + interest;
        if (i === 1) first = pay;
        if (i === n) lastM = pay;
        bal = Math.max(0, bal - mp);
        totalInterest += interest;
        if (i <= 360) rows.push({ i: i, pay: pay, principal: mp, interest: interest, bal: bal });
      }
      return { mode: mode, P: P, n: n, monthly: first, totalInterest: totalInterest, total: P + totalInterest, rows: rows, firstMonthly: first, lastMonthly: lastM };
    }

    let current = null;
    function render() {
      const r = calc();
      current = r;
      if (!r) return;
      const box = q("#lnResult");
      const isEqual = r.mode === "等额本息";
      const head = isEqual
        ? '<div class="result-main"><span class="result-val num">' + LU.money(r.monthly) + '</span><span class="result-unit">元 / 月</span></div>'
        : '<div class="result-main"><span class="result-val num">' + LU.money(r.firstMonthly) + '</span><span class="result-unit">元 首月，逐月递减至 ' + LU.money(r.lastMonthly) + " 元</span></div>";
      const rowsHTML = r.rows.slice(0, 24).map(function (x) {
        return "<tr><td>" + x.i + "</td><td>" + LU.money(x.pay) + "</td><td>" + LU.money(x.principal) + "</td><td>" + LU.money(x.interest) + "</td><td>" + LU.money(x.bal) + "</td></tr>";
      }).join("");

      box.innerHTML =
        '<div class="sec"><div class="result">' + head +
        '<div class="result-rows">' +
        '<div class="result-row"><span>总利息</span><b>' + LU.money(r.totalInterest) + " 元</b></div>" +
        '<div class="result-row"><span>还款总额</span><b>' + LU.money(r.total) + " 元</b></div>" +
        '<div class="result-row"><span>期数</span><b>' + r.n + " 期</b></div>" +
        '<div class="result-row"><span>利息占比</span><b>' + ((r.totalInterest / r.total) * 100).toFixed(1) + "%</b></div>" +
        "</div>" +
        '<div class="result-note">' + r.mode + " · 年利率 " + q("#lnR").value + "% · " + q("#lnY").value + " 年。实际月供以银行为准，此结果不含手续费与提前还款违约金。" +
        LU.actions([LU.chip("复制月供"), LU.chip("记成计划")]) + "</div></div></div>" +
        '<div class="sec"><div class="sec-hd"><h2>前 24 期还款表</h2><span class="spacer"></span><span class="hint">单位：元</span></div>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>期</th><th>月供</th><th>本金</th><th>利息</th><th>剩余本金</th></tr></thead>' +
        "<tbody>" + rowsHTML + "</tbody></table></div></div>";

      const chips = box.querySelectorAll(".chip");
      if (chips[0]) chips[0].addEventListener("click", LU.copy(LU.money(isEqual ? r.monthly : r.firstMonthly)));
      if (chips[1]) chips[1].addEventListener("click", function () { savePlan(r); });
    }

    function savePlan(r) {
      const list = LU.load("loan", []);
      list.unshift({
        id: LU.uid(), ts: Date.now(), mode: r.mode,
        principal: r.P, rate: q("#lnR").value, years: q("#lnY").value,
        monthly: r.monthly, totalInterest: r.totalInterest
      });
      LU.save("loan", list.slice(0, 10));
      LU.trace({
        tool: "贷款", label: r.mode + " " + (r.P / 10000) + " 万",
        value: LU.money(r.totalInterest), unit: "元利息",
        detail: "月供 " + LU.money(r.mode === "等额本息" ? r.monthly : r.firstMonthly)
      });
      if (LU.toast) LU.toast("已记成计划并存入痕迹");
    }

    q("#lnGo").addEventListener("click", render);
    q("#lnSave").addEventListener("click", function () {
      if (!current) render();
      if (current) savePlan(current);
    });
    ["#lnP", "#lnR", "#lnY"].forEach(function (s) {
      q(s).addEventListener("input", render);
    });
    q("#lnM").addEventListener("change", render);
    render();
  }

  /* ============================================================
     7. 个税
     ============================================================ */
  function mountTax(el) {
    el.innerHTML =
      '<div class="hd"><h1>个税</h1><p>按月度累计预扣法估算。起征点 5000 元，含五险一金与专项附加扣除。</p></div>' +
      '<div class="sec"><div class="fields">' +
      '<div class="field"><label for="txS">税前月薪（元）</label><input class="i" id="txS" type="number" value="10000" min="0" step="100"></div>' +
      '<div class="field w-md"><label for="txI">五险一金（元/月）</label><input class="i" id="txI" type="number" value="1500" min="0" step="50"></div>' +
      '<div class="field w-md"><label for="txD">专项附加（元/月）</label><input class="i" id="txD" type="number" value="0" min="0" step="100"><span class="sub">子女教育、房租、赡养老人等</span></div>' +
      "</div></div>" +
      '<div id="txResult"></div>';

    const q = function (s) { return el.querySelector(s); };
    const BR = [
      [3000, 0.03, 0], [12000, 0.1, 210], [25000, 0.2, 1410],
      [35000, 0.25, 2660], [55000, 0.3, 4410], [80000, 0.35, 7160],
      [Infinity, 0.45, 15160]
    ];

    function render() {
      const s = parseFloat(q("#txS").value) || 0;
      const ins = parseFloat(q("#txI").value) || 0;
      const de = parseFloat(q("#txD").value) || 0;
      const base = s - ins - 5000 - de;
      const box = q("#txResult");

      if (s <= 0) {
        box.innerHTML = '<div class="sec"><div class="result"><div class="result-empty">填入税前月薪后自动计算。</div></div></div>';
        return;
      }
      if (base <= 0) {
        box.innerHTML = '<div class="sec"><div class="result">' +
          '<div class="result-main"><span class="result-val num">0</span><span class="result-unit">元 个税</span></div>' +
          '<div class="result-rows"><div class="result-row"><span>应纳税所得额</span><b>' + LU.money(Math.max(0, base)) + " 元</b></div>" +
          '<div class="result-row"><span>税后到手</span><b>' + LU.money(s - ins) + " 元</b></div></div>" +
          '<div class="result-note">收入未超过起征点与扣除合计，本月无需缴税。</div></div></div>';
        return;
      }
      const br = BR.filter(function (x) { return base <= x[0]; })[0];
      const tax = Math.max(0, base * br[1] - br[2]);
      const net = s - ins - tax;

      box.innerHTML =
        '<div class="sec"><div class="result">' +
        '<div class="result-main"><span class="result-val num">' + LU.money(net) + '</span><span class="result-unit">元 税后到手</span></div>' +
        '<div class="result-rows">' +
        '<div class="result-row"><span>应缴个税</span><b>' + LU.money(tax) + " 元</b></div>" +
        '<div class="result-row"><span>适用税率</span><b>' + (br[1] * 100).toFixed(0) + "%（速算扣除 " + br[2] + "）</b></div>" +
        '<div class="result-row"><span>应纳税所得额</span><b>' + LU.money(base) + " 元</b></div>" +
        '<div class="result-row"><span>五险一金</span><b>' + LU.money(ins) + " 元</b></div>" +
        '<div class="result-row"><span>实际税负率</span><b>' + ((tax / s) * 100).toFixed(2) + "%</b></div>" +
        "</div>" +
        '<div class="result-note">按月度税率表估算，未考虑年终奖单独计税与年度汇算差异。' +
        LU.actions([LU.chip("复制税后"), LU.chip("记成收入")]) + "</div></div></div>";

      const chips = box.querySelectorAll(".chip");
      if (chips[0]) chips[0].addEventListener("click", LU.copy(LU.money(net)));
      if (chips[1]) chips[1].addEventListener("click", function () {
        if (LU.addLedgerEntry) {
          LU.addLedgerEntry({ note: "税后月薪", amt: Math.round(net * 100) / 100, type: "收入", cat: "其他" });
          if (LU.toast) LU.toast("已记入记账本");
        }
      });
    }
    ["#txS", "#txI", "#txD"].forEach(function (s) {
      q(s).addEventListener("input", render);
    });
    render();
  }

  /* ============================================================
     8. 文本处理
     ============================================================ */
  function mountText(el) {
    el.innerHTML =
      '<div class="hd"><h1>文本处理</h1><p>统计字数、转换大小写、按行去重排序、批量替换、Base64 编解码。</p></div>' +
      '<div class="sec"><div class="row" style="margin-bottom:12px"><span class="seg" id="txMode">' +
      '<button type="button" data-m="stat" aria-pressed="true">统计</button>' +
      '<button type="button" data-m="case" aria-pressed="false">大小写</button>' +
      '<button type="button" data-m="line" aria-pressed="false">行处理</button>' +
      '<button type="button" data-m="find" aria-pressed="false">替换</button>' +
      '<button type="button" data-m="b64" aria-pressed="false">Base64</button>' +
      "</span></div>" +
      '<div class="field"><label for="txIn">原文</label><textarea class="i" id="txIn" placeholder="粘贴或输入文本…" style="min-height:130px"></textarea></div>' +
      '<div class="row" style="margin-top:10px"><span class="hint" id="txLive" style="font-size:11.5px;color:var(--ink-3)"></span></div></div>' +
      '<div id="txPanel"></div>';

    const q = function (s) { return el.querySelector(s); };
    const inI = q("#txIn");
    let mode = "stat";

    function count(text) {
      const chars = Array.from(text).length;
      const noSpace = Array.from(text.replace(/\s/g, "")).length;
      const cjk = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
      const words = (text.trim().match(/[A-Za-z0-9'’-]+/g) || []).length;
      const lines = text ? text.split(/\r?\n/).length : 0;
      const paras = text.trim() ? text.trim().split(/\n\s*\n/).length : 0;
      return { chars: chars, noSpace: noSpace, cjk: cjk, words: words, lines: lines, paras: paras };
    }

    function render() {
      const text = inI.value;
      const c = count(text);
      q("#txLive").textContent = text ? c.chars + " 字符 · " + c.lines + " 行" : "";
      const box = q("#txPanel");

      if (mode === "stat") {
        box.innerHTML =
          '<div class="sec"><div class="kpis">' +
          '<div class="kpi"><div class="k">字符</div><div class="v num">' + c.chars + "</div></div>" +
          '<div class="kpi"><div class="k">不含空格</div><div class="v num">' + c.noSpace + "</div></div>" +
          '<div class="kpi"><div class="k">汉字</div><div class="v num">' + c.cjk + "</div></div>" +
          '<div class="kpi"><div class="k">英文单词</div><div class="v num">' + c.words + "</div></div>" +
          '<div class="kpi"><div class="k">行数</div><div class="v num">' + c.lines + "</div></div>" +
          '<div class="kpi"><div class="k">段落</div><div class="v num">' + c.paras + "</div></div>" +
          "</div></div>";
        return;
      }
      if (mode === "case") {
        box.innerHTML = '<div class="sec"><div class="sec-hd"><h2>转换结果</h2></div>' +
          '<div class="field"><textarea class="i" id="txOut" readonly style="min-height:110px"></textarea></div>' +
          '<div class="row" style="margin-top:10px">' +
          LU.chip("全部大写", 'data-c="upper"') + LU.chip("全部小写", 'data-c="lower"') +
          LU.chip("首字母大写", 'data-c="cap"') + LU.chip("反转大小写", 'data-c="swap"') +
          LU.chip("复制结果", 'data-c="copy"') + "</div></div>";
        bindCase();
        return;
      }
      if (mode === "line") {
        box.innerHTML = '<div class="sec"><div class="sec-hd"><h2>行处理</h2></div>' +
          '<div class="field"><textarea class="i" id="txOut" readonly style="min-height:110px"></textarea></div>' +
          '<div class="row" style="margin-top:10px">' +
          LU.chip("去重", 'data-c="dedup"') + LU.chip("升序", 'data-c="asc"') +
          LU.chip("降序", 'data-c="desc"') + LU.chip("去空行", 'data-c="blank"') +
          LU.chip("反转顺序", 'data-c="rev"') + LU.chip("加行号", 'data-c="num"') +
          LU.chip("复制结果", 'data-c="copy"') + "</div></div>";
        bindLine();
        return;
      }
      if (mode === "find") {
        box.innerHTML = '<div class="sec"><div class="fields">' +
          '<div class="field"><label for="txA">查找</label><input class="i" id="txA" placeholder="要被替换的内容"></div>' +
          '<div class="field"><label for="txB">替换为</label><input class="i" id="txB" placeholder="留空则删除"></div>' +
          "</div>" +
          '<div class="row" style="margin-top:12px"><button class="btn" id="txGo" type="button">全部替换</button>' +
          '<span class="hint" id="txFound" style="font-size:11.5px;color:var(--ink-3)"></span></div>' +
          '<div class="field" style="margin-top:12px"><textarea class="i" id="txOut" readonly style="min-height:110px"></textarea></div>' +
          '<div class="row" style="margin-top:10px">' + LU.chip("复制结果", 'data-c="copy"') + "</div></div>";
        bindFind();
        return;
      }
      box.innerHTML = '<div class="sec"><div class="sec-hd"><h2>Base64</h2><span class="spacer"></span><span class="hint">支持中文（UTF-8）</span></div>' +
        '<div class="row">' + LU.chip("编码原文", 'data-c="enc"') + LU.chip("解码原文", 'data-c="dec"') + LU.chip("复制结果", 'data-c="copy"') + "</div>" +
        '<div class="field" style="margin-top:12px"><textarea class="i" id="txOut" readonly style="min-height:110px"></textarea></div></div>';
      bindB64();
    }

    function outEl() { return q("#txOut"); }
    function setOut(v) { const o = outEl(); if (o) o.value = v; }
    function wireCopy() {
      const c = q('#txPanel [data-c="copy"]');
      if (c) c.addEventListener("click", function () { LU.copy(outEl() ? outEl().value : "")(); });
    }
    function bindCase() {
      q("#txPanel").addEventListener("click", function (e) {
        const b = e.target.closest("[data-c]");
        if (!b) return;
        const t = inI.value;
        const k = b.dataset.c;
        if (k === "copy") { LU.copy(outEl().value)(); return; }
        const map = {
          upper: function (s) { return s.toUpperCase(); },
          lower: function (s) { return s.toLowerCase(); },
          cap: function (s) {
            return s.replace(/(^|\s)(\S)/g, function (m, a, b2) { return a + b2.toUpperCase(); });
          },
          swap: function (s) {
            return Array.from(s).map(function (ch) {
              return ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase();
            }).join("");
          }
        };
        setOut(map[k] ? map[k](t) : t);
      });
      wireCopy();
    }
    function bindLine() {
      q("#txPanel").addEventListener("click", function (e) {
        const b = e.target.closest("[data-c]");
        if (!b) return;
        const k = b.dataset.c;
        if (k === "copy") { LU.copy(outEl().value)(); return; }
        let lines = inI.value.split(/\r?\n/);
        if (k === "dedup") {
          const seen = {};
          lines = lines.filter(function (l) {
            const t = l.trim();
            if (!t) return true;
            if (seen[t]) return false;
            seen[t] = 1;
            return true;
          });
        } else if (k === "asc") lines = lines.slice().sort(function (a, b2) { return a.localeCompare(b2, "zh"); });
        else if (k === "desc") lines = lines.slice().sort(function (a, b2) { return b2.localeCompare(a, "zh"); });
        else if (k === "blank") lines = lines.filter(function (l) { return l.trim() !== ""; });
        else if (k === "rev") lines = lines.slice().reverse();
        else if (k === "num") lines = lines.map(function (l, i) { return i + 1 + ". " + l; });
        setOut(lines.join("\n"));
      });
      wireCopy();
    }
    function bindFind() {
      function go() {
        const a = q("#txA").value;
        if (!a) { setOut(""); q("#txFound").textContent = "先填入要查找的内容"; return; }
        const b = q("#txB").value;
        const parts = inI.value.split(a);
        const n = parts.length - 1;
        q("#txFound").textContent = "找到 " + n + " 处";
        setOut(parts.join(b));
      }
      q("#txGo").addEventListener("click", go);
      q("#txA").addEventListener("input", go);
      q("#txB").addEventListener("input", go);
      wireCopy();
    }
    function bindB64() {
      q("#txPanel").addEventListener("click", function (e) {
        const b = e.target.closest("[data-c]");
        if (!b) return;
        const k = b.dataset.c;
        if (k === "copy") { LU.copy(outEl().value)(); return; }
        try {
          if (k === "enc") {
            setOut(btoa(unescape(encodeURIComponent(inI.value))));
          } else {
            const raw = inI.value.trim();
            if (!raw) { setOut(""); return; }
            setOut(decodeURIComponent(escape(atob(raw.replace(/\s/g, "")))));
          }
        } catch (err) {
          setOut("这段内容不是有效的 Base64 编码。");
        }
      });
      wireCopy();
    }

    q("#txMode").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-m]");
      if (!b) return;
      mode = b.dataset.m;
      Array.prototype.forEach.call(q("#txMode").querySelectorAll("button"), function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
    inI.addEventListener("input", render);
    render();
  }

  /* ============================================================
     9. 换算
     ============================================================ */
  function mountConvert(el) {
    const UNITS = {
      len: { name: "长度", base: "米", map: { 毫米: 0.001, 厘米: 0.01, 米: 1, 千米: 1000, 英寸: 0.0254, 英尺: 0.3048, 码: 0.9144, 英里: 1609.344 } },
      mass: { name: "重量", base: "千克", map: { 克: 0.001, 千克: 1, 吨: 1000, 斤: 0.5, 两: 0.05, 磅: 0.45359237, 盎司: 0.0283495 } },
      area: { name: "面积", base: "平方米", map: { 平方厘米: 0.0001, 平方米: 1, 公顷: 10000, 平方千米: 1000000, 亩: 666.667, 平方英尺: 0.092903 } },
      temp: { name: "温度", base: "摄氏度", map: { 摄氏度: 1, 华氏度: 1, 开尔文: 1 } }
    };
    el.innerHTML =
      '<div class="hd"><h1>换算</h1><p>长度、重量、面积、温度与进制，输入即出结果。</p></div>' +
      '<div class="sec"><div class="row"><span class="seg" id="cvCat">' +
      '<button type="button" data-c="len" aria-pressed="true">长度</button>' +
      '<button type="button" data-c="mass" aria-pressed="false">重量</button>' +
      '<button type="button" data-c="area" aria-pressed="false">面积</button>' +
      '<button type="button" data-c="temp" aria-pressed="false">温度</button>' +
      '<button type="button" data-c="radix" aria-pressed="false">进制</button>' +
      "</span></div></div>" +
      '<div id="cvPanel"></div>';

    const q = function (s) { return el.querySelector(s); };
    let cat = "len";

    function render() {
      const box = q("#cvPanel");
      if (cat === "radix") {
        box.innerHTML =
          '<div class="sec"><div class="fields">' +
          '<div class="field w-xs"><label for="cvBase">输入进制</label><select class="i" id="cvBase">' +
          '<option value="2">二进制</option><option value="8">八进制</option><option value="10" selected>十进制</option><option value="16">十六进制</option></select></div>' +
          '<div class="field"><label for="cvVal">数值</label><input class="i num" id="cvVal" value="255" autocomplete="off"></div>' +
          "</div><div id=\"cvOut\" style=\"margin-top:16px\"></div></div>";
        const go = function () {
          const base = parseInt(q("#cvBase").value, 10);
          const raw = q("#cvVal").value.trim();
          const n = parseInt(raw, base);
          const out = q("#cvOut");
          if (raw === "" || isNaN(n)) {
            out.innerHTML = '<div class="result"><div class="result-empty">这个进制下没有读到有效数字。</div></div>';
            return;
          }
          out.innerHTML = '<div class="result"><div class="result-rows">' +
            [["二进制", n.toString(2)], ["八进制", n.toString(8)], ["十进制", String(n)], ["十六进制", n.toString(16).toUpperCase()]]
              .map(function (r) {
                return '<div class="result-row"><span>' + r[0] + "</span><b>" + esc(r[1]) + "</b></div>";
              }).join("") +
            "</div>" + LU.actions([LU.chip("复制十进制"), LU.chip("存为痕迹")]) + "</div>";
          const chips = out.querySelectorAll(".chip");
          if (chips[0]) chips[0].addEventListener("click", LU.copy(String(n)));
          if (chips[1]) chips[1].addEventListener("click", function () {
            LU.trace({ tool: "换算", label: "进制转换", value: String(n), unit: "十进制", detail: "来自 " + base + " 进制 " + raw });
            if (LU.toast) LU.toast("已存入痕迹");
          });
        };
        q("#cvBase").addEventListener("change", go);
        q("#cvVal").addEventListener("input", go);
        go();
        return;
      }

      const U = UNITS[cat];
      const names = Object.keys(U.map);
      box.innerHTML =
        '<div class="sec"><div class="fields">' +
        '<div class="field w-md"><label for="cvAmt">数值</label><input class="i num" id="cvAmt" type="number" value="1" step="any"></div>' +
        '<div class="field w-md"><label for="cvFrom">从</label><select class="i" id="cvFrom">' +
        names.map(function (n) { return "<option>" + n + "</option>"; }).join("") + "</select></div>" +
        '<div class="field w-md"><label for="cvTo">到</label><select class="i" id="cvTo">' +
        names.map(function (n) { return "<option>" + n + "</option>"; }).join("") + "</select></div>" +
        "</div>" +
        '<div class="row" style="margin-top:14px"><button class=\"btn\" id=\"cvSwap\" type=\"button\">交换</button></div></div>' +
        '<div id="cvOut"></div>';

      q("#cvTo").value = names[Math.min(1, names.length - 1)];

      const conv = function (v, from, to) {
        if (cat === "temp") {
          let c;
          if (from === "摄氏度") c = v;
          else if (from === "华氏度") c = (v - 32) * 5 / 9;
          else c = v - 273.15;
          if (to === "摄氏度") return c;
          if (to === "华氏度") return c * 9 / 5 + 32;
          return c + 273.15;
        }
        return (v * U.map[from]) / U.map[to];
      };

      const go = function () {
        const v = parseFloat(q("#cvAmt").value);
        const from = q("#cvFrom").value;
        const to = q("#cvTo").value;
        const out = q("#cvOut");
        if (!isFinite(v)) {
          out.innerHTML = '<div class="sec"><div class="result"><div class="result-empty">输入一个数字即可换算。</div></div></div>';
          return;
        }
        const r = conv(v, from, to);
        const shown = Math.abs(r) >= 1e9 || (Math.abs(r) < 1e-4 && r !== 0) ? r.toExponential(6) : String(+r.toFixed(6));
        out.innerHTML = '<div class="sec"><div class="result">' +
          '<div class="result-main"><span class="result-val num">' + esc(shown) + '</span><span class="result-unit">' + esc(to) + "</span></div>" +
          '<div class="result-rows">' + names.map(function (n) {
            if (n === from) return "";
            const x = conv(v, from, n);
            const sv = Math.abs(x) >= 1e9 || (Math.abs(x) < 1e-4 && x !== 0) ? x.toExponential(4) : String(+x.toFixed(6));
            return '<div class="result-row"><span>' + n + "</span><b>" + esc(sv) + "</b></div>";
          }).join("") + "</div>" +
          '<div class="result-note">1 ' + esc(from) + " = " + esc(String(+conv(1, from, to).toFixed(6))) + " " + esc(to) +
          LU.actions([LU.chip("复制结果"), LU.chip("存为痕迹")]) + "</div></div></div>";
        const chips = out.querySelectorAll(".chip");
        if (chips[0]) chips[0].addEventListener("click", LU.copy(shown));
        if (chips[1]) chips[1].addEventListener("click", function () {
          LU.trace({ tool: "换算", label: v + " " + from, value: shown, unit: to, detail: U.name });
          if (LU.toast) LU.toast("已存入痕迹");
        });
      };
      q("#cvAmt").addEventListener("input", go);
      q("#cvFrom").addEventListener("change", go);
      q("#cvTo").addEventListener("change", go);
      q("#cvSwap").addEventListener("click", function () {
        const a = q("#cvFrom").value;
        q("#cvFrom").value = q("#cvTo").value;
        q("#cvTo").value = a;
        go();
      });
      go();
    }

    q("#cvCat").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-c]");
      if (!b) return;
      cat = b.dataset.c;
      Array.prototype.forEach.call(q("#cvCat").querySelectorAll("button"), function (x) {
        x.setAttribute("aria-pressed", String(x === b));
      });
      render();
    });
    render();
  }

      box.innerHTML = '<div class="result">' +
        '<div class="result-main"><span class="result-val num">' + abs + '</span><span class="result-unit">天' + (days < 0 ? "（结束早于开始）" : "") + "</span></div>" +
        '<div class="result-rows">' +
        '<div class="result-row"><span>周</span><b>' + weeks + "</b></div>" +
        '<div class="result-row"><span>月（约）</span><b>' + months + "</b></div>" +
        '<div class="result-row"><span>年（约）</span><b>' + years + "</b></div>" +
        '<div class="result-row"><span>工作日（约）</span><b>' + Math.round((abs / 7) * 5) + "</b></div>" +
        "</div></div>";
    }
    function renderTarget() {
      const t = q("#dtT").value;
      const box = q("#dtTarget");
      if (!t) { box.innerHTML = '<p class="result-empty">选一个未来的日子，看还有多久。</p>'; return; }
      const d = LU.daysBetween(LU.today(), t);
      const name = q("#dtL").value.trim() || "目标日";
      const abs = Math.abs(d);
      const label = d > 0 ? "还有" : (d < 0 ? "已经过去" : "就是今天");
      box.innerHTML = '<div class="result">' +
        '<div class="result-main"><span class="result-val num">' + abs + '</span><span class="result-unit">天 · ' + esc(name) + " " + label + "</span></div>" +
        '<div class="result-rows"><div class="result-row"><span>目标日期</span><b>' + esc(t) + "</b></div>" +
        '<div class="result-row"><span>星期</span><b>星期' + "日一二三四五六".charAt(new Date(t + "T00:00:00").getDay()) + "</b></div></div>" +
        LU.actions([LU.chip("存为痕迹")]) + "</div>";
      const chip = box.querySelector(".chip");
      if (chip) chip.addEventListener("click", function () {
        LU.trace({ tool: "日期", label: name, value: abs + " 天", unit: d > 0 ? "后" : "前", detail: t });
        if (LU.toast) LU.toast("已存入痕迹");
      });
    }
    ["#dtA", "#dtB"].forEach(function (s) { q(s).addEventListener("change", renderDiff); });
    ["#dtT", "#dtL"].forEach(function (s) {
      q(s).addEventListener("change", renderTarget);
      q(s).addEventListener("input", renderTarget);
    });
    renderDiff();
    renderTarget();
  }

  function mountGoal(el) {
    el.innerHTML =
      '<div class="hd"><h1>目标</h1><p>给想存的钱设一个数字，看到进度每天都会想再推一点。</p></div>' +
      '<div class="sec"><div class="fields">' +
      '<div class="field"><label for="glN">目标名称</label><input class="i" id="glN" maxlength="24" placeholder="例如：旅行基金"></div>' +
      '<div class="field w-md"><label for="glT">目标金额（元）</label><input class="i" id="glT" type="number" min="1" step="100" placeholder="10000"></div>' +
      '<div class="field w-md"><label for="glD">截止日</label><input class="i" id="glD" type="date"></div>' +
      '</div><div class="row" style="margin-top:14px"><button class="btn" id="glAdd" type="button">添加目标</button></div></div>' +
      '<div id="glList"></div>';

    const q = function (s) { return el.querySelector(s); };
    const store = function () { return LU.load("goal", []); };
    const write = function (v) { LU.save("goal", v); };

    function render() {
      const rows = store();
      const box = q("#glList");
      if (!rows.length) {
        box.innerHTML = '<div class="sec"><div class="empty"><b>还没有目标</b>设定一个金额和日期，进度条会替你记住节奏。</div></div>';
        return;
      }
      box.innerHTML = rows.map(function (g) {
        const pct = Math.min(100, (g.saved / g.target) * 100);
        const rest = Math.max(0, g.target - g.saved);
        let timeNote = "";
        if (g.due) {
          const d = LU.daysBetween(LU.today(), g.due);
          if (d < 0) timeNote = "已过期 " + Math.abs(d) + " 天";
          else if (d === 0) timeNote = "今天到期";
          else {
            const months = Math.max(1, Math.ceil(d / 30.4375));
            timeNote = "还有 " + d + " 天 · 每月需存 " + LU.money(rest / months);
          }
        }
        return '<div class="sec" data-id="' + g.id + '"><div class="sec-hd">' +
          '<h2>' + esc(g.name) + '</h2><span class="spacer"></span><span class="hint">' + esc(timeNote) + "</span></div>" +
          '<div class="result">' +
          '<div class="result-main"><span class="result-val num">' + pct.toFixed(1) + '</span><span class="result-unit">% 已完成</span></div>' +
          '<div class="bar-track" style="height:10px;margin:12px 0 10px;border-radius:5px"><div class="bar-fill" style="width:' + pct + "%;border-radius:5px\"></div></div>" +
          '<div class="result-rows">' +
          '<div class="result-row"><span>已存</span><b>' + LU.money(g.saved) + " 元</b></div>" +
          '<div class="result-row"><span>目标</span><b>' + LU.money(g.target) + " 元</b></div>" +
          '<div class="result-row"><span>还差</span><b>' + LU.money(rest) + " 元</b></div></div>" +
          '<div class="row" style="margin-top:12px">' +
          '<input class="i" type="number" step="0.01" placeholder="存入金额" data-in="' + g.id + '" style="flex:1 1 110px;min-height:34px;font-size:13px">' +
          '<button class="btn sm" type="button" data-add="' + g.id + '">存入</button>' +
          '<button class="btn quiet" type="button" data-del="' + g.id + '">删除</button>' +
          "</div></div></div>";
      }).join("");

      Array.prototype.forEach.call(box.querySelectorAll("[data-add]"), function (b) {
        b.addEventListener("click", function () {
          const id = b.dataset.add;
          const inp = box.querySelector('[data-in="' + id + '"]');
          const v = parseFloat(inp.value);
          if (!isFinite(v) || v === 0) { if (LU.toast) LU.toast("输入要存入的金额"); inp.focus(); return; }
          const list = store();
          list.forEach(function (g) { if (g.id === id) g.saved = Math.max(0, g.saved + v); });
          write(list);
          render();
          if (LU.toast) LU.toast("已更新进度");
        });
      });
      Array.prototype.forEach.call(box.querySelectorAll("[data-del]"), function (b) {
        b.addEventListener("click", function () {
          if (!window.confirm("删除这个目标？")) return;
          write(store().filter(function (g) { return g.id !== b.dataset.del; }));
          render();
        });
      });
    }
    q("#glAdd").addEventListener("click", function () {
      const n = q("#glN").value.trim();
      const t = parseFloat(q("#glT").value);
      if (!n) { if (LU.toast) LU.toast("给目标起个名字"); q("#glN").focus(); return; }
      if (!isFinite(t) || t <= 0) { if (LU.toast) LU.toast("目标金额要大于 0"); q("#glT").focus(); return; }
      const rows = store();
      rows.push({ id: LU.uid(), ts: Date.now(), name: n, target: t, saved: 0, due: q("#glD").value || "" });
      write(rows);
      q("#glN").value = "";
      q("#glT").value = "";
      q("#glD").value = "";
      render();
    });
    LU.goalStats = function () {
      const rows = store();
      return {
        count: rows.length,
        pct: rows.length ? rows.reduce(function (s, g) { return s + Math.min(100, (g.saved / g.target) * 100); }, 0) / rows.length : 0
      };
    };
    render();
  }

      '<div class="sec"><div class="sec-hd"><h2>备份</h2></div>' +
