      "</div></div></div>" +
      '<div class="sec"><div class="sec-hd"><h2>清空</h2></div>' +
      '<div class="result"><div class="result-note" style="margin-top:0;padding-top:0;border:none">清空会删除本设备上所有乐乌数据，且无法恢复。建议先导出备份。</div>' +
      '<div class="row" style="margin-top:12px"><button class="btn danger" id="dtWipe" type="button">清空全部数据</button></div></div></div>';

    const q = function (s) { return el.querySelector(s); };
    function render() {
      const L = function (k) { return LU.load(k, []); };
      const ledger = L("ledger"), todo = L("todo"), habit = L("habit"), focus = L("focus"), goal = L("goal");
      const bytes = LU.allKeys().reduce(function (s, k) {
        try { return s + (localStorage.getItem(k) || "").length; } catch (e) { return s; }
      }, 0);
      q("#dtSize").textContent = bytes ? (bytes / 1024).toFixed(1) + " KB" : "";
      q("#dtKpi").innerHTML =
        '<div class="kpi"><div class="k">记账</div><div class="v num">' + ledger.length + '<small>笔</small></div></div>' +
        '<div class="kpi"><div class="k">待办</div><div class="v num">' + todo.length + '<small>项</small></div></div>' +
        '<div class="kpi"><div class="k">习惯</div><div class="v num">' + habit.length + '<small>个</small></div></div>' +
        '<div class="kpi"><div class="k">专注</div><div class="v num">' + focus.length + '<small>段</small></div></div>' +
        '<div class="kpi"><div class="k">目标</div><div class="v num">' + goal.length + '<small>个</small></div></div>';
    }
    q("#dtExport").addEventListener("click", function () {
      const payload = { app: "lewu", version: 3, exportedAt: new Date().toISOString(), data: {} };
      LU.allKeys().forEach(function (k) {
        try { payload.data[k] = localStorage.getItem(k); } catch (e) {}
      });
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "lewu-backup-" + LU.today() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      if (LU.toast) LU.toast("备份已导出");
    });
    q("#dtImport").addEventListener("click", function () { q("#dtFile").click(); });
    q("#dtFile").addEventListener("change", function (e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function () {
        try {
          const parsed = JSON.parse(String(reader.result));
          const data = parsed && parsed.data ? parsed.data : parsed;
          if (!data || typeof data !== "object") throw new Error("bad");
          let n = 0;
          Object.keys(data).forEach(function (k) {
            if (k.indexOf("lewu.v3.") !== 0) return;
            const v = data[k];
            try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); n++; } catch (err) {}
          });
          if (!n) { if (LU.toast) LU.toast("没有找到可导入的乐乌数据"); return; }
          if (LU.toast) LU.toast("已导入 " + n + " 项，页面即将刷新");
          setTimeout(function () { location.reload(); }, 900);
        } catch (err) {
          if (LU.toast) LU.toast("这个文件不是有效的乐乌备份");
        }
      };
      reader.readAsText(f);
      e.target.value = "";
    });
    q("#dtWipe").addEventListener("click", function () {
      if (!window.confirm("确定清空全部数据？这一步无法撤销。")) return;
      if (!window.confirm("再确认一次：所有记账、待办、习惯记录都将被删除。")) return;
      LU.allKeys().forEach(function (k) {
        try { localStorage.removeItem(k); } catch (e) {}
      });
      if (LU.toast) LU.toast("已清空，页面即将刷新");
      setTimeout(function () { location.reload(); }, 700);
    });
    render();
  }

  /* ============================================================
     13. 密码
     ============================================================ */
  function mountPassword(el) {
    el.innerHTML =
      '<div class="hd"><h1>密码</h1><p>在本机生成随机密码，不联网、不上传，复制后别忘记存进密码管理器。</p></div>' +
      '<div class="sec"><div class="sec-hd"><h2>生成设置</h2></div>' +
      '<div class="fields">' +
      '<div class="field w-sm"><label for="pwLen">长度</label><input class="i" id="pwLen" type="number" min="4" max="64" value="16"></div>' +
      '<div class="field"><label>包含字符</label><div class="row" id="pwSets">' +
      '<button class="chip" type="button" data-set="lower" aria-pressed="true">小写字母</button>' +
      '<button class="chip" type="button" data-set="upper" aria-pressed="true">大写字母</button>' +
      '<button class="chip" type="button" data-set="num" aria-pressed="true">数字</button>' +
      '<button class="chip" type="button" data-set="sym" aria-pressed="false">符号</button>' +
      '</div></div></div>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="pwGo" type="button">生成密码</button>' +
      '<button class="btn ghost" id="pwCopy" type="button">复制</button>' +
      '<button class="btn ghost" id="pwTrace" type="button">存为痕迹</button></div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>结果</h2><span class="spacer"></span><span class="hint" id="pwLv"></span></div>' +
      '<textarea class="i" id="pwVal" readonly style="min-height:74px;font-family:var(--font-num);font-size:17px;letter-spacing:.02em"></textarea>' +
      '<div class="result-note" id="pwNote">默认 16 位、大小写和数字混合；需要更强就勾上符号、把长度拉到 20 以上。</div></div>';

    const q = function (s) { return el.querySelector(s); };
    const sets = { lower: "abcdefghijklmnopqrstuvwxyz", upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ", num: "0123456789", sym: "!@#$%^&*()-_=+[]{};:,.?/" };
    const chosen = { lower: true, upper: true, num: true, sym: false };
    let current = "";

    function randomInt(n) {
      if (window.crypto && window.crypto.getRandomValues) {
        return window.crypto.getRandomValues(new Uint32Array(1))[0] % n;
      }
      return Math.floor(Math.random() * n);
    }
    function shuffle(s) {
      const a = Array.from(s);
      for (let i = a.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a.join("");
    }
    function level(p) {
      let score = 0;
      if (p.length >= 12) score++;
      if (p.length >= 18) score++;
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++;
      if (/[0-9]/.test(p)) score++;
      if (/[^A-Za-z0-9]/.test(p)) score++;
      return score >= 4 ? "很强" : score >= 3 ? "较强" : "一般";
    }
    function generate() {
      const len = Math.max(4, Math.min(64, Number(q("#pwLen").value) || 16));
      const active = Object.keys(chosen).filter(function (k) { return chosen[k]; });
      if (!active.length) { if (LU.toast) LU.toast("至少选一种字符"); return; }
      const pool = active.map(function (k) { return sets[k]; }).join("");
      let out = active.map(function (k) { return sets[k][randomInt(sets[k].length)]; }).join("");
      while (out.length < len) out += pool[randomInt(pool.length)];
      current = shuffle(out).slice(0, len);
      q("#pwVal").value = current;
      q("#pwLv").textContent = level(current) + " · " + len + " 位";
    }

    q("#pwSets").addEventListener("click", function (e) {
      const b = e.target.closest("button[data-set]");
      if (!b) return;
      const k = b.getAttribute("data-set");
      chosen[k] = !chosen[k];
      b.setAttribute("aria-pressed", String(chosen[k]));
    });
    q("#pwGo").addEventListener("click", generate);
    q("#pwCopy").addEventListener("click", function () {
      if (!current) generate();
      LU.copy(current)();
    });
    q("#pwTrace").addEventListener("click", function () {
      if (!current) generate();
      LU.trace({ tool: "密码", label: current.length + " 位密码", value: "已生成", detail: "未保存明文" });
      if (LU.toast) LU.toast("已存入痕迹（不保存密码本身）");
    });
    generate();
  }

  /* ============================================================
     14. 随机
     ============================================================ */
  function mountRandom(el) {
    el.innerHTML =
      '<div class="hd"><h1>随机</h1><p>选择困难的时候，把选项一行一个丢进来，让它替你做决定。</p></div>' +
      '<div class="sec"><div class="sec-hd"><h2>选项</h2><span class="spacer"></span><span class="hint" id="rdCount"></span></div>' +
      '<div class="field"><textarea class="i" id="rdIn" style="min-height:130px" placeholder="一行一个，例如：\n火锅\n烧烤\n面条\n沙拉"></textarea></div>' +
      '<div class="fields" style="margin-top:12px">' +
      '<div class="field w-sm"><label for="rdN">抽几个</label><input class="i" id="rdN" type="number" min="1" max="20" value="1"></div>' +
      '<div class="field"><label>常用清单</label><div class="row">' +
      '<button class="chip" type="button" data-fill="午饭">午饭</button>' +
      '<button class="chip" type="button" data-fill="今晚">今晚</button>' +
      '<button class="chip" type="button" data-fill="周末">周末</button></div></div></div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>结果</h2></div><div id="rdOut" class="result"><div class="result-empty">写上选项，点下面的按钮。</div></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn" id="rdGo" type="button">抽一个</button>' +
      '<button class="btn ghost" id="rdAll" type="button">全部打乱</button></div></div>';

    const q = function (s) { return el.querySelector(s); };
    const presets = {
      "午饭": ["米饭套餐", "面条", "饺子", "沙拉", "火锅", "汉堡"],
      "今晚": ["看电影", "打游戏", "散步", "读会儿书", "早点睡", "收拾房间"],
      "周末": ["爬山", "逛展", "宅家", "约朋友", "学点新东西", "睡到自然醒"]
    };
    function lines() {
      return q("#rdIn").value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    }
    function updateCount() { q("#rdCount").textContent = lines().length + " 个选项"; }
    function pick(n) {
      const all = lines();
      if (!all.length) { q("#rdOut").innerHTML = '<div class="result-empty">先写几个选项吧。</div>'; return; }
      const k = Math.max(1, Math.min(all.length, n));
      const shuffled = all.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
      }
      const out = shuffled.slice(0, k);
      q("#rdOut").innerHTML = '<div class="result-main"><span class="result-val">' + esc(out.join(" / ")) + "</span></div>" +
        '<div class="result-note">从 ' + all.length + " 个选项里抽了 " + k + " 个。" +
        LU.actions([LU.chip("再抽一次"), LU.chip("存为痕迹")]) + "</div>";
      const chips = q("#rdOut").querySelectorAll(".chip");
      if (chips[0]) chips[0].addEventListener("click", function () { pick(k); });
      if (chips[1]) chips[1].addEventListener("click", function () {
        LU.trace({ tool: "随机", label: out.join(" / "), value: "已抽取", detail: "共 " + all.length + " 个选项" });
        if (LU.toast) LU.toast("已存入痕迹");
      });
    }
    q("#rdIn").addEventListener("input", updateCount);
    q("#rdGo").addEventListener("click", function () { pick(Number(q("#rdN").value) || 1); });
    q("#rdAll").addEventListener("click", function () { pick(lines().length || 1); });
    el.querySelectorAll("[data-fill]").forEach(function (b) {
      b.addEventListener("click", function () {
        const list = presets[b.getAttribute("data-fill")] || [];
        q("#rdIn").value = list.join("\n");
        updateCount();
      });
    });
    updateCount();
  }

  /* ============================================================
     工具清单
     ============================================================ */
  LU.TOOLS = [
    { id: "ledger", name: "记账", group: "记录", desc: "收支分类与月度汇总", icon: "wallet", mount: mountLedger },
    { id: "todo", name: "待办", group: "记录", desc: "带优先级和截止日", icon: "check", mount: mountTodo },
    { id: "habit", name: "习惯", group: "记录", desc: "7 天打卡与连续天数", icon: "flame", mount: mountHabit },
    { id: "goal", name: "目标", group: "记录", desc: "储蓄进度与每月需存", icon: "target", mount: mountGoal },
    { id: "focus", name: "专注", group: "时间", desc: "番茄钟与专注流水", icon: "clock", mount: mountFocus },
    { id: "date", name: "日期", group: "时间", desc: "间隔天数与倒数", icon: "calendar", mount: mountDate },
    { id: "calc", name: "计算器", group: "计算", desc: "表达式与计算历史", icon: "calc", mount: mountCalc },
    { id: "loan", name: "贷款", group: "计算", desc: "月供对比与还款表", icon: "home2", mount: mountLoan },
    { id: "tax", name: "个税", group: "计算", desc: "税后到手与税率档", icon: "receipt", mount: mountTax },
    { id: "convert", name: "换算", group: "计算", desc: "长度重量温度进制", icon: "scale", mount: mountConvert },
    { id: "text", name: "文本", group: "工具", desc: "统计转换去重替换", icon: "text", mount: mountText },
    { id: "password", name: "密码", group: "工具", desc: "本机生成随机密码", icon: "key", mount: mountPassword },
    { id: "random", name: "随机", group: "工具", desc: "从清单里抽一个决定", icon: "shuffle", mount: mountRandom },
    { id: "data", name: "数据", group: "工具", desc: "备份导出与清空", icon: "db", mount: mountData }
  ];
  LU.GROUPS = ["记录", "时间", "计算", "工具"];

  /* ============================================================
     全局统计与跨工具写入
     供概览页、今日面板、痕迹面板使用——不依赖对应工具是否被打开过
     ============================================================ */
  LU.addLedgerEntry = function (entry) {
    const rows = LU.load("ledger", []);
    rows.push({
      id: LU.uid(), ts: Date.now(),
      note: entry.note || "", amt: entry.amt, type: entry.type || "支出",
      cat: entry.cat || "其他", date: entry.date || LU.today()
    });
    LU.save("ledger", rows);
    if (LU._ledgerRender) {
      try { LU._ledgerRender(); } catch (e) {}
    }
  };

  LU.todoStats = function () {
    const rows = LU.load("todo", []);
    const t = LU.today();
    return {
      open: rows.filter(function (x) { return !x.done; }).length,
      todayDone: rows.filter(function (x) {
        return x.done && x.doneAt && LU.fmtDate(new Date(x.doneAt)) === t;
      }).length
    };
  };

  LU.habitStats = function () {
    const rows = LU.load("habit", []);
    const t = LU.today();
    return {
      total: rows.length,
      today: rows.filter(function (h) { return (h.log || {})[t]; }).length
    };
  };

  LU.focusStats = function () {
    const t = LU.today();
    return LU.load("focus", [])
      .filter(function (f) { return f.date === t; })
      .reduce(function (s, f) { return s + (Number(f.min) || 0); }, 0);
  };

  LU.goalStats = function () {
    const rows = LU.load("goal", []);
    return {
      count: rows.length,
      pct: rows.length
        ? rows.reduce(function (s, g) {
            const t = Number(g.target) || 0;
            return s + (t > 0 ? Math.min(100, (Number(g.saved) || 0) / t * 100) : 0);
          }, 0) / rows.length
        : 0
    };
  };
})();

</script>
<script>
"use strict";
/* ============================================================
   乐乌 · 应用层：路由 / 导航 / 命令面板 / 今日面板
   ============================================================ */
(function () {
  const LU = window.LU;
  const esc = LU.esc;
  const TOOLS = LU.TOOLS;

  const el = {
    nav: document.getElementById("nav"),
    view: document.getElementById("view"),
    workTitle: document.getElementById("workTitle"),
    workSub: document.getElementById("workSub"),
    tabbar: document.getElementById("tabbar"),
    side: document.getElementById("side"),
    sideDate: document.getElementById("sideDate"),
    todayKpis: document.getElementById("todayKpis"),
    trace: document.getElementById("trace"),
    palette: document.getElementById("palette"),
    cmdInput: document.getElementById("cmdInput"),
    cmdList: document.getElementById("cmdList"),
    toast: document.getElementById("toast"),
    rail: document.getElementById("rail"),
    scrim: document.getElementById("scrim")
  };

  /* ---------- 提示 ---------- */
  let toastTimer = null;
  LU.toast = function (msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("show"); }, 1900);
  };

  /* ---------- 主题 ---------- */
  function applyTheme(dark) {
    document.body.classList.toggle("dark", !!dark);
    const lab = document.getElementById("themeLabel");
    if (lab) lab.textContent = dark ? "亮色" : "暗色";
  }
  let dark = LU.load("theme", null);
  if (dark === null) {
    try {
      dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    } catch (e) { dark = false; }
  }
  applyTheme(dark);
  document.getElementById("themeBtn").addEventListener("click", function () {
    dark = !document.body.classList.contains("dark");
    applyTheme(dark);
    LU.save("theme", dark);
  });

  /* ---------- 导航 ---------- */
  const NAV_ICON = { "记录": "receipt", "时间": "clock", "计算": "calc", "工具": "text" };
  function buildNav() {
    let html = "";
    LU.GROUPS.forEach(function (g) {
      const items = TOOLS.filter(function (t) { return t.group === g; });
      if (!items.length) return;
      html += '<div class="nav-group"><div class="nav-group-title">' + esc(g) + "</div>";
      items.forEach(function (t) {
        html += '<button class="nav-item" type="button" data-go="' + t.id + '">' +
          '<span class="ico">' + LU.icon(t.icon, 16) + "</span><span>" + esc(t.name) + "</span>" +
          "</button>";
      });
      html += "</div>";
    });
    el.nav.innerHTML = html;
  }

  const TABS = ["ledger", "todo", "habit", "focus", "calc"];
  function buildTabs() {
    el.tabbar.innerHTML = TABS.map(function (id) {
      const t = TOOLS.filter(function (x) { return x.id === id; })[0];
      if (!t) return "";
      return '<button class="tab" type="button" data-go="' + t.id + '">' +
        LU.icon(t.icon, 19) + "<span>" + esc(t.name) + "</span></button>";
    }).join("") + '<button class="tab" type="button" data-go="home">' +
      LU.icon("home", 19) + "<span>全部</span></button>";
  }

  /* ---------- 今日面板 ---------- */
  function renderToday() {
    const d = new Date();
    const dow = "日一二三四五六".charAt(d.getDay());
    el.sideDate.textContent = d.getMonth() + 1 + "月" + d.getDate() + "日 周" + dow;

    const h = LU.habitStats ? LU.habitStats() : { total: 0, today: 0 };
    const t = LU.todoStats ? LU.todoStats() : { open: 0, todayDone: 0 };
    const f = LU.focusStats ? LU.focusStats() : 0;
    const g = LU.goalStats ? LU.goalStats() : { count: 0, pct: 0 };

    el.todayKpis.innerHTML =
      '<div class="today-kpi"><div class="k">待办未完成</div><div class="v">' + t.open + "</div></div>" +
      '<div class="today-kpi"><div class="k">今日完成</div><div class="v">' + t.todayDone + "</div></div>" +
      '<div class="today-kpi"><div class="k">习惯打卡</div><div class="v">' + h.today + "/" + h.total + "</div></div>" +
      '<div class="today-kpi"><div class="k">专注分钟</div><div class="v">' + f + "</div></div>" +
      '<div class="today-kpi" style="grid-column:span 2"><div class="k">目标平均进度</div><div class="v">' +
      (g.count ? g.pct.toFixed(0) + "%" : "未设定") + "</div></div>";
  }

  function renderTrace() {
    const list = LU.getTrace();
    if (!list.length) {
      el.trace.innerHTML = '<p class="result-empty" style="font-size:12px">算完、记完的东西可以存到这里，之后一键回填或记进账本。</p>';
      return;
    }
    el.trace.innerHTML = list.slice(0, 14).map(function (it, i) {
      const d = new Date(it.ts);
      const time = pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      return '<div class="trace-item' + (i === 0 ? " hot" : "") + '">' +
        '<div class="trace-t">' + esc(it.label || it.tool) + "</div>" +
        '<div class="trace-m"><span class="num">' + esc(it.value) + "</span>" +
        (it.unit ? "<span>" + esc(it.unit) + "</span>" : "") +
        "<span>" + esc(it.tool) + "</span><span>" + time + "</span></div>" +
        (it.value ? '<div class="trace-acts"><button class="chip" type="button" data-copy="' + it.id + '">复制</button>' +
          '<button class="chip" type="button" data-ledger="' + it.id + '">记成支出</button></div>' : "") +
        "</div>";
    }).join("");

    Array.prototype.forEach.call(el.trace.querySelectorAll("[data-copy]"), function (b) {
      b.addEventListener("click", function () {
        const it = LU.getTrace().filter(function (x) { return x.id === b.dataset.copy; })[0];
        if (it) LU.copy(it.value)();
      });
    });
    Array.prototype.forEach.call(el.trace.querySelectorAll("[data-ledger]"), function (b) {
      b.addEventListener("click", function () {
        const it = LU.getTrace().filter(function (x) { return x.id === b.dataset.ledger; })[0];
        if (!it) return;
        const amt = parseFloat(String(it.value).replace(/,/g, ""));
        if (!isFinite(amt) || amt <= 0) { LU.toast("这个数不能记成支出"); return; }
        if (LU.addLedgerEntry) {
          LU.addLedgerEntry({ note: it.label || it.tool, amt: amt, type: "支出", cat: "其他" });
          LU.toast("已记入记账本");
        } else {
          LU.toast("打开记账页后再试");
        }
      });
    });
  }
  LU.onTraceChange = function () {
    if (document.getElementById("trace")) renderTrace();
  };
  function pad2(n) { return String(n).padStart(2, "0"); }

  document.getElementById("clearTrace").addEventListener("click", function () {
    if (!LU.getTrace().length) { LU.toast("痕迹已经是空的"); return; }
    LU.clearTrace();
  });

  /* ---------- 概览页 ---------- */
  function mountHome() {
    const d = new Date();
    const hour = d.getHours();
    const greet = hour < 6 ? "夜深了" : hour < 11 ? "早上好" : hour < 14 ? "中午好" : hour < 18 ? "下午好" : hour < 23 ? "晚上好" : "夜深了";
    const t = LU.todoStats ? LU.todoStats() : { open: 0, todayDone: 0 };
    const f = LU.focusStats ? LU.focusStats() : 0;

    let html = '<div class="page page-wide"><div class="hero">' +
      "<h1>" + greet + "。今天还有 <em>" + t.open + "</em> 件事在等着。</h1>" +
      "<p>" + TOOLS.length + " 个工具，数据只存在这台设备上。按 Ctrl K 可以直接跳到任何工具。</p>" +
      "</div>";

    // 快捷开始：先给四个最常用的入口，进来不会只剩一块空白
    const quick = [
      { id: "ledger", name: "记一笔", desc: "今天花了多少", icon: "wallet" },
      { id: "todo", name: "加待办", desc: "别让事情溜走", icon: "check" },
      { id: "focus", name: "开始专注", desc: "25 分钟番茄钟", icon: "clock" },
      { id: "password", name: "生成密码", desc: "随机、只在本地", icon: "key" }
    ];
    html += '<div class="sec"><div class="sec-hd"><h2>快捷开始</h2><span class="spacer"></span>' +
      '<span class="hint">点一下就进去</span></div><div class="tiles">' +
      quick.map(function (x) {
        return '<button class="tile" type="button" data-go="' + x.id + '">' +
          '<span class="ico-w">' + LU.icon(x.icon, 19) + "</span>" +
          "<b>" + esc(x.name) + "</b><span>" + esc(x.desc) + "</span></button>";
      }).join("") + "</div></div>";

    // 今日速览
    html += '<div class="sec"><div class="sec-hd"><h2>今天</h2><span class="spacer"></span>' +
      '<span class="hint">专注 ' + f + " 分钟 · 已完成 " + t.todayDone + " 件</span></div>" +
      '<div class="kpis" id="homeKpi"></div></div>';

    // 最近痕迹：没数据时也给一句引导，不留大白块
    const recent = LU.getTrace().slice(0, 3);
    html += '<div class="sec"><div class="sec-hd"><h2>最近痕迹</h2><span class="spacer"></span>' +
      '<span class="hint">' + (recent.length ? "最近 " + recent.length + " 条" : "还没有记录") + "</span></div>" +
      (recent.length
        ? '<div class="trace">' + recent.map(function (it, i) {
            return '<div class="trace-item' + (i === 0 ? " hot" : "") + '"><div class="trace-t">' + esc(it.label || it.tool) + "</div>" +
              '<div class="trace-m"><span class="num">' + esc(it.value || "") + "</span><span>" + esc(it.tool || "") + "</span>" +
              '<span>' + esc(LU.ago(it.ts)) + "</span></div></div>";
          }).join("") + "</div>"
        : '<div class="empty"><b>这里会出现你最近的操作</b>记一笔、完成待办或专注一段，都会自动留在这里。</div>') +
      "</div>";

    // 工具网格
    LU.GROUPS.forEach(function (g) {
      const items = TOOLS.filter(function (x) { return x.group === g; });
      html += '<div class="sec"><div class="sec-hd"><h2>' + esc(g) + "</h2><span class=\"spacer\"></span><span class=\"hint\">" +
        items.length + " 个</span></div><div class=\"tiles\">" +
        items.map(function (x) {
          return '<button class="tile" type="button" data-go="' + x.id + '">' +
            '<span class="ico-w">' + LU.icon(x.icon, 19) + "</span>" +
            "<b>" + esc(x.name) + "</b><span>" + esc(x.desc) + "</span>" +
            "</button>";
        }).join("") + "</div></div>";
    });

    html += "</div>";
    el.view.innerHTML = html;

    // 今日 KPI（复用首页指标）
    const L = function (k) { return LU.load(k, []); };
    const mk = LU.thisMonth();
    const ledger = L("ledger");
    const exp = ledger.filter(function (r) { return LU.monthKey(r.date) === mk && r.type !== "收入"; })
      .reduce(function (s, r) { return s + Math.abs(Number(r.amt || 0)); }, 0);
    const hb = LU.habitStats ? LU.habitStats() : { total: 0, today: 0 };
    const gp = LU.goalStats ? LU.goalStats() : { count: 0, pct: 0 };

    const box = document.getElementById("homeKpi");
    if (box) {
      box.innerHTML =
        '<div class="kpi"><div class="k">本月支出</div><div class="v num">' + LU.money(exp) + '<small>元</small></div><div class="d">' + mk.replace("-", " 年 ") + " 月</div></div>" +
        '<div class="kpi"><div class="k">习惯</div><div class="v num">' + hb.today + "/" + hb.total + '<small>今日</small></div><div class="d">连续打卡会累积</div></div>' +
        '<div class="kpi"><div class="k">专注</div><div class="v num">' + f + '<small>分钟</small></div><div class="d">今天累计</div></div>' +
        '<div class="kpi"><div class="k">目标</div><div class="v num">' + (gp.count ? gp.pct.toFixed(0) + "%" : "—") + '<small>平均</small></div><div class="d">' + gp.count + " 个在进行</div></div>";
    }
  }

  /* ---------- 路由 ---------- */
  let current = "";
  function go(id, push) {
    if (LU._cleanup) { LU._cleanup(); LU._cleanup = null; }
    current = id;
    if (push !== false) {
      try { location.hash = id === "home" ? "" : "#" + id; } catch (e) {}
    }
    if (id === "home" || !id) {
      el.workTitle.textContent = "概览";
      el.workSub.textContent = "";
      mountHome();
    } else {
      const t = TOOLS.filter(function (x) { return x.id === id; })[0];
      if (!t) { mountHome(); return; }
      el.workTitle.textContent = t.name;
      el.workSub.textContent = t.desc;
      el.view.innerHTML = "";
      const wrap = document.createElement("div");
      wrap.className = "page";
      el.view.appendChild(wrap);
      try {
        t.mount(wrap);
      } catch (err) {
        wrap.innerHTML = '<div class="empty"><b>这个工具没能打开</b>刷新页面后再试一次。</div>';
      }
      el.view.scrollTop = 0;
    }
    Array.prototype.forEach.call(document.querySelectorAll("[data-go]"), function (b) {
      if (b.getAttribute("data-go") === id) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    renderToday();
    if (push !== false) closeRail();
  }

  document.addEventListener("click", function (e) {
    const b = e.target.closest("[data-go]");
    if (b) {
      e.preventDefault();
      go(b.getAttribute("data-go"));
    }
  });

  window.addEventListener("hashchange", function () {
    const id = (location.hash || "").replace("#", "") || "home";
    if (id !== current) go(id, false);
  });

  /* ---------- 移动端抽屉 ---------- */
  function openRail() { el.rail.classList.add("open"); el.scrim.classList.add("open"); }
  function closeRail() { el.rail.classList.remove("open"); el.scrim.classList.remove("open"); }
  document.getElementById("menuBtn").addEventListener("click", function () {
    if (el.rail.classList.contains("open")) closeRail();
    else openRail();
  });
  el.scrim.addEventListener("click", closeRail);

  /* ---------- 命令面板 ---------- */
  let cmdIndex = 0;
  let cmdItems = [];
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const kbdEl = document.getElementById("cmdKbd");
  if (kbdEl) kbdEl.textContent = isMac ? "⌘ K" : "Ctrl K";

  function cmdCandidates(q) {
    const query = q.trim().toLowerCase();
    const out = [];
    if (!query) {
      TOOLS.forEach(function (t) {
        out.push({ kind: "tool", id: t.id, title: t.name, desc: t.group + " · " + t.desc, icon: t.icon });
      });
      return out;
    }
    TOOLS.forEach(function (t) {
      const hay = (t.name + " " + t.desc + " " + t.group).toLowerCase();
      if (hay.indexOf(query) >= 0) {
        out.push({ kind: "tool", id: t.id, title: t.name, desc: t.group + " · " + t.desc, icon: t.icon });
      }
    });
    // 表达式
    if (/^[\d+\-*/().%\s×÷−]+$/.test(query) && /\d/.test(query)) {
      try {
        const v = Function('"use strict";return (' + query.replace(/×/g, "*").replace(/÷/g, "/") + ")")();
        if (typeof v === "number" && isFinite(v)) {
          out.unshift({ kind: "calc", title: String(+v.toFixed(10)), desc: "计算 " + q, icon: "calc", expr: q });
        }
      } catch (e) {}
    }
    // 痕迹
    LU.getTrace().forEach(function (it) {
      if ((it.label + " " + it.value).toLowerCase().indexOf(query) >= 0) {
        out.push({ kind: "trace", title: it.label || it.tool, desc: it.tool + " · " + it.value + (it.unit || ""), icon: "pin", value: it.value });
      }
    });
    return out;
  }

  function renderCmd() {
    const q = el.cmdInput.value;
    cmdItems = cmdCandidates(q).slice(0, 9);
    if (cmdIndex >= cmdItems.length) cmdIndex = 0;
    if (!cmdItems.length) {
      el.cmdList.innerHTML = '<div class="palette-item"><span class="t" style="color:var(--ink-3)">没有匹配的结果</span></div>';
      return;
    }
    el.cmdList.innerHTML = cmdItems.map(function (it, i) {
      return '<button class="palette-item' + (i === cmdIndex ? " sel" : "") + '" type="button" data-i="' + i + '">' +
        '<span class="ico">' + LU.icon(it.icon, 16) + "</span>" +
        '<span class="t">' + esc(it.title) + "</span>" +
        '<span class="d">' + esc(it.desc) + "</span></button>";
    }).join("");
  }

  function openCmd() {
    el.palette.classList.add("open");
    el.cmdInput.value = "";
    cmdIndex = 0;
    renderCmd();
    setTimeout(function () { el.cmdInput.focus(); }, 30);
  }
  function closeCmd() { el.palette.classList.remove("open"); }

  function runCmd(it) {
    if (!it) return;
    if (it.kind === "tool") { closeCmd(); go(it.id); return; }
    if (it.kind === "calc") {
      LU.trace({ tool: "计算器", label: it.expr, value: it.title });
      LU.toast("结果 " + it.title + " 已存入痕迹");
      closeCmd();
      return;
    }
    if (it.kind === "trace") {
      LU.copy(it.value)();
      closeCmd();
    }
  }

  document.getElementById("cmdOpen").addEventListener("click", openCmd);
  document.getElementById("quickBtn").addEventListener("click", openCmd);
  el.cmdInput.addEventListener("input", function () { cmdIndex = 0; renderCmd(); });
  el.cmdInput.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); cmdIndex = Math.min(cmdItems.length - 1, cmdIndex + 1); renderCmd(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdIndex = Math.max(0, cmdIndex - 1); renderCmd(); }
    else if (e.key === "Enter") { e.preventDefault(); runCmd(cmdItems[cmdIndex]); }
    else if (e.key === "Escape") { closeCmd(); }
  });
  el.cmdList.addEventListener("click", function (e) {
    const b = e.target.closest("[data-i]");
    if (!b) return;
    runCmd(cmdItems[parseInt(b.dataset.i, 10)]);
  });
  el.palette.addEventListener("click", function (e) {
    if (e.target === el.palette) closeCmd();
  });
  document.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if ((e.metaKey || e.ctrlKey) && k === "k") {
      e.preventDefault();
      if (el.palette.classList.contains("open")) closeCmd();
      else openCmd();
    }
    if (e.key === "Escape" && el.palette.classList.contains("open")) closeCmd();
    if ((e.metaKey || e.ctrlKey) && k === "/") {
      e.preventDefault();
      openCmd();
    }
  });

  /* ---------- 启动 ---------- */
  buildNav();
  buildTabs();
  renderTrace();
  renderToday();

  const startId = (location.hash || "").replace("#", "") || "home";
  const valid = startId === "home" || TOOLS.some(function (t) { return t.id === startId; });
  go(valid ? startId : "home", false);
})();

</script>
</body>
</html>
